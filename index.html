rce": "Aster practice", "question": "The number of significant figures in 0.007300 is:", "options": ["2", "4", "3", "6"], "correctAnswer": 1, "solution": "Leading zeros are not significant. The digits 7, 3 and the two trailing zeros after the decimal point count, so there are 4."}, {"id": "z2-4", "subject": "physics", "chapterId": "units", "level": "mains", "source": "Aster practice", "question": "Which of these pairs does NOT have the same dimensions?", "options": ["Work and torque", "Impulse and momentum", "Force and pressure", "Energy and heat"], "correctAnswer": 2, "solution": "Force is MLT⁻² but pressure is ML⁻¹T⁻². The other pairs share the same dimensions."}, {"id": "z2-5", "subject": "physics", "chapterId": "emi", "level": "mains", "source": "Aster practice", "question": "A conducting rod of length 0.5 m moves at 4 m/s perpendicular to a magnetic field of 0.2 T. The induced emf is:", "options": ["0.4 V", "0.2 V", "0.8 V", "4 V"], "correctAnswer": 0, "solution": "emf = Bℓv = 0.2 × 0.5 × 4 = 0.4 V."}, {"id": "z2-6", "subject": "physics", "chapterId": "emi", "level": "mains", "source": "Aster practice", "question": "A coil of self-inductance 2 H carries a current of 3 A. The energy stored in it is:", "options": ["3 J", "6 J", "9 J", "18 J"], "correctAnswer": 2, "solution": "U = ½LI² = ½ × 2 × 9 = 9 J."}, {"id": "z2-7", "subject": "physics", "chapterId": "emi", "level": "mains", "source": "Aster practice", "question": "An ideal transformer has 100 primary turns and 500 secondary turns. If the primary voltage is 20 V, the secondary voltage is:", "options": ["4 V", "100 V", "20 V", "500 V"], "correctAnswer": 1, "solution": "Vs/Vp = Ns/Np, so Vs = 20 × 500/100 = 100 V."}, {"id": "z2-8", "subject": "physics", "chapterId": "emi", "level": "mains", "source": "Aster practice", "question": "In a series LCR circuit at resonance, the current is:", "options": ["minimum", "zero", "leading the voltage by 90°", "maximum"], "correctAnswer": 3, "solution": "At resonance X_L = X_C, so the impedance is minimum (equal to R) and the current is maximum, in phase with the voltage."}, {"id": "z2-9", "subject": "physics", "chapterId": "fluids", "level": "mains", "source": "Aster practice", "question": "Water flows at 3 m/s through a pipe of cross-section 4 cm² into a section of cross-section 2 cm². The speed in the narrow section is:", "options": ["6 m/s", "1.5 m/s", "3 m/s", "12 m/s"], "correctAnswer": 0, "solution": "Equation of continuity: A₁v₁ = A₂v₂, so v₂ = 4 × 3 / 2 = 6 m/s."}, {"id": "z2-10", "subject": "physics", "chapterId": "fluids", "level": "mains", "source": "Aster practice", "question": "A small sphere of radius r falls through a viscous liquid with terminal velocity v. For a sphere of the same material with radius 2r, the terminal velocity is:", "options": ["2v", "4v", "8v", "v/2"], "correctAnswer": 1, "solution": "Terminal velocity v = 2r²(ρ − σ)g / 9η, so v ∝ r². Doubling r gives 4v."}, {"id": "z2-11", "subject": "physics", "chapterId": "fluids", "level": "mains", "source": "Aster practice", "question": "Water rises to a height h in a capillary tube of radius r. In a tube of radius r/2 it rises to:", "options": ["h/2", "h", "2h", "4h"], "correctAnswer": 2, "solution": "h = 2T cosθ / (rρg), so h ∝ 1/r. Halving r doubles the rise."}, {"id": "z2-12", "subject": "physics", "chapterId": "fluids", "level": "mains", "source": "Aster practice", "question": "A wire of length L and area of cross-section A is stretched by a force F and extends by ΔL. Young’s modulus is:", "options": ["FL / (AΔL)", "FA / (LΔL)", "FΔL / (AL)", "AΔL / (FL)"], "correctAnswer": 0, "solution": "Y = stress / strain = (F/A) / (ΔL/L) = FL / (AΔL)."}, {"id": "z2-13", "subject": "physics", "chapterId": "thermal", "level": "mains", "source": "Aster practice", "question": "In an adiabatic expansion of an ideal gas, which quantity is zero?", "options": ["Change in internal energy", "Heat exchanged with the surroundings", "Work done by the gas", "Change in temperature"], "correctAnswer": 1, "solution": "Adiabatic means no heat flows (Q = 0). The gas does work at the cost of its internal energy, so its temperature falls."}, {"id": "z2-14", "subject": "physics", "chapterId": "thermal", "level": "mains", "source": "Aster practice", "question": "One mole of an ideal monatomic gas is heated at constant volume through 10 K. The heat supplied is (R = 8.3 J mol⁻¹K⁻¹):", "options": ["83 J", "207.5 J", "249 J", "124.5 J"], "correctAnswer": 3, "solution": "Q = nCvΔT with Cv = 3R/2 for a monatomic gas: 1.5 × 8.3 × 10 = 124.5 J."}, {"id": "z2-15", "subject": "physics", "chapterId": "thermal", "level": "mains", "source": "Aster practice", "question": "The efficiency of a Carnot engine working between 27 °C and 327 °C is:", "options": ["50%", "25%", "75%", "90%"], "correctAnswer": 0, "solution": "T₁ = 600 K, T₂ = 300 K. Efficiency = 1 − 300/600 = 0.5 = 50%."}, {"id": "z2-16", "subject": "physics", "chapterId": "thermal", "level": "mains", "source": "Aster practice", "question": "The rms speed of the molecules of a gas doubles when the absolute temperature:", "options": ["becomes twice", "becomes four times", "becomes half", "stays the same"], "correctAnswer": 1, "solution": "v_rms ∝ √T. Doubling the speed needs a four-fold temperature."}, {"id": "z2-17", "subject": "physics", "chapterId": "waves", "level": "mains", "source": "Aster practice", "question": "A wave has frequency 500 Hz and wavelength 0.6 m. Its speed is:", "options": ["833 m/s", "3000 m/s", "300 m/s", "30 m/s"], "correctAnswer": 2, "solution": "v = fλ = 500 × 0.6 = 300 m/s."}, {"id": "z2-18", "subject": "physics", "chapterId": "waves", "level": "mains", "source": "Aster practice", "question": "A string fixed at both ends vibrates with a fundamental frequency of 100 Hz. The frequency of its third harmonic is:", "options": ["300 Hz", "200 Hz", "400 Hz", "150 Hz"], "correctAnswer": 0, "solution": "For a string, the nth harmonic has frequency n times the fundamental, so the third is 300 Hz."}, {"id": "z2-19", "subject": "physics", "chapterId": "waves", "level": "mains", "source": "Aster practice", "question": "Two tuning forks of frequencies 256 Hz and 260 Hz are sounded together. The beat frequency is:", "options": ["2 Hz", "8 Hz", "4 Hz", "516 Hz"], "correctAnswer": 2, "solution": "Beat frequency = |f₁ − f₂| = 4 Hz."}, {"id": "z2-20", "subject": "physics", "chapterId": "waves", "level": "mains", "source": "Aster practice", "question": "A closed organ pipe of length 0.5 m has a fundamental frequency of (speed of sound = 340 m/s):", "options": ["340 Hz", "170 Hz", "680 Hz", "85 Hz"], "correctAnswer": 1, "solution": "For a closed pipe f = v / 4L = 340 / (4 × 0.5) = 170 Hz."}, {"id": "z2-21", "subject": "physics", "chapterId": "rotation", "level": "advanced", "source": "Aster advanced practice", "question": "A uniform solid sphere of mass M and radius R rolls without slipping down an incline of angle θ. The acceleration of its centre of mass is:", "options": ["g sinθ", "(2/3) g sinθ", "(3/5) g sinθ", "(5/7) g sinθ"], "correctAnswer": 3, "solution": "a = g sinθ / (1 + I/MR²) with I = (2/5)MR², so a = g sinθ / (7/5) = (5/7) g sinθ."}, {"id": "z2-22", "subject": "physics", "chapterId": "magnetism", "level": "advanced", "source": "Aster advanced practice", "question": "A particle of charge q and mass m moves in a circle in a uniform magnetic field B, perpendicular to its velocity. Its time period is:", "options": ["2πmv / (qB)", "2πqB / m", "2πm / (qB)", "mv / (qB)"], "correctAnswer": 2, "solution": "qvB = mv²/r gives r = mv/(qB), and T = 2πr/v = 2πm/(qB). It is independent of the speed."}, {"id": "z2-23", "subject": "physics", "chapterId": "kinematics", "level": "advanced", "source": "Aster advanced practice", "question": "A ball is projected with speed u at 45° to the horizontal. The radius of curvature of its path at the highest point is:", "options": ["u² / g", "u² / (4g)", "2u² / g", "u² / (2g)"], "correctAnswer": 3, "solution": "At the top the speed is u cos45° = u/√2 and the only acceleration is g, directed towards the centre. R = v²/g = u² / (2g)."}, {"id": "z2-24", "subject": "chemistry", "chapterId": "chem-solutions", "level": "mains", "source": "Aster practice", "question": "The molality of a solution containing 4 g of NaOH (molar mass 40 g/mol) in 500 g of water is:", "options": ["0.1 m", "0.4 m", "0.2 m", "0.8 m"], "correctAnswer": 2, "solution": "Moles = 4/40 = 0.1. Mass of solvent = 0.5 kg. Molality = 0.1/0.5 = 0.2 m."}, {"id": "z2-25", "subject": "chemistry", "chapterId": "chem-solutions", "level": "mains", "source": "Aster practice", "question": "Which colligative property is best suited for finding the molar mass of a polymer?", "options": ["Elevation of boiling point", "Depression of freezing point", "Osmotic pressure", "Lowering of vapour pressure"], "correctAnswer": 2, "solution": "Osmotic pressure gives a measurable value even for very dilute solutions at room temperature, unlike the other properties whose changes are too small for large molecules."}, {"id": "z2-26", "subject": "chemistry", "chapterId": "chem-solutions", "level": "mains", "source": "Aster practice", "question": "The van’t Hoff factor for complete dissociation of Al₂(SO₄)₃ is:", "options": ["5", "2", "3", "4"], "correctAnswer": 0, "solution": "Al₂(SO₄)₃ gives 2 Al³⁺ and 3 SO₄²⁻, a total of 5 ions, so i = 5."}, {"id": "z2-27", "subject": "chemistry", "chapterId": "chem-solutions", "level": "mains", "source": "Aster practice", "question": "A solution that shows positive deviation from Raoult’s law has:", "options": ["ΔmixH < 0", "ΔmixV < 0", "ΔmixH > 0", "ΔmixH = 0 and ΔmixV = 0"], "correctAnswer": 2, "solution": "In positive deviation, A–B attractions are weaker than A–A and B–B, so mixing absorbs heat (ΔmixH > 0) and volume increases (ΔmixV > 0)."}, {"id": "z2-28", "subject": "chemistry", "chapterId": "chem-kinetics", "level": "mains", "source": "Aster practice", "question": "For a first-order reaction, 75% of the reactant is consumed in 20 minutes. Its half-life is:", "options": ["10 min", "5 min", "20 min", "40 min"], "correctAnswer": 0, "solution": "75% completion takes two half-lives (100 → 50 → 25). So 2 t½ = 20 min and t½ = 10 min."}, {"id": "z2-29", "subject": "chemistry", "chapterId": "chem-kinetics", "level": "mains", "source": "Aster practice", "question": "The unit of the rate constant of a second-order reaction (concentration in mol L⁻¹, time in s) is:", "options": ["L mol⁻¹ s⁻¹", "s⁻¹", "mol L⁻¹ s⁻¹", "L² mol⁻² s⁻¹"], "correctAnswer": 0, "solution": "Rate = k[A]². So k = (mol L⁻¹ s⁻¹) / (mol L⁻¹)² = L mol⁻¹ s⁻¹."}, {"id": "z2-30", "subject": "chemistry", "chapterId": "chem-kinetics", "level": "mains", "source": "Aster practice", "question": "A plot of ln k against 1/T is a straight line whose slope is:", "options": ["−Eₐ / R", "Eₐ / R", "−Eₐ", "ln A"], "correctAnswer": 0, "solution": "The Arrhenius equation ln k = ln A − Eₐ/(RT) is a line in 1/T with slope −Eₐ/R."}, {"id": "z2-31", "subject": "chemistry", "chapterId": "chem-coord", "level": "mains", "source": "Aster practice", "question": "The coordination number of cobalt in [Co(NH₃)₄Cl₂]⁺ is:", "options": ["2", "6", "4", "3"], "correctAnswer": 1, "solution": "Four NH₃ and two Cl⁻ are all monodentate ligands, giving 4 + 2 = 6 donor atoms."}, {"id": "z2-32", "subject": "chemistry", "chapterId": "chem-coord", "level": "mains", "source": "Aster practice", "question": "The IUPAC name of K₃[Fe(CN)₆] is:", "options": ["potassium hexacyanoferrate(II)", "potassium hexacyanoferrate(III)", "potassium hexacyanoiron(III)", "tripotassium cyanoferrate(III)"], "correctAnswer": 1, "solution": "The complex ion is [Fe(CN)₆]³⁻. Six CN⁻ give −6, so iron is +3. Anionic complexes use the ‘-ate’ ending (ferrate)."}, {"id": "z2-33", "subject": "chemistry", "chapterId": "chem-coord", "level": "mains", "source": "Aster practice", "question": "The number of unpaired electrons in the octahedral complex [Fe(CN)₆]⁴⁻ is:", "options": ["2", "4", "0", "6"], "correctAnswer": 2, "solution": "Fe²⁺ is d⁶. CN⁻ is a strong field ligand, so the electrons pair up in t₂g⁶ (low spin) and there are no unpaired electrons."}, {"id": "z2-34", "subject": "chemistry", "chapterId": "chem-coord", "level": "mains", "source": "Aster practice", "question": "Which of the following shows geometrical isomerism?", "options": ["[Zn(NH₃)₄]²⁺ (tetrahedral)", "[Co(NH₃)₆]³⁺", "[Ni(CO)₄]", "[Pt(NH₃)₂Cl₂] (square planar)"], "correctAnswer": 3, "solution": "Square planar MA₂B₂ complexes exist as cis and trans isomers. The tetrahedral and the MA₆ complexes listed cannot."}, {"id": "z2-35", "subject": "chemistry", "chapterId": "chem-dblock", "level": "mains", "source": "Aster practice", "question": "The most common oxidation state of the lanthanoids is:", "options": ["+2", "+4", "+3", "+5"], "correctAnswer": 2, "solution": "Lanthanoids lose their two 6s electrons and one 4f/5d electron, so +3 is the characteristic oxidation state."}, {"id": "z2-36", "subject": "chemistry", "chapterId": "chem-dblock", "level": "mains", "source": "Aster practice", "question": "Which of the following ions is colourless in aqueous solution?", "options": ["Sc³⁺", "Ti³⁺", "Cr³⁺", "Fe³⁺"], "correctAnswer": 0, "solution": "Colour arises from d–d transitions. Sc³⁺ has a d⁰ configuration, so there are no d electrons to excite."}, {"id": "z2-37", "subject": "chemistry", "chapterId": "chem-dblock", "level": "mains", "source": "Aster practice", "question": "In acidic medium, KMnO₄ is reduced to:", "options": ["MnO₂", "MnO₄²⁻", "Mn²⁺", "Mn³⁺"], "correctAnswer": 2, "solution": "In acidic solution, MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O. MnO₂ forms in neutral solution and MnO₄²⁻ in strongly alkaline solution."}, {"id": "z2-38", "subject": "chemistry", "chapterId": "chem-dblock", "level": "mains", "source": "Aster practice", "question": "The spin-only magnetic moment of Mn²⁺ (Z = 25) is about:", "options": ["3.87 BM", "5.92 BM", "4.90 BM", "1.73 BM"], "correctAnswer": 1, "solution": "Mn²⁺ is d⁵ with 5 unpaired electrons. μ = √(n(n + 2)) = √35 ≈ 5.92 BM."}, {"id": "z2-39", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "The shape of XeF₄ is:", "options": ["tetrahedral", "square planar", "see-saw", "octahedral"], "correctAnswer": 1, "solution": "Xe has 4 bond pairs and 2 lone pairs (6 electron pairs, octahedral arrangement). The lone pairs sit opposite each other, giving a square planar molecule."}, {"id": "z2-40", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "The hybridisation of phosphorus in PCl₅ is:", "options": ["sp³", "sp³d", "sp³d²", "sp²d"], "correctAnswer": 1, "solution": "Five bond pairs and no lone pair means five hybrid orbitals: sp³d, giving a trigonal bipyramidal shape."}, {"id": "z2-41", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "Depletion of the ozone layer is mainly caused by:", "options": ["chlorofluorocarbons (CFCs)", "carbon dioxide", "sulphur dioxide", "methane"], "correctAnswer": 0, "solution": "In the stratosphere, UV light splits CFCs to release chlorine atoms that catalytically destroy ozone."}, {"id": "z2-42", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "Boric acid, B(OH)₃, behaves as a weak acid because it:", "options": ["donates a proton directly", "accepts an OH⁻ ion from water", "is insoluble in water", "contains a B–B bond"], "correctAnswer": 1, "solution": "It is a Lewis acid: B(OH)₃ + H₂O → [B(OH)₄]⁻ + H⁺. The H⁺ comes from water, not from boric acid itself."}, {"id": "z2-43", "subject": "chemistry", "chapterId": "chem-hydrocarbons", "level": "mains", "source": "Aster practice", "question": "Ethyne is converted into ethanal (acetaldehyde) by:", "options": ["Lindlar’s catalyst", "Na in liquid NH₃", "dilute H₂SO₄ with HgSO₄", "dilute H₂SO₄ alone"], "correctAnswer": 2, "solution": "Hydration of ethyne in the presence of Hg²⁺ gives the unstable vinyl alcohol, which rearranges to ethanal."}, {"id": "z2-44", "subject": "chemistry", "chapterId": "chem-hydrocarbons", "level": "mains", "source": "Aster practice", "question": "The addition of HBr to propene in the presence of a peroxide gives mainly:", "options": ["1-bromopropane", "2-bromopropane", "1,2-dibromopropane", "allyl bromide"], "correctAnswer": 0, "solution": "With peroxides the addition follows a free-radical path and is anti-Markovnikov, so Br ends up on the terminal carbon."}, {"id": "z2-45", "subject": "chemistry", "chapterId": "chem-hydrocarbons", "level": "mains", "source": "Aster practice", "question": "Which of the following is aromatic?", "options": ["Cyclobutadiene", "Cyclooctatetraene", "Cyclopentadiene", "Benzene"], "correctAnswer": 3, "solution": "Benzene is planar, cyclic, fully conjugated and has 6 π electrons (4n + 2 with n = 1). Cyclobutadiene is antiaromatic and the other two are not fully conjugated rings."}, {"id": "z2-46", "subject": "chemistry", "chapterId": "chem-hydrocarbons", "level": "mains", "source": "Aster practice", "question": "Ozonolysis of 2-butene followed by reduction with Zn/H₂O gives:", "options": ["propanal", "two molecules of ethanal", "ethanoic acid", "butanone"], "correctAnswer": 1, "solution": "CH₃CH=CHCH₃ splits at the double bond into two CH₃CHO molecules."}, {"id": "z2-47", "subject": "chemistry", "chapterId": "chem-oxygen", "level": "mains", "source": "Aster practice", "question": "Which test distinguishes an aldehyde from a ketone?", "options": ["Lucas test", "Hinsberg test", "Carbylamine test", "Tollens’ test"], "correctAnswer": 3, "solution": "Aldehydes reduce Tollens’ reagent to give a silver mirror. Ketones do not."}, {"id": "z2-48", "subject": "chemistry", "chapterId": "chem-oxygen", "level": "mains", "source": "Aster practice", "question": "Which of the following gives a positive iodoform test?", "options": ["Methanol", "1-propanol", "Benzaldehyde", "Ethanol"], "correctAnswer": 3, "solution": "The iodoform test needs a CH₃CO– or CH₃CH(OH)– group. Ethanol is oxidised to ethanal, which has the CH₃CO– group."}, {"id": "z2-49", "subject": "chemistry", "chapterId": "chem-oxygen", "level": "mains", "source": "Aster practice", "question": "An aldehyde with no α-hydrogen reacts with concentrated NaOH to give an alcohol and a carboxylate. This reaction is called:", "options": ["Cannizzaro reaction", "aldol condensation", "Clemmensen reduction", "Rosenmund reduction"], "correctAnswer": 0, "solution": "Cannizzaro reaction is the self redox disproportionation of aldehydes without α-hydrogen, such as HCHO and C₆H₅CHO."}, {"id": "z2-50", "subject": "chemistry", "chapterId": "chem-oxygen", "level": "mains", "source": "Aster practice", "question": "Phenol is more acidic than ethanol because:", "options": ["the phenoxide ion is stabilised by resonance", "ethanol has a higher molar mass", "phenol is less soluble in water", "ethanol forms hydrogen bonds"], "correctAnswer": 0, "solution": "The negative charge of the phenoxide ion is delocalised into the benzene ring, while the ethoxide ion has no such stabilisation."}, {"id": "z2-51", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "In an SN2 reaction at a chiral carbon, the product has:", "options": ["retention of configuration", "inversion of configuration", "a racemic mixture", "no change in configuration"], "correctAnswer": 1, "solution": "The nucleophile attacks from the side opposite to the leaving group, which inverts the configuration (Walden inversion)."}, {"id": "z2-52", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Which of the following reacts fastest by the SN1 mechanism?", "options": ["CH₃–Br", "CH₃CH₂–Br", "(CH₃)₃C–Br", "(CH₃)₂CH–Br"], "correctAnswer": 2, "solution": "SN1 goes through a carbocation, and the tertiary carbocation is the most stable."}, {"id": "z2-53", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "The Finkelstein reaction converts an alkyl chloride into an alkyl iodide using:", "options": ["AgF", "KCN in ethanol", "NaI in dry acetone", "Zn/HCl"], "correctAnswer": 2, "solution": "NaI is soluble in acetone but NaCl is not, so NaCl precipitates and drives the reaction forward."}, {"id": "z2-54", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Chloroform is stored in dark, completely filled bottles because it:", "options": ["is very volatile", "is explosive", "absorbs moisture", "forms poisonous phosgene in air and light"], "correctAnswer": 3, "solution": "Light and air oxidise CHCl₃ to carbonyl chloride (phosgene, COCl₂), which is highly toxic."}, {"id": "z2-55", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Which test is given only by primary amines?", "options": ["Lucas test", "Fehling’s test", "Carbylamine test", "Iodoform test"], "correctAnswer": 2, "solution": "Only primary amines react with CHCl₃ and alcoholic KOH to give a foul-smelling isocyanide."}, {"id": "z2-56", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Hofmann bromamide degradation of propanamide (CH₃CH₂CONH₂) gives:", "options": ["ethylamine", "propylamine", "methylamine", "butylamine"], "correctAnswer": 0, "solution": "The amide loses its carbonyl carbon, so the amine has one carbon fewer: C₂H₅NH₂."}, {"id": "z2-57", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Which is the strongest base in aqueous solution?", "options": ["(CH₃)₂NH", "NH₃", "CH₃NH₂", "(CH₃)₃N"], "correctAnswer": 0, "solution": "For methyl amines in water the order is (CH₃)₂NH > CH₃NH₂ > (CH₃)₃N > NH₃, from the balance of the inductive effect and solvation."}, {"id": "z2-58", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Benzenediazonium chloride on treatment with CuCN gives:", "options": ["aniline", "phenol", "nitrobenzene", "benzonitrile"], "correctAnswer": 3, "solution": "This is the Sandmeyer reaction: the diazonium group is replaced by –CN."}, {"id": "z2-59", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "Which of the following is a non-reducing sugar?", "options": ["Glucose", "Maltose", "Lactose", "Sucrose"], "correctAnswer": 3, "solution": "In sucrose both anomeric carbons are tied up in the glycosidic bond, so it has no free aldehyde or ketone group."}, {"id": "z2-60", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "Amino acids in a protein are joined by:", "options": ["glycosidic bonds", "ester bonds", "peptide bonds", "phosphodiester bonds"], "correctAnswer": 2, "solution": "The –COOH of one amino acid condenses with the –NH₂ of the next to form a –CO–NH– peptide bond."}, {"id": "z2-61", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "Which statement about RNA is correct?", "options": ["It contains deoxyribose", "It is always double stranded", "It contains thymine and no uracil", "It contains uracil in place of thymine"], "correctAnswer": 3, "solution": "RNA has ribose sugar, the bases A, G, C and U, and is generally single stranded."}, {"id": "z2-62", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "Which of the following vitamins is water soluble?", "options": ["Vitamin C", "Vitamin A", "Vitamin D", "Vitamin K"], "correctAnswer": 0, "solution": "Vitamins A, D, E and K are fat soluble. B-complex vitamins and vitamin C are water soluble."}, {"id": "z2-63", "subject": "chemistry", "chapterId": "chem-coord", "level": "advanced", "source": "Aster advanced practice", "question": "Among the following, the complex of Co³⁺ with the largest crystal field splitting Δ₀ is:", "options": ["[CoF₆]³⁻", "[Co(H₂O)₆]³⁺", "[Co(NH₃)₆]³⁺", "[Co(CN)₆]³⁻"], "correctAnswer": 3, "solution": "In the spectrochemical series CN⁻ > NH₃ > H₂O > F⁻, so cyanide produces the largest splitting."}, {"id": "z2-64", "subject": "chemistry", "chapterId": "chem-thermodynamics", "level": "advanced", "source": "Aster advanced practice", "question": "For a reaction at 300 K, ΔH = −40 kJ mol⁻¹ and ΔS = −100 J mol⁻¹K⁻¹. The value of ΔG is:", "options": ["−70 kJ mol⁻¹", "+10 kJ mol⁻¹", "+70 kJ mol⁻¹", "−10 kJ mol⁻¹"], "correctAnswer": 3, "solution": "ΔG = ΔH − TΔS = −40 000 − 300(−100) = −40 000 + 30 000 = −10 000 J, so −10 kJ mol⁻¹."}, {"id": "z2-65", "subject": "chemistry", "chapterId": "chem-goc", "level": "advanced", "source": "Aster advanced practice", "question": "The number of stereoisomers of 2,3-dibromobutane is:", "options": ["2", "3", "4", "1"], "correctAnswer": 1, "solution": "It has two identical stereocentres, so there is one meso form and one pair of enantiomers: 3 stereoisomers in total."}, {"id": "z2-66", "subject": "mathematics", "chapterId": "math-sets", "level": "mains", "source": "Aster practice", "question": "If n(A) = 3 and n(B) = 2, the number of relations from A to B is:", "options": ["6", "8", "64", "32"], "correctAnswer": 2, "solution": "A × B has 6 elements, and every subset of A × B is a relation: 2⁶ = 64."}, {"id": "z2-67", "subject": "mathematics", "chapterId": "math-sets", "level": "mains", "source": "Aster practice", "question": "In a class of 60 students, 35 play cricket, 30 play football and 10 play both. The number of students who play neither is:", "options": ["10", "5", "15", "0"], "correctAnswer": 1, "solution": "n(C ∪ F) = 35 + 30 − 10 = 55. So 60 − 55 = 5 play neither."}, {"id": "z2-68", "subject": "mathematics", "chapterId": "math-sets", "level": "mains", "source": "Aster practice", "question": "The function f: R → R defined by f(x) = x² is:", "options": ["one-one but not onto", "neither one-one nor onto", "onto but not one-one", "both one-one and onto"], "correctAnswer": 1, "solution": "f(2) = f(−2) so it is not one-one, and negative numbers are never attained, so it is not onto."}, {"id": "z2-69", "subject": "mathematics", "chapterId": "math-sets", "level": "mains", "source": "Aster practice", "question": "The number of subsets of a 4-element set A that contain a particular element is:", "options": ["4", "8", "15", "16"], "correctAnswer": 1, "solution": "Fix the element in the subset and choose any subset of the other 3 elements: 2³ = 8."}, {"id": "z2-70", "subject": "mathematics", "chapterId": "math-binomial", "level": "mains", "source": "Aster practice", "question": "The coefficient of x³ in the expansion of (1 + x)⁶ is:", "options": ["15", "20", "30", "6"], "correctAnswer": 1, "solution": "The coefficient is ⁶C₃ = 20."}, {"id": "z2-71", "subject": "mathematics", "chapterId": "math-binomial", "level": "mains", "source": "Aster practice", "question": "The middle term in the expansion of (x + 1/x)⁸ is:", "options": ["70", "56", "28", "8"], "correctAnswer": 0, "solution": "With n = 8 the middle term is T₅ = ⁸C₄ x⁴(1/x)⁴ = 70."}, {"id": "z2-72", "subject": "mathematics", "chapterId": "math-binomial", "level": "mains", "source": "Aster practice", "question": "The remainder when 9¹⁰ is divided by 8 is:", "options": ["0", "1", "7", "2"], "correctAnswer": 1, "solution": "9 = 8 + 1, so 9¹⁰ = (1 + 8)¹⁰ = 1 + 10·8 + …, leaving remainder 1."}, {"id": "z2-73", "subject": "mathematics", "chapterId": "math-binomial", "level": "mains", "source": "Aster practice", "question": "The sum of the coefficients in the expansion of (2x + 3y)⁴ is:", "options": ["16", "81", "256", "625"], "correctAnswer": 3, "solution": "Put x = y = 1: (2 + 3)⁴ = 5⁴ = 625."}, {"id": "z2-74", "subject": "mathematics", "chapterId": "math-coord", "level": "mains", "source": "Aster practice", "question": "The distance between the parallel lines 3x + 4y = 5 and 3x + 4y = 15 is:", "options": ["1", "2", "5", "10"], "correctAnswer": 1, "solution": "Write them as 3x + 4y − 5 = 0 and 3x + 4y − 15 = 0. Distance = |−5 − (−15)| / √(9 + 16) = 10/5 = 2."}, {"id": "z2-75", "subject": "mathematics", "chapterId": "math-coord", "level": "mains", "source": "Aster practice", "question": "The radius of the circle x² + y² − 6x + 8y − 11 = 0 is:", "options": ["4", "5", "36", "6"], "correctAnswer": 3, "solution": "Here g = −3, f = 4, c = −11. Radius = √(g² + f² − c) = √(9 + 16 + 11) = 6."}, {"id": "z2-76", "subject": "mathematics", "chapterId": "math-coord", "level": "mains", "source": "Aster practice", "question": "The eccentricity of the ellipse x²/25 + y²/16 = 1 is:", "options": ["3/5", "4/5", "5/3", "9/25"], "correctAnswer": 0, "solution": "a² = 25 and b² = 16. e = √(1 − b²/a²) = √(1 − 16/25) = 3/5."}, {"id": "z2-77", "subject": "mathematics", "chapterId": "math-coord", "level": "mains", "source": "Aster practice", "question": "The focus of the parabola y² = 8x is:", "options": ["(2, 0)", "(8, 0)", "(4, 0)", "(0, 2)"], "correctAnswer": 0, "solution": "Compare with y² = 4ax: 4a = 8 so a = 2. The focus is (a, 0) = (2, 0)."}, {"id": "z2-78", "subject": "mathematics", "chapterId": "math-trig", "level": "mains", "source": "Aster practice", "question": "The value of sin 75° is:", "options": ["(√6 − √2) / 4", "(√3 + 1) / 2", "√3 / 2", "(√6 + √2) / 4"], "correctAnswer": 3, "solution": "sin(45° + 30°) = sin45° cos30° + cos45° sin30° = (√3 + 1) / (2√2) = (√6 + √2) / 4."}, {"id": "z2-79", "subject": "mathematics", "chapterId": "math-trig", "level": "mains", "source": "Aster practice", "question": "The principal value of sin⁻¹(−1/2) is:", "options": ["−π/6", "π/6", "5π/6", "−π/3"], "correctAnswer": 0, "solution": "sin(−π/6) = −1/2 and −π/6 lies in [−π/2, π/2]."}, {"id": "z2-80", "subject": "mathematics", "chapterId": "math-trig", "level": "mains", "source": "Aster practice", "question": "The general solution of tan x = √3 is:", "options": ["x = nπ ± π/3", "x = 2nπ + π/3", "x = nπ + π/6", "x = nπ + π/3"], "correctAnswer": 3, "solution": "tan x = tan(π/3), so x = nπ + π/3 for any integer n."}, {"id": "z2-81", "subject": "mathematics", "chapterId": "math-trig", "level": "mains", "source": "Aster practice", "question": "If sin θ + cos θ = √2 for 0 ≤ θ ≤ π/2, then θ equals:", "options": ["π/6", "π/3", "π/4", "π/2"], "correctAnswer": 2, "solution": "sinθ + cosθ = √2 sin(θ + π/4). This equals √2 only when θ + π/4 = π/2, so θ = π/4."}, {"id": "z2-82", "subject": "mathematics", "chapterId": "math-vectors", "level": "mains", "source": "Aster practice", "question": "If a = 2i + j − k and b = i − 2j + 3k, then a·b is:", "options": ["3", "7", "−3", "1"], "correctAnswer": 2, "solution": "a·b = (2)(1) + (1)(−2) + (−1)(3) = 2 − 2 − 3 = −3."}, {"id": "z2-83", "subject": "mathematics", "chapterId": "math-vectors", "level": "mains", "source": "Aster practice", "question": "The area of the parallelogram with adjacent sides a = i + j and b = j + k is:", "options": ["√2", "2", "1", "√3"], "correctAnswer": 3, "solution": "a × b = (1, −1, 1), so the area is |a × b| = √3."}, {"id": "z2-84", "subject": "mathematics", "chapterId": "math-vectors", "level": "mains", "source": "Aster practice", "question": "The distance of the point (1, 2, 3) from the plane x + y + z = 0 is:", "options": ["√3", "3√2", "2√3", "6"], "correctAnswer": 2, "solution": "Distance = |1 + 2 + 3| / √(1 + 1 + 1) = 6/√3 = 2√3."}, {"id": "z2-85", "subject": "mathematics", "chapterId": "math-vectors", "level": "mains", "source": "Aster practice", "question": "The vectors 2i + 3j + 4k and 4i + 6j + λk are parallel when λ equals:", "options": ["8", "4", "6", "12"], "correctAnswer": 0, "solution": "Parallel vectors have proportional components: 2/4 = 3/6 = 4/λ, so λ = 8."}, {"id": "z2-86", "subject": "mathematics", "chapterId": "math-pnc", "level": "mains", "source": "Aster practice", "question": "The number of 3-digit numbers that can be formed from the digits 1, 2, 3, 4, 5 without repetition is:", "options": ["125", "60", "120", "30"], "correctAnswer": 1, "solution": "⁵P₃ = 5 × 4 × 3 = 60."}, {"id": "z2-87", "subject": "mathematics", "chapterId": "math-pnc", "level": "mains", "source": "Aster practice", "question": "The number of ways in which 5 people can sit around a circular table is:", "options": ["120", "60", "12", "24"], "correctAnswer": 3, "solution": "Circular arrangements of n distinct objects: (n − 1)! = 4! = 24."}, {"id": "z2-88", "subject": "mathematics", "chapterId": "math-pnc", "level": "mains", "source": "Aster practice", "question": "A committee of 3 is chosen from 5 men and 2 women so that it has at least one woman. The number of ways is:", "options": ["35", "20", "30", "25"], "correctAnswer": 3, "solution": "Total ways ⁷C₃ = 35. With no woman: ⁵C₃ = 10. So 35 − 10 = 25."}, {"id": "z2-89", "subject": "mathematics", "chapterId": "math-pnc", "level": "mains", "source": "Aster practice", "question": "The number of distinct arrangements of the letters of the word LEVEL is:", "options": ["30", "60", "120", "15"], "correctAnswer": 0, "solution": "There are 5 letters with L repeated twice and E repeated twice: 5! / (2! 2!) = 30."}, {"id": "z2-90", "subject": "mathematics", "chapterId": "math-quadratic", "level": "mains", "source": "Aster practice", "question": "If 2 is a root of x² − 5x + k = 0, then k equals:", "options": ["3", "−6", "10", "6"], "correctAnswer": 3, "solution": "Substitute x = 2: 4 − 10 + k = 0, so k = 6."}, {"id": "z2-91", "subject": "mathematics", "chapterId": "math-quadratic", "level": "mains", "source": "Aster practice", "question": "The roots of 2x² − 4x + 3 = 0 are:", "options": ["complex conjugates", "real and distinct", "real and equal", "rational"], "correctAnswer": 0, "solution": "Discriminant D = 16 − 24 = −8 < 0, so the roots are non-real complex conjugates."}, {"id": "z2-92", "subject": "mathematics", "chapterId": "math-quadratic", "level": "mains", "source": "Aster practice", "question": "If α and β are the roots of x² − 3x + 1 = 0, then α² + β² equals:", "options": ["5", "9", "11", "7"], "correctAnswer": 3, "solution": "α + β = 3 and αβ = 1. α² + β² = (α + β)² − 2αβ = 9 − 2 = 7."}, {"id": "z2-93", "subject": "mathematics", "chapterId": "math-diffeq", "level": "mains", "source": "Aster practice", "question": "The order and degree of (d²y/dx²)³ + (dy/dx)² = x are respectively:", "options": ["3 and 2", "2 and 2", "2 and 3", "1 and 3"], "correctAnswer": 2, "solution": "The highest derivative is d²y/dx², so the order is 2. Its power is 3, so the degree is 3."}, {"id": "z2-94", "subject": "mathematics", "chapterId": "math-diffeq", "level": "mains", "source": "Aster practice", "question": "The general solution of dy/dx = y is:", "options": ["y = C + eˣ", "y = Cx", "y = Ceˣ", "y = x² + C"], "correctAnswer": 2, "solution": "Separate variables: dy/y = dx, so ln y = x + c, giving y = Ceˣ."}, {"id": "z2-95", "subject": "mathematics", "chapterId": "math-diffeq", "level": "mains", "source": "Aster practice", "question": "The integrating factor of dy/dx + (2/x) y = x is:", "options": ["x²", "x", "1/x²", "eˣ"], "correctAnswer": 0, "solution": "IF = e^(∫ 2/x dx) = e^(2 ln x) = x²."}, {"id": "z2-96", "subject": "mathematics", "chapterId": "math-stats", "level": "mains", "source": "Aster practice", "question": "The variance of the first 5 natural numbers is:", "options": ["2", "2.5", "3", "5"], "correctAnswer": 0, "solution": "For the first n natural numbers variance = (n² − 1)/12 = 24/12 = 2."}, {"id": "z2-97", "subject": "mathematics", "chapterId": "math-stats", "level": "mains", "source": "Aster practice", "question": "If 5 is added to every observation of a data set, the standard deviation:", "options": ["increases by 5", "remains unchanged", "increases by 25", "becomes zero"], "correctAnswer": 1, "solution": "Adding a constant shifts the mean but not the spread, so the standard deviation is unchanged."}, {"id": "z2-98", "subject": "mathematics", "chapterId": "math-stats", "level": "mains", "source": "Aster practice", "question": "The mean of 10 observations is 12 and the mean of another 20 observations is 18. The combined mean is:", "options": ["15", "17", "16", "15.5"], "correctAnswer": 2, "solution": "Combined mean = (10 × 12 + 20 × 18) / 30 = 480/30 = 16."}, {"id": "z2-99", "subject": "mathematics", "chapterId": "math-stats", "level": "mains", "source": "Aster practice", "question": "The standard deviation of the data 2, 4, 6, 8 is:", "options": ["5", "2", "√10", "√5"], "correctAnswer": 3, "solution": "Mean = 5. Squared deviations: 9, 1, 1, 9, total 20. Variance = 20/4 = 5, so the standard deviation is √5."}, {"id": "z2-100", "subject": "mathematics", "chapterId": "math-calculus", "level": "advanced", "source": "Aster advanced practice", "question": "The number of real roots of x³ − 6x² + 9x + 1 = 0 is:", "options": ["0", "2", "1", "3"], "correctAnswer": 2, "solution": "f′(x) = 3(x − 1)(x − 3). f(1) = 5 is the local maximum and f(3) = 1 is the local minimum, both positive, so the graph crosses the x-axis only once (for x < 0)."}, {"id": "z2-101", "subject": "mathematics", "chapterId": "math-calculus", "level": "advanced", "source": "Aster advanced practice", "question": "The value of ∫₀^(π/2) sin x / (sin x + cos x) dx is:", "options": ["π/2", "1", "π/8", "π/4"], "correctAnswer": 3, "solution": "Using the property ∫f(x)dx = ∫f(a − x)dx, I = ∫cos x/(sin x + cos x) dx. Adding gives 2I = ∫₀^(π/2) 1 dx = π/2, so I = π/4."}, {"id": "z2-102", "subject": "mathematics", "chapterId": "math-sequences", "level": "advanced", "source": "Aster advanced practice", "question": "The sum of the first n terms of an arithmetic progression is 3n² + 2n. Its common difference is:", "options": ["3", "6", "5", "2"], "correctAnswer": 1, "solution": "Sₙ = (d/2)n² + (a − d/2)n, so d/2 = 3 and d = 6. (Check: a₁ = 5, a₂ = 11.)"}]);
questionBank.push(...[{"id": "z3-1", "subject": "physics", "chapterId": "modern-physics", "level": "mains", "source": "Aster practice", "question": "The work function of a metal is 2 eV. The threshold wavelength is (take hc = 1240 eV nm):", "options": ["310 nm", "620 nm", "1240 nm", "2480 nm"], "correctAnswer": 1, "solution": "λ₀ = hc / φ = 1240 / 2 = 620 nm."}, {"id": "z3-2", "subject": "physics", "chapterId": "modern-physics", "level": "mains", "source": "Aster practice", "question": "The energy of the electron in the second orbit (n = 2) of a hydrogen atom is:", "options": ["−13.6 eV", "−6.8 eV", "−1.51 eV", "−3.4 eV"], "correctAnswer": 3, "solution": "Eₙ = −13.6 / n² eV, so E₂ = −13.6/4 = −3.4 eV."}, {"id": "z3-3", "subject": "physics", "chapterId": "modern-physics", "level": "mains", "source": "Aster practice", "question": "A radioactive sample has a half-life of 10 days. The fraction left after 30 days is:", "options": ["1/2", "1/4", "1/16", "1/8"], "correctAnswer": 3, "solution": "30 days is 3 half-lives, so the fraction left is (1/2)³ = 1/8."}, {"id": "z3-4", "subject": "physics", "chapterId": "modern-physics", "level": "mains", "source": "Aster practice", "question": "If the kinetic energy of a particle is doubled, its de Broglie wavelength becomes:", "options": ["λ√2", "λ/2", "λ/√2", "2λ"], "correctAnswer": 2, "solution": "λ = h/√(2mK) ∝ K^(−1/2). Doubling K divides λ by √2."}, {"id": "z3-5", "subject": "physics", "chapterId": "units", "level": "mains", "source": "Aster practice", "question": "The SI unit of the universal gravitational constant G is:", "options": ["N m kg⁻²", "N kg² m⁻²", "N m⁻² kg²", "N m² kg⁻²"], "correctAnswer": 3, "solution": "F = Gm₁m₂/r², so G = F r² / (m₁m₂), with unit N m² kg⁻²."}, {"id": "z3-6", "subject": "physics", "chapterId": "units", "level": "mains", "source": "Aster practice", "question": "A screw gauge has a pitch of 1 mm and 100 divisions on its circular scale. Its least count is:", "options": ["0.1 mm", "0.01 mm", "0.001 mm", "1 mm"], "correctAnswer": 1, "solution": "Least count = pitch / number of divisions = 1 mm / 100 = 0.01 mm."}, {"id": "z3-7", "subject": "physics", "chapterId": "units", "level": "mains", "source": "Aster practice", "question": "The quantity 1/√(μ₀ε₀) has the dimensions of:", "options": ["acceleration", "force", "velocity", "frequency"], "correctAnswer": 2, "solution": "The speed of light in vacuum is c = 1/√(μ₀ε₀), so it has the dimensions of velocity, LT⁻¹."}, {"id": "z3-8", "subject": "physics", "chapterId": "nlm", "level": "mains", "source": "Aster practice", "question": "A net force of 10 N acts on a 2 kg block. Its acceleration is:", "options": ["0.2 m/s²", "5 m/s²", "12 m/s²", "20 m/s²"], "correctAnswer": 1, "solution": "a = F/m = 10 / 2 = 5 m/s²."}, {"id": "z3-9", "subject": "physics", "chapterId": "nlm", "level": "mains", "source": "Aster practice", "question": "A 5 kg block rests on a rough horizontal surface with μₛ = 0.4. The minimum horizontal force to start it moving is (g = 10 m/s²):", "options": ["2 N", "50 N", "20 N", "200 N"], "correctAnswer": 2, "solution": "Limiting friction = μₛmg = 0.4 × 5 × 10 = 20 N."}, {"id": "z3-10", "subject": "physics", "chapterId": "nlm", "level": "mains", "source": "Aster practice", "question": "A 60 kg person stands in a lift accelerating upward at 2 m/s². The apparent weight is (g = 10 m/s²):", "options": ["720 N", "480 N", "600 N", "120 N"], "correctAnswer": 0, "solution": "N = m(g + a) = 60 × 12 = 720 N."}, {"id": "z3-11", "subject": "physics", "chapterId": "shm", "level": "mains", "source": "Aster practice", "question": "A particle in SHM has amplitude 4 cm and time period 2 s. Its maximum speed is:", "options": ["2π cm/s", "4π cm/s", "8π cm/s", "π cm/s"], "correctAnswer": 1, "solution": "ω = 2π/T = π rad/s. vmax = ωA = 4π cm/s."}, {"id": "z3-12", "subject": "physics", "chapterId": "shm", "level": "mains", "source": "Aster practice", "question": "The mass hung on a spring is made four times larger. The time period becomes:", "options": ["twice", "half", "four times", "unchanged"], "correctAnswer": 0, "solution": "T = 2π√(m/k) ∝ √m, so quadrupling m doubles T."}, {"id": "z3-13", "subject": "physics", "chapterId": "shm", "level": "mains", "source": "Aster practice", "question": "The total energy of a particle in SHM with amplitude A and spring constant k is:", "options": ["kA²", "½kA", "2kA²", "½kA²"], "correctAnswer": 3, "solution": "At the extreme position all the energy is potential: E = ½kA²."}, {"id": "z3-14", "subject": "physics", "chapterId": "gravitation", "level": "mains", "source": "Aster practice", "question": "The escape velocity from Earth is 11.2 km/s. For a planet of the same density but twice the radius, it is:", "options": ["5.6 km/s", "11.2 km/s", "44.8 km/s", "22.4 km/s"], "correctAnswer": 3, "solution": "vₑ = √(2GM/R) = R√(8πGρ/3), so vₑ ∝ R for equal density. Doubling R doubles vₑ."}, {"id": "z3-15", "subject": "physics", "chapterId": "gravitation", "level": "mains", "source": "Aster practice", "question": "The acceleration due to gravity at a height equal to the Earth’s radius above the surface is:", "options": ["g/2", "g/9", "g/4", "g/8"], "correctAnswer": 2, "solution": "g′ = g R²/(R + h)² = g R²/(2R)² = g/4."}, {"id": "z3-16", "subject": "physics", "chapterId": "gravitation", "level": "mains", "source": "Aster practice", "question": "A satellite moves in a circular orbit around the Earth and its kinetic energy is K. Its total energy is:", "options": ["K", "K/2", "−K", "−2K"], "correctAnswer": 2, "solution": "For a circular orbit U = −2K, so E = K + U = −K."}, {"id": "z3-17", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Which of the following is a primary alkyl halide?", "options": ["(CH₃)₃CBr", "CH₃CHBrCH₃", "CH₃CH₂CH₂Br", "(CH₃)₂CBrCH₂CH₃"], "correctAnswer": 2, "solution": "In a primary alkyl halide the carbon carrying the halogen is attached to only one other carbon. That is true only for 1-bromopropane."}, {"id": "z3-18", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Chlorobenzene is less reactive than ethyl chloride in nucleophilic substitution mainly because:", "options": ["the C–Cl bond has partial double-bond character due to resonance", "the benzene ring is non-polar", "chlorine is smaller in chlorobenzene", "ethyl chloride has a higher molar mass"], "correctAnswer": 0, "solution": "The lone pair on Cl is delocalised into the ring, which shortens and strengthens the C–Cl bond, and the carbon is sp² hybridised."}, {"id": "z3-19", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "The major product of dehydrohalogenation of 2-bromobutane with alcoholic KOH is:", "options": ["but-1-ene", "butan-2-ol", "butane", "but-2-ene"], "correctAnswer": 3, "solution": "By Saytzeff’s rule the more substituted, more stable alkene (but-2-ene) is the major product."}, {"id": "z3-20", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Which reagent converts an alcohol into an alkyl chloride with only gaseous by-products?", "options": ["PCl₅", "conc. HCl without catalyst", "SOCl₂", "NaCl"], "correctAnswer": 2, "solution": "R–OH + SOCl₂ → R–Cl + SO₂ + HCl. Both by-products escape as gases, so the product is easy to purify."}, {"id": "z3-21", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "The IUPAC name of CH₃CH₂CH₂NH₂ is:", "options": ["propan-2-amine", "propan-1-amine", "N-methylethanamine", "butan-1-amine"], "correctAnswer": 1, "solution": "A three-carbon chain with the –NH₂ group on carbon 1 is propan-1-amine."}, {"id": "z3-22", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Nitrobenzene is converted into aniline by:", "options": ["KMnO₄", "Sn/HCl", "Br₂/FeBr₃", "HNO₃/H₂SO₄"], "correctAnswer": 1, "solution": "Reduction of the –NO₂ group with Sn and HCl (or H₂/Pd) gives aniline."}, {"id": "z3-23", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Aniline on heating with chloroform and alcoholic KOH gives:", "options": ["phenol", "phenyl isocyanide", "benzonitrile", "nitrobenzene"], "correctAnswer": 1, "solution": "This is the carbylamine reaction of primary amines. The product is the foul-smelling phenyl isocyanide."}, {"id": "z3-24", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Aniline reacts with bromine water to give:", "options": ["2,4,6-tribromoaniline", "o-bromoaniline", "p-bromoaniline", "m-bromoaniline"], "correctAnswer": 0, "solution": "The –NH₂ group strongly activates the ring, so all three ortho and para positions are brominated and a white precipitate forms."}, {"id": "z3-25", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "The number of chiral carbon atoms in open-chain glucose is:", "options": ["4", "3", "5", "6"], "correctAnswer": 0, "solution": "Glucose (CHO–(CHOH)₄–CH₂OH) has four CHOH carbons, each bonded to four different groups."}, {"id": "z3-26", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "Which amino acid is optically inactive?", "options": ["Alanine", "Serine", "Valine", "Glycine"], "correctAnswer": 3, "solution": "In glycine the α-carbon carries two hydrogen atoms, so it is not a chiral centre."}, {"id": "z3-27", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "In DNA, adenine pairs with thymine through:", "options": ["one hydrogen bond", "three hydrogen bonds", "two hydrogen bonds", "four hydrogen bonds"], "correctAnswer": 2, "solution": "A–T pairs have two hydrogen bonds and G–C pairs have three."}, {"id": "z3-28", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "Complete hydrolysis of starch gives:", "options": ["fructose", "galactose", "glucose", "sucrose"], "correctAnswer": 2, "solution": "Starch is a polymer of α-D-glucose units, so complete hydrolysis gives glucose."}, {"id": "z3-29", "subject": "chemistry", "chapterId": "chem-mole-concept", "level": "mains", "source": "Aster practice", "question": "The number of moles in 22 g of CO₂ (C = 12, O = 16) is:", "options": ["0.5", "0.25", "1", "2"], "correctAnswer": 0, "solution": "Molar mass of CO₂ = 44 g/mol. Moles = 22/44 = 0.5."}, {"id": "z3-30", "subject": "chemistry", "chapterId": "chem-mole-concept", "level": "mains", "source": "Aster practice", "question": "The mass of 3.011 × 10²³ molecules of water is (Nₐ = 6.022 × 10²³):", "options": ["18 g", "4.5 g", "36 g", "9 g"], "correctAnswer": 3, "solution": "3.011 × 10²³ molecules is 0.5 mol, and 0.5 × 18 = 9 g."}, {"id": "z3-31", "subject": "chemistry", "chapterId": "chem-mole-concept", "level": "mains", "source": "Aster practice", "question": "A compound contains 40% C, 6.7% H and 53.3% O by mass. Its empirical formula is:", "options": ["CH₂O", "CHO", "C₂H₄O", "CH₄O"], "correctAnswer": 0, "solution": "Moles: C 40/12 = 3.33, H 6.7/1 = 6.7, O 53.3/16 = 3.33. The ratio is 1 : 2 : 1, so CH₂O."}, {"id": "z3-32", "subject": "mathematics", "chapterId": "math-diffeq", "level": "mains", "source": "Aster practice", "question": "The solution of dy/dx = 2x with y(0) = 1 is:", "options": ["y = x²", "y = 2x + 1", "y = x² + 1", "y = x² − 1"], "correctAnswer": 2, "solution": "Integrating gives y = x² + C. Using y(0) = 1 gives C = 1."}, {"id": "z3-33", "subject": "mathematics", "chapterId": "math-diffeq", "level": "mains", "source": "Aster practice", "question": "The differential equation of the family of straight lines y = mx (m arbitrary) is:", "options": ["dy/dx = m", "x dy/dx = y", "y dy/dx = x", "d²y/dx² = y"], "correctAnswer": 1, "solution": "Differentiate: dy/dx = m. Substitute m = y/x to eliminate the constant, giving x dy/dx = y."}, {"id": "z3-34", "subject": "mathematics", "chapterId": "math-diffeq", "level": "mains", "source": "Aster practice", "question": "The solution of dy/dx = −x/y is:", "options": ["x² − y² = C", "xy = C", "x² + y² = C", "y = Cx"], "correctAnswer": 2, "solution": "y dy = −x dx, so y²/2 = −x²/2 + c. Hence x² + y² = C."}, {"id": "z3-35", "subject": "mathematics", "chapterId": "math-diffeq", "level": "mains", "source": "Aster practice", "question": "The degree of the differential equation d²y/dx² + sin(dy/dx) = 0 is:", "options": ["1", "not defined", "2", "0"], "correctAnswer": 1, "solution": "The equation is not a polynomial in the derivative dy/dx because of the sine term, so its degree is not defined."}, {"id": "z3-36", "subject": "mathematics", "chapterId": "math-stats", "level": "mains", "source": "Aster practice", "question": "The median of 3, 5, 7, 9, 11, 13 is:", "options": ["7", "8", "9", "8.5"], "correctAnswer": 1, "solution": "There are 6 values, so the median is the average of the 3rd and 4th: (7 + 9)/2 = 8."}, {"id": "z3-37", "subject": "mathematics", "chapterId": "math-stats", "level": "mains", "source": "Aster practice", "question": "The mean deviation about the mean of 2, 4, 6, 8 is:", "options": ["1", "2.5", "4", "2"], "correctAnswer": 3, "solution": "Mean = 5. Absolute deviations: 3, 1, 1, 3, whose sum is 8. Mean deviation = 8/4 = 2."}, {"id": "z3-38", "subject": "mathematics", "chapterId": "math-stats", "level": "mains", "source": "Aster practice", "question": "The variance of a data set is 16. If every observation is multiplied by 3, the new variance is:", "options": ["144", "48", "16", "432"], "correctAnswer": 0, "solution": "Variance scales as the square of the multiplier: 3² × 16 = 144."}, {"id": "z3-39", "subject": "mathematics", "chapterId": "math-binomial", "level": "mains", "source": "Aster practice", "question": "The number of terms in the expansion of (x + y)¹⁰ is:", "options": ["10", "12", "11", "9"], "correctAnswer": 2, "solution": "The expansion of (x + y)ⁿ has n + 1 terms."}, {"id": "z3-40", "subject": "mathematics", "chapterId": "math-binomial", "level": "mains", "source": "Aster practice", "question": "The coefficient of x⁵ in the expansion of (1 + x)⁸ is:", "options": ["56", "40", "70", "28"], "correctAnswer": 0, "solution": "The coefficient is ⁸C₅ = 56."}, {"id": "z3-41", "subject": "mathematics", "chapterId": "math-binomial", "level": "mains", "source": "Aster practice", "question": "The term independent of x in the expansion of (x + 1/x)⁶ is:", "options": ["15", "30", "1", "20"], "correctAnswer": 3, "solution": "General term ⁶Cᵣ x⁶⁻²ʳ. It is independent of x when r = 3, giving ⁶C₃ = 20."}, {"id": "z3-42", "subject": "mathematics", "chapterId": "math-sets", "level": "mains", "source": "Aster practice", "question": "If A = {1, 2, 3, 4} and B = {3, 4, 5}, then A − B equals:", "options": ["{1, 2}", "{5}", "{3, 4}", "{1, 2, 5}"], "correctAnswer": 0, "solution": "A − B contains the elements of A that are not in B: {1, 2}."}, {"id": "z3-43", "subject": "mathematics", "chapterId": "math-sets", "level": "mains", "source": "Aster practice", "question": "The relation R = {(1,1), (2,2), (3,3), (1,2)} on A = {1, 2, 3} is:", "options": ["symmetric but not reflexive", "an equivalence relation", "reflexive but not symmetric", "neither reflexive nor transitive"], "correctAnswer": 2, "solution": "All (a, a) are present, so it is reflexive. (1, 2) is in R but (2, 1) is not, so it is not symmetric."}, {"id": "z3-44", "subject": "mathematics", "chapterId": "math-sets", "level": "mains", "source": "Aster practice", "question": "If f(x) = 2x + 3, then f⁻¹(x) is:", "options": ["(x + 3) / 2", "2x − 3", "1 / (2x + 3)", "(x − 3) / 2"], "correctAnswer": 3, "solution": "Put y = 2x + 3 and solve for x: x = (y − 3)/2."}, {"id": "z3-45", "subject": "mathematics", "chapterId": "math-limits", "level": "mains", "source": "Aster practice", "question": "The value of lim (x → 0) sin(3x) / x is:", "options": ["0", "1", "1/3", "3"], "correctAnswer": 3, "solution": "sin(3x)/x = 3 · sin(3x)/(3x) → 3 × 1 = 3."}, {"id": "z3-46", "subject": "mathematics", "chapterId": "math-limits", "level": "mains", "source": "Aster practice", "question": "The value of lim (x → ∞) (1 + 1/x)ˣ is:", "options": ["e", "1", "∞", "0"], "correctAnswer": 0, "solution": "This is the standard limit defining the number e."}, {"id": "z3-47", "subject": "mathematics", "chapterId": "math-limits", "level": "mains", "source": "Aster practice", "question": "The function f(x) = |x| is:", "options": ["differentiable but not continuous at x = 0", "continuous but not differentiable at x = 0", "neither continuous nor differentiable at x = 0", "both continuous and differentiable at x = 0"], "correctAnswer": 1, "solution": "f is continuous everywhere, but its left derivative (−1) and right derivative (+1) at 0 are different, so it is not differentiable there."}, {"id": "z3-48", "subject": "mathematics", "chapterId": "math-quadratic", "level": "mains", "source": "Aster practice", "question": "The sum of the roots of 3x² − 7x + 2 = 0 is:", "options": ["7/3", "−7/3", "2/3", "3/7"], "correctAnswer": 0, "solution": "Sum of roots = −b/a = 7/3."}, {"id": "z3-49", "subject": "mathematics", "chapterId": "math-quadratic", "level": "mains", "source": "Aster practice", "question": "For which positive value of k does x² + kx + 4 = 0 have equal roots?", "options": ["4", "2", "8", "16"], "correctAnswer": 0, "solution": "Equal roots need D = k² − 16 = 0, so k = 4 (positive)."}, {"id": "z3-50", "subject": "mathematics", "chapterId": "math-quadratic", "level": "mains", "source": "Aster practice", "question": "If the roots of ax² + bx + c = 0 are reciprocals of each other, then:", "options": ["a = −c", "a = c", "b = 0", "a = b"], "correctAnswer": 1, "solution": "The product of the roots is c/a. For reciprocal roots this equals 1, so c = a."}, {"id": "z3-51", "subject": "mathematics", "chapterId": "math-trig", "level": "mains", "source": "Aster practice", "question": "The value of tan 15° is:", "options": ["2 + √3", "2 − √3", "√3 − 1", "1/√3"], "correctAnswer": 1, "solution": "tan(45° − 30°) = (1 − 1/√3)/(1 + 1/√3) = (√3 − 1)/(√3 + 1) = 2 − √3."}, {"id": "z3-52", "subject": "mathematics", "chapterId": "math-trig", "level": "mains", "source": "Aster practice", "question": "The period of the function sin(3x) is:", "options": ["2π", "π", "3π", "2π/3"], "correctAnswer": 3, "solution": "The period of sin(kx) is 2π/|k|, so here it is 2π/3."}, {"id": "z3-53", "subject": "mathematics", "chapterId": "math-trig", "level": "mains", "source": "Aster practice", "question": "The maximum value of 3 sin x + 4 cos x is:", "options": ["5", "3", "4", "7"], "correctAnswer": 0, "solution": "The maximum of a sin x + b cos x is √(a² + b²) = √(9 + 16) = 5."}]);
questionBank.push(...[{"id": "z4-1", "subject": "physics", "chapterId": "kinematics", "level": "mains", "source": "Aster practice", "question": "A car accelerates uniformly from rest to 20 m/s in 5 s. The distance covered in this time is:", "options": ["100 m", "50 m", "25 m", "40 m"], "correctAnswer": 1, "solution": "a = 20/5 = 4 m/s². s = ½at² = ½ × 4 × 25 = 50 m."}, {"id": "z4-2", "subject": "physics", "chapterId": "kinematics", "level": "mains", "source": "Aster practice", "question": "A stone is thrown vertically upward at 20 m/s. The maximum height it reaches is (g = 10 m/s²):", "options": ["10 m", "20 m", "40 m", "200 m"], "correctAnswer": 1, "solution": "H = u²/2g = 400/20 = 20 m."}, {"id": "z4-3", "subject": "physics", "chapterId": "kinematics", "level": "mains", "source": "Aster practice", "question": "A projectile is fired at 30° to the horizontal with a speed of 40 m/s. Its time of flight is (g = 10 m/s²):", "options": ["2 s", "6 s", "4 s", "8 s"], "correctAnswer": 2, "solution": "T = 2u sinθ / g = 2 × 40 × 0.5 / 10 = 4 s."}, {"id": "z4-4", "subject": "physics", "chapterId": "fluids", "level": "mains", "source": "Aster practice", "question": "The absolute pressure at a depth of 10 m in water is (P₀ = 1.0 × 10⁵ Pa, ρ = 1000 kg/m³, g = 10 m/s²):", "options": ["1.0 × 10⁵ Pa", "1.1 × 10⁵ Pa", "2.0 × 10⁵ Pa", "3.0 × 10⁵ Pa"], "correctAnswer": 2, "solution": "P = P₀ + ρgh = 1.0 × 10⁵ + 1000 × 10 × 10 = 2.0 × 10⁵ Pa."}, {"id": "z4-5", "subject": "physics", "chapterId": "fluids", "level": "mains", "source": "Aster practice", "question": "A cube of side 10 cm and density 600 kg/m³ floats in water. The height of the cube above the water surface is:", "options": ["2 cm", "6 cm", "10 cm", "4 cm"], "correctAnswer": 3, "solution": "Fraction submerged = 600/1000 = 0.6, so 6 cm is under water and 10 − 6 = 4 cm is above."}, {"id": "z4-6", "subject": "physics", "chapterId": "fluids", "level": "mains", "source": "Aster practice", "question": "In the horizontal flow of an ideal fluid, at a point where the speed is greater, the pressure is:", "options": ["lower", "higher", "the same", "zero"], "correctAnswer": 0, "solution": "Bernoulli’s principle: P + ½ρv² is constant along a horizontal streamline, so higher speed means lower pressure."}, {"id": "z4-7", "subject": "physics", "chapterId": "waves", "level": "mains", "source": "Aster practice", "question": "A sound wave of frequency 680 Hz travels at 340 m/s. Its wavelength is:", "options": ["2 m", "0.25 m", "1 m", "0.5 m"], "correctAnswer": 3, "solution": "λ = v/f = 340/680 = 0.5 m."}, {"id": "z4-8", "subject": "physics", "chapterId": "waves", "level": "mains", "source": "Aster practice", "question": "The intensity of a sound is doubled. The sound level increases by about (log₁₀2 = 0.30):", "options": ["1 dB", "3 dB", "6 dB", "10 dB"], "correctAnswer": 1, "solution": "ΔL = 10 log₁₀(I₂/I₁) = 10 log₁₀2 ≈ 3 dB."}, {"id": "z4-9", "subject": "physics", "chapterId": "waves", "level": "mains", "source": "Aster practice", "question": "A source of frequency 400 Hz moves towards a stationary observer at 20 m/s. The speed of sound is 340 m/s. The frequency heard is:", "options": ["425 Hz", "377 Hz", "400 Hz", "450 Hz"], "correctAnswer": 0, "solution": "f′ = f v/(v − vₛ) = 400 × 340/320 = 425 Hz."}, {"id": "z4-10", "subject": "physics", "chapterId": "emi", "level": "mains", "source": "Aster practice", "question": "The flux through a coil changes from 0.5 Wb to 0.1 Wb in 0.2 s. The magnitude of the induced emf is:", "options": ["2 V", "0.2 V", "0.8 V", "4 V"], "correctAnswer": 0, "solution": "|ε| = ΔΦ/Δt = 0.4/0.2 = 2 V."}, {"id": "z4-11", "subject": "physics", "chapterId": "emi", "level": "mains", "source": "Aster practice", "question": "A 220 V, 50 Hz AC source is connected to a pure resistor of 110 Ω. The rms current is:", "options": ["2 A", "0.5 A", "1 A", "4 A"], "correctAnswer": 0, "solution": "I = V/R = 220/110 = 2 A."}, {"id": "z4-12", "subject": "physics", "chapterId": "emi", "level": "mains", "source": "Aster practice", "question": "The reactance of a 1 μF capacitor at an angular frequency of 1000 rad/s is:", "options": ["1 Ω", "1000 Ω", "100 Ω", "10⁶ Ω"], "correctAnswer": 1, "solution": "X_C = 1/(ωC) = 1/(1000 × 10⁻⁶) = 1000 Ω."}, {"id": "z4-13", "subject": "physics", "chapterId": "thermal", "level": "mains", "source": "Aster practice", "question": "A copper rod 1 m long is heated from 20 °C to 120 °C. If α = 1.7 × 10⁻⁵ /°C, the increase in length is:", "options": ["0.17 mm", "17 mm", "0.017 mm", "1.7 mm"], "correctAnswer": 3, "solution": "ΔL = αLΔT = 1.7 × 10⁻⁵ × 1 × 100 = 1.7 × 10⁻³ m = 1.7 mm."}, {"id": "z4-14", "subject": "physics", "chapterId": "thermal", "level": "mains", "source": "Aster practice", "question": "The heat needed to raise 200 g of water by 30 °C is (specific heat = 4.2 J g⁻¹ °C⁻¹):", "options": ["6.3 kJ", "12.6 kJ", "252 kJ", "25.2 kJ"], "correctAnswer": 3, "solution": "Q = mcΔT = 200 × 4.2 × 30 = 25 200 J = 25.2 kJ."}, {"id": "z4-15", "subject": "physics", "chapterId": "thermal", "level": "mains", "source": "Aster practice", "question": "A black body radiates power P. If its absolute temperature is doubled, the power radiated becomes:", "options": ["2P", "4P", "16P", "8P"], "correctAnswer": 2, "solution": "Stefan’s law: P ∝ T⁴, so doubling T multiplies P by 2⁴ = 16."}, {"id": "z4-16", "subject": "physics", "chapterId": "magnetism", "level": "mains", "source": "Aster practice", "question": "A long straight wire carries 5 A. The magnetic field at 10 cm from it is (μ₀ = 4π × 10⁻⁷ T m/A):", "options": ["1 × 10⁻⁶ T", "1 × 10⁻⁵ T", "5 × 10⁻⁵ T", "2 × 10⁻⁵ T"], "correctAnswer": 1, "solution": "B = μ₀I/(2πr) = 2 × 10⁻⁷ × 5 / 0.1 = 1 × 10⁻⁵ T."}, {"id": "z4-17", "subject": "physics", "chapterId": "magnetism", "level": "mains", "source": "Aster practice", "question": "A proton moving at 2 × 10⁶ m/s enters a magnetic field of 0.1 T at right angles to its velocity. The force on it is (e = 1.6 × 10⁻¹⁹ C):", "options": ["3.2 × 10⁻¹³ N", "3.2 × 10⁻¹⁴ N", "1.6 × 10⁻¹⁴ N", "6.4 × 10⁻¹⁴ N"], "correctAnswer": 1, "solution": "F = qvB = 1.6 × 10⁻¹⁹ × 2 × 10⁶ × 0.1 = 3.2 × 10⁻¹⁴ N."}, {"id": "z4-18", "subject": "physics", "chapterId": "optics", "level": "mains", "source": "Aster practice", "question": "A concave mirror has focal length 20 cm. An object is placed 30 cm in front of it. The image is formed:", "options": ["12 cm in front of the mirror", "60 cm in front of the mirror", "60 cm behind the mirror", "12 cm behind the mirror"], "correctAnswer": 1, "solution": "Using 1/v + 1/u = 1/f with u = −30 and f = −20: 1/v = −1/20 + 1/30 = −1/60, so v = −60 cm, a real image in front of the mirror."}, {"id": "z4-19", "subject": "physics", "chapterId": "optics", "level": "mains", "source": "Aster practice", "question": "The refractive index of glass is 1.5. The speed of light in glass is (c = 3 × 10⁸ m/s):", "options": ["4.5 × 10⁸ m/s", "1.5 × 10⁸ m/s", "3 × 10⁸ m/s", "2 × 10⁸ m/s"], "correctAnswer": 3, "solution": "v = c/n = 3 × 10⁸ / 1.5 = 2 × 10⁸ m/s."}, {"id": "z4-20", "subject": "physics", "chapterId": "optics", "level": "mains", "source": "Aster practice", "question": "For total internal reflection at a glass (n = 1.5) to air boundary, the critical angle C satisfies:", "options": ["sin C = 1.5", "sin C = 1/3", "cos C = 2/3", "sin C = 2/3"], "correctAnswer": 3, "solution": "sin C = 1/n = 1/1.5 = 2/3."}, {"id": "z4-21", "subject": "physics", "chapterId": "current-electricity", "level": "mains", "source": "Aster practice", "question": "Resistors of 2 Ω, 3 Ω and 6 Ω are connected in parallel. The equivalent resistance is:", "options": ["11 Ω", "2 Ω", "1 Ω", "0.5 Ω"], "correctAnswer": 2, "solution": "1/R = 1/2 + 1/3 + 1/6 = (3 + 2 + 1)/6 = 1, so R = 1 Ω."}, {"id": "z4-22", "subject": "physics", "chapterId": "current-electricity", "level": "mains", "source": "Aster practice", "question": "A 100 W, 220 V bulb is connected to a 220 V supply. Its resistance is:", "options": ["2.2 Ω", "22 Ω", "48.4 Ω", "484 Ω"], "correctAnswer": 3, "solution": "R = V²/P = 220²/100 = 484 Ω."}, {"id": "z4-23", "subject": "physics", "chapterId": "rotation", "level": "mains", "source": "Aster practice", "question": "The moment of inertia of a uniform disc of mass M and radius R about its central axis perpendicular to its plane is:", "options": ["½MR²", "MR²", "⅖MR²", "⅓MR²"], "correctAnswer": 0, "solution": "For a uniform disc about the axis through its centre perpendicular to the plane, I = ½MR²."}, {"id": "z4-24", "subject": "physics", "chapterId": "rotation", "level": "mains", "source": "Aster practice", "question": "A ring of mass 2 kg and radius 0.5 m rotates at 10 rad/s about its axis. Its angular momentum is:", "options": ["5 kg m²/s", "10 kg m²/s", "2.5 kg m²/s", "50 kg m²/s"], "correctAnswer": 0, "solution": "I = MR² = 2 × 0.25 = 0.5 kg m². L = Iω = 0.5 × 10 = 5 kg m²/s."}, {"id": "z4-25", "subject": "physics", "chapterId": "work-energy", "level": "mains", "source": "Aster practice", "question": "A 2 kg body moving at 3 m/s is brought to rest by a stopping force. The work done by this force is:", "options": ["9 J", "−18 J", "−9 J", "6 J"], "correctAnswer": 2, "solution": "By the work–energy theorem W = ΔK = 0 − ½ × 2 × 9 = −9 J."}, {"id": "z4-26", "subject": "physics", "chapterId": "work-energy", "level": "mains", "source": "Aster practice", "question": "A spring of constant 200 N/m is compressed by 10 cm. The energy stored is:", "options": ["10 J", "1 J", "0.1 J", "20 J"], "correctAnswer": 1, "solution": "U = ½kx² = ½ × 200 × (0.1)² = 1 J."}, {"id": "z4-27", "subject": "physics", "chapterId": "electrostatics", "level": "mains", "source": "Aster practice", "question": "Two point charges +2 μC and −2 μC are 3 cm apart (k = 9 × 10⁹ N m²/C²). The magnitude of the force between them is:", "options": ["40 N", "4 N", "400 N", "20 N"], "correctAnswer": 0, "solution": "F = kq₁q₂/r² = 9 × 10⁹ × (2 × 10⁻⁶)² / (0.03)² = 40 N (attractive)."}, {"id": "z4-28", "subject": "physics", "chapterId": "electrostatics", "level": "mains", "source": "Aster practice", "question": "A capacitor of capacitance C is charged to a potential difference V. The energy stored in it is:", "options": ["CV²", "½CV²", "½C²V", "¼CV²"], "correctAnswer": 1, "solution": "U = ½CV² = Q²/2C = ½QV."}, {"id": "z4-29", "subject": "physics", "chapterId": "rotation", "level": "advanced", "source": "Aster advanced practice", "question": "A uniform rod of mass M and length L, hinged at one end, is released from the horizontal position. Its angular velocity when it becomes vertical is:", "options": ["√(g/L)", "√(6g/L)", "√(3g/2L)", "√(3g/L)"], "correctAnswer": 3, "solution": "Energy: Mg(L/2) = ½Iω² with I = ML²/3. So ω² = 3g/L, giving ω = √(3g/L)."}, {"id": "z4-30", "subject": "physics", "chapterId": "optics", "level": "advanced", "source": "Aster advanced practice", "question": "In Young’s double-slit experiment the fringe width is β. If the slit separation is doubled and the screen distance is halved, the fringe width becomes:", "options": ["β/2", "β/4", "β", "4β"], "correctAnswer": 1, "solution": "β = λD/d. Halving D and doubling d divides β by 4."}, {"id": "z4-31", "subject": "physics", "chapterId": "shm", "level": "advanced", "source": "Aster advanced practice", "question": "A block on a spring oscillates with amplitude A. If its mass is made four times larger (same k and same A), the maximum speed becomes:", "options": ["double", "unchanged", "one-fourth", "half"], "correctAnswer": 3, "solution": "vmax = A√(k/m). With 4m, vmax becomes A√(k/4m) = half of the original."}, {"id": "z4-32", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "The number of radial nodes in a 3p orbital is:", "options": ["1", "0", "2", "3"], "correctAnswer": 0, "solution": "Radial nodes = n − l − 1 = 3 − 1 − 1 = 1."}, {"id": "z4-33", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "The maximum number of electrons that can occupy the subshell with l = 3 is:", "options": ["6", "10", "18", "14"], "correctAnswer": 3, "solution": "The subshell has 2l + 1 = 7 orbitals, each holding 2 electrons: 14."}, {"id": "z4-34", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "The ground state electronic configuration of Cr (Z = 24) is:", "options": ["[Ar] 3d⁴ 4s²", "[Ar] 3d⁶", "[Ar] 4s² 4p⁴", "[Ar] 3d⁵ 4s¹"], "correctAnswer": 3, "solution": "A half-filled d subshell is extra stable, so one 4s electron moves to 3d, giving 3d⁵ 4s¹."}, {"id": "z4-35", "subject": "chemistry", "chapterId": "chem-solutions", "level": "mains", "source": "Aster practice", "question": "The vapour pressure of a pure liquid is 100 mm Hg. A solution with mole fraction 0.2 of a non-volatile solute has a vapour pressure of:", "options": ["20 mm Hg", "100 mm Hg", "80 mm Hg", "120 mm Hg"], "correctAnswer": 2, "solution": "By Raoult’s law, p = p°x_solvent = 100 × 0.8 = 80 mm Hg."}, {"id": "z4-36", "subject": "chemistry", "chapterId": "chem-solutions", "level": "mains", "source": "Aster practice", "question": "The depression in freezing point of a 0.1 m aqueous glucose solution is (K_f = 1.86 K kg mol⁻¹):", "options": ["0.186 K", "1.86 K", "0.0186 K", "0.372 K"], "correctAnswer": 0, "solution": "ΔT_f = K_f × m = 1.86 × 0.1 = 0.186 K (glucose does not dissociate)."}, {"id": "z4-37", "subject": "chemistry", "chapterId": "chem-solutions", "level": "mains", "source": "Aster practice", "question": "The osmotic pressure of a 0.1 M non-electrolyte solution at 300 K is (R = 0.082 L atm K⁻¹ mol⁻¹):", "options": ["2.46 atm", "0.82 atm", "24.6 atm", "8.2 atm"], "correctAnswer": 0, "solution": "π = CRT = 0.1 × 0.082 × 300 = 2.46 atm."}, {"id": "z4-38", "subject": "chemistry", "chapterId": "chem-hydrocarbons", "level": "mains", "source": "Aster practice", "question": "The IUPAC name of CH₃–CH=CH–CH₂–CH₃ is:", "options": ["pent-1-ene", "pent-2-ene", "pent-3-ene", "2-methylbut-2-ene"], "correctAnswer": 1, "solution": "Number the five-carbon chain from the end nearest the double bond. The double bond starts at carbon 2."}, {"id": "z4-39", "subject": "chemistry", "chapterId": "chem-hydrocarbons", "level": "mains", "source": "Aster practice", "question": "Which reagent distinguishes ethyne from ethene?", "options": ["Ammoniacal silver nitrate", "Bromine water", "Acidified KMnO₄", "H₂ with Ni"], "correctAnswer": 0, "solution": "Ethyne has an acidic terminal hydrogen and gives a white precipitate of silver acetylide. Ethene does not. Bromine and KMnO₄ react with both."}, {"id": "z4-40", "subject": "chemistry", "chapterId": "chem-hydrocarbons", "level": "mains", "source": "Aster practice", "question": "The number of σ and π bonds in ethyne (HC≡CH) is:", "options": ["2 σ and 3 π", "3 σ and 2 π", "5 σ and 0 π", "4 σ and 1 π"], "correctAnswer": 1, "solution": "Two C–H σ bonds plus the C≡C bond (1 σ and 2 π) give 3 σ and 2 π bonds."}, {"id": "z4-41", "subject": "chemistry", "chapterId": "chem-oxygen", "level": "mains", "source": "Aster practice", "question": "Which of the following is the strongest acid?", "options": ["CH₃COOH", "ClCH₂COOH", "Cl₃CCOOH", "Cl₂CHCOOH"], "correctAnswer": 2, "solution": "Each Cl atom withdraws electrons (–I effect) and stabilises the carboxylate ion, so acidity increases with the number of Cl atoms."}, {"id": "z4-42", "subject": "chemistry", "chapterId": "chem-oxygen", "level": "mains", "source": "Aster practice", "question": "Oxidation of a secondary alcohol gives:", "options": ["an aldehyde", "a ketone", "a carboxylic acid", "an ether"], "correctAnswer": 1, "solution": "A secondary alcohol has one hydrogen on the carbinol carbon. Oxidation removes it and gives a ketone."}, {"id": "z4-43", "subject": "chemistry", "chapterId": "chem-oxygen", "level": "mains", "source": "Aster practice", "question": "Acetone reacts with CH₃MgBr followed by hydrolysis to give:", "options": ["propan-2-ol", "butan-2-ol", "2-methylpropan-2-ol", "butan-1-ol"], "correctAnswer": 2, "solution": "A Grignard reagent adds to a ketone to give a tertiary alcohol: (CH₃)₃C–OH."}, {"id": "z4-44", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Chlorobenzene is converted to phenol (Dow’s process) by:", "options": ["NaOH at 623 K and 300 atm", "aqueous NaOH at room temperature", "dilute HCl", "KCN"], "correctAnswer": 0, "solution": "Aryl halides resist ordinary nucleophilic substitution. Dow’s process needs fused NaOH at about 623 K and 300 atm, followed by acidification."}, {"id": "z4-45", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Which of the following is a vicinal dihalide?", "options": ["1,2-dibromoethane", "1,1-dibromoethane", "1,3-dibromopropane", "bromoform"], "correctAnswer": 0, "solution": "In a vicinal dihalide the two halogens are on adjacent carbons. In a geminal dihalide they are on the same carbon."}, {"id": "z4-46", "subject": "chemistry", "chapterId": "chem-halogens", "level": "mains", "source": "Aster practice", "question": "Which of the following is used as a refrigerant and aerosol propellant but damages the ozone layer?", "options": ["CCl₄", "CHI₃", "CF₂Cl₂ (Freon-12)", "C₆H₅Cl"], "correctAnswer": 2, "solution": "Freon-12 is a chlorofluorocarbon. In the stratosphere it releases chlorine atoms that destroy ozone."}, {"id": "z4-47", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Which of the following does NOT react with benzenesulphonyl chloride?", "options": ["Methylamine", "Dimethylamine", "Trimethylamine", "Aniline"], "correctAnswer": 2, "solution": "Primary and secondary amines have an N–H bond and react. A tertiary amine has no replaceable hydrogen, so there is no reaction."}, {"id": "z4-48", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Which of the following is a secondary amine?", "options": ["CH₃NH₂", "(CH₃)₃N", "C₆H₅NH₂", "(CH₃)₂NH"], "correctAnswer": 3, "solution": "A secondary amine has two alkyl or aryl groups on nitrogen: dimethylamine."}, {"id": "z4-49", "subject": "chemistry", "chapterId": "chem-nitrogen", "level": "mains", "source": "Aster practice", "question": "Aniline is converted into acetanilide by:", "options": ["acetylation with acetic anhydride", "diazotisation", "nitration", "bromination"], "correctAnswer": 0, "solution": "The –NH₂ group is acylated by (CH₃CO)₂O, giving C₆H₅NHCOCH₃."}, {"id": "z4-50", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "Which of the following is a ketohexose?", "options": ["Fructose", "Glucose", "Galactose", "Ribose"], "correctAnswer": 0, "solution": "Fructose has a ketone group and six carbon atoms. Glucose and galactose are aldohexoses and ribose is an aldopentose."}, {"id": "z4-51", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "The secondary structure of a protein is held mainly by:", "options": ["disulphide bonds", "ionic bonds", "hydrogen bonds", "covalent peptide bonds"], "correctAnswer": 2, "solution": "α-helices and β-sheets are stabilised by hydrogen bonds between the C=O and N–H groups of the backbone."}, {"id": "z4-52", "subject": "chemistry", "chapterId": "chem-biomolecules", "level": "mains", "source": "Aster practice", "question": "The sugar present in RNA is:", "options": ["deoxyribose", "glucose", "fructose", "ribose"], "correctAnswer": 3, "solution": "RNA contains ribose; DNA contains 2-deoxyribose."}, {"id": "z4-53", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "Which hydride has the highest boiling point among H₂O, H₂S, H₂Se and H₂Te?", "options": ["H₂O", "H₂S", "H₂Se", "H₂Te"], "correctAnswer": 0, "solution": "Hydrogen bonding in water raises its boiling point far above the others."}, {"id": "z4-54", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "The oxidation state of chlorine in HClO₄ is:", "options": ["+1", "+3", "+7", "+5"], "correctAnswer": 2, "solution": "(+1) + x + 4(−2) = 0, so x = +7."}, {"id": "z4-55", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "Which noble gas forms the largest number of compounds?", "options": ["Helium", "Neon", "Argon", "Xenon"], "correctAnswer": 3, "solution": "Xenon has a low ionisation enthalpy and large size, so it forms fluorides, oxides and oxyfluorides."}, {"id": "z4-56", "subject": "chemistry", "chapterId": "chem-dblock", "level": "mains", "source": "Aster practice", "question": "Which of the following 3d metals can show an oxidation state of +7?", "options": ["Cr", "Fe", "Mn", "Co"], "correctAnswer": 2, "solution": "Manganese shows +7 in KMnO₄ because all its 3d and 4s electrons (7 in total) can be used."}, {"id": "z4-57", "subject": "chemistry", "chapterId": "chem-dblock", "level": "mains", "source": "Aster practice", "question": "The electronic configuration of Cu⁺ (Z = 29) is:", "options": ["[Ar] 3d⁹", "[Ar] 3d⁹ 4s¹", "[Ar] 3d¹⁰ 4s¹", "[Ar] 3d¹⁰"], "correctAnswer": 3, "solution": "Copper is [Ar] 3d¹⁰ 4s¹. It loses the 4s electron to form Cu⁺ with a full 3d¹⁰ shell."}, {"id": "z4-58", "subject": "chemistry", "chapterId": "chem-dblock", "level": "mains", "source": "Aster practice", "question": "Which of the following is the most abundant transition metal in the Earth’s crust?", "options": ["Copper", "Zinc", "Iron", "Nickel"], "correctAnswer": 2, "solution": "Iron makes up about 5% of the Earth’s crust and is by far the most abundant d-block element."}, {"id": "z4-59", "subject": "chemistry", "chapterId": "chem-equilibrium", "level": "advanced", "source": "Aster advanced practice
