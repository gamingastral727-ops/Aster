const NOTES={physics:[['Kinematics','Velocity is the rate of change of displacement; acceleration is the rate of change of velocity. Area under a v–t graph gives displacement and its slope gives acceleration. In projectile motion the horizontal velocity stays constant while vertical motion has acceleration g.'],['Laws of Motion','Net force equals the rate of change of momentum. Static friction can be at most μₛN, and kinetic friction is μₖN. Always draw a free-body diagram before writing equations.'],['Work, Energy & Power','Work is force times displacement along the force. Conservative forces conserve mechanical energy. Power = work / time = F·v.'],['Electrostatics','Like charges repel. Electric field is force per unit charge and potential is a scalar. Inside a conductor E = 0 and the potential is constant.'],['Current Electricity','Series resistors share the same current; parallel resistors share the same voltage. Kirchhoff’s laws: ΣI = 0 at a junction and ΣV = 0 around a loop.']],chemistry:[['Atomic Structure','Fill orbitals by the Aufbau principle, Pauli exclusion and Hund’s rule. Half-filled and fully filled subshells are extra stable (Cr and Cu are exceptions). n gives size and energy, l gives shape, mₗ gives orientation.'],['Chemical Bonding','Ionic bonds transfer electrons; covalent bonds share them. VSEPR predicts shape from bond pairs and lone pairs. A higher bond order means a shorter, stronger bond.'],['Thermodynamics','ΔU = q + w. A process is spontaneous when ΔG < 0. The enthalpy of formation of an element in its standard state is zero.'],['Equilibrium','Le Chatelier’s principle: a system opposes any change applied to it. K depends only on temperature. pH = −log[H⁺].'],['General Organic Chemistry','Carbocation stability: 3° > 2° > 1° > methyl. Electron-withdrawing groups make acids stronger; resonance spreads charge and adds stability.']],mathematics:[['Limits','First identify the form (0/0, ∞/∞, 1^∞). Then use standard limits, series expansion or L’Hôpital’s rule.'],['Complex Numbers','For z = x + iy, |z|² = z·z̄. Powers of i repeat in a cycle of 4. Use the Argand plane for geometry problems.'],['Sequences & Series','AP has a constant difference and GP has a constant ratio. For positive numbers, AM ≥ GM ≥ HM.'],['Matrices','In general AB ≠ BA. A⁻¹ exists only if |A| ≠ 0. For an n × n matrix, |kA| = kⁿ|A|.'],['Calculus','The derivative gives slope and the definite integral gives area. Useful property: ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a + b − x)dx.'],['Probability','P(A∪B) = P(A) + P(B) − P(A∩B). Conditional probability: P(A|B) = P(A∩B) / P(B).']]};

{s:'physics',t:'Kinematics',n:['Distance is a scalar path length; displacement is a vector from start to end. Speed = distance / time, velocity = displacement / time.','Instantaneous velocity = dx/dt and acceleration = dv/dt. Average velocity = total displacement / total time.','Graphs: slope of x–t gives velocity, slope of v–t gives acceleration, area under v–t gives displacement, area under a–t gives change in velocity.','Free fall: acceleration is g (9.8 m/s², use 10 in problems) downward. At the highest point v = 0 but a is still g.','Projectile motion: horizontal and vertical motions are independent. Horizontal velocity is constant; vertical acceleration is −g.','Range is the same for angles θ and (90° − θ). Maximum range is at 45°.','Relative velocity: v(A rel B) = v(A) − v(B). River problem: shortest time means heading perpendicular to the bank; shortest path means heading upstream with sinθ = v(river) / v(boat).','Time to rise equals time to fall when the landing level equals the launch level.'],f:['v = u + at','s = ut + ½at²','v² = u² + 2as','s = (u + v)t / 2','Distance in nth second: sₙ = u + a(2n − 1)/2','Free fall: v = gt,  h = ½gt²,  v = √(2gh)','Max height H = u² sin²θ / 2g','Time of flight T = 2u sinθ / g','Range R = u² sin2θ / g,  R(max) = u²/g at 45°','Trajectory: y = x tanθ − gx² / (2u² cos²θ)','Horizontal projection from height h: T = √(2h/g),  R = vT','Relative velocity: v(AB) = v(A) − v(B)'],k:['Fix a sign convention before writing any equation.','Check units and always sketch the motion.','Equations of motion work only for constant acceleration.']},
{s:'chemistry',t:'Chemical Thermodynamics',n:['A system is the part under study. Types: open (exchanges matter and energy), closed (energy only), isolated (neither).','State functions (U, H, S, G, P, V, T) depend only on the initial and final states. Heat q and work w depend on the path.','First law: ΔU = q + w, where w is positive when work is done on the system. For an isothermal ideal-gas process ΔU = 0; for an adiabatic process q = 0.','Enthalpy H = U + PV. At constant pressure the heat exchanged equals ΔH.','Hess’s law: the enthalpy change of a reaction is the same whether it occurs in one step or several.','The enthalpy of formation of an element in its standard state is zero.','Entropy measures disorder. For a spontaneous process, ΔS(universe) > 0.','Gibbs energy: a process is spontaneous when ΔG < 0 and at equilibrium when ΔG = 0.','Sign guide: ΔH < 0 and ΔS > 0 is always spontaneous; ΔH > 0 and ΔS < 0 is never spontaneous; otherwise it depends on temperature.'],f:['ΔU = q + w','Expansion work: w = −PΔV','Reversible isothermal work: w = −2.303 nRT log(V₂/V₁)','ΔH = ΔU + Δn(g)RT','Cp − Cv = R,  γ = Cp / Cv','Heat: q = mcΔT','ΔH(reaction) = ΣΔHf(products) − ΣΔHf(reactants)','ΔH(reaction) = Σ bond enthalpies broken − Σ formed','ΔS = q(rev) / T,  isothermal: ΔS = nR ln(V₂/V₁)','ΔG = ΔH − TΔS','ΔG° = −RT ln K = −2.303 RT log K','Adiabatic reversible: PVᵞ = constant'],k:['Check the sign convention for w in your textbook.','Use R = 8.314 J/mol·K with joules, not kilojoules.','Standard state means 1 bar pressure.']},
{s:'mathematics',t:'Limits',n:['A limit exists when the left-hand and right-hand limits are equal and finite.','Indeterminate forms: 0/0, ∞/∞, ∞ − ∞, 0 × ∞, 1^∞, 0⁰, ∞⁰. Identify the form first.','Methods: factorise and cancel, rationalise, use standard limits, use series expansions, apply L’Hôpital’s rule, or substitute x = 1/t for x → ∞.','L’Hôpital’s rule works only for 0/0 or ∞/∞: differentiate numerator and denominator separately.','Limit rules: sum, difference, product and quotient (denominator limit not zero) can be taken term by term.','For a rational function as x → ∞, divide every term by the highest power of x.','1^∞ form: if f → 1 and g → ∞ then lim f^g = e^( lim g(f − 1) ).','Sandwich theorem: if g ≤ f ≤ h and lim g = lim h = L, then lim f = L.'],f:['lim sin x / x = lim tan x / x = lim sin⁻¹x / x = lim tan⁻¹x / x = 1  (x → 0)','lim (eˣ − 1) / x = 1','lim ln(1 + x) / x = 1','lim (aˣ − 1) / x = ln a','lim (1 + x)^(1/x) = e  (x → 0)','lim (1 + 1/x)ˣ = e  (x → ∞)','lim (xⁿ − aⁿ) / (x − a) = n·aⁿ⁻¹  (x → a)','lim ((1 + x)ⁿ − 1) / x = n','lim (1 − cos x) / x² = 1/2','eˣ = 1 + x + x²/2! + x³/3! + …','sin x = x − x³/3! + x⁵/5! − …','cos x = 1 − x²/2! + x⁴/4! − …','ln(1 + x) = x − x²/2 + x³/3 − …  (−1 < x ≤ 1)','tan x = x + x³/3 + 2x⁵/15 + …','tan⁻¹x = x − x³/3 + x⁵/5 − …','(1 + x)ⁿ = 1 + nx + n(n−1)x²/2! + …','L’Hôpital: lim f/g = lim f′/g′'],k:['Always check the form before using a rule.','Standard limits need x → 0 (or the stated direction).','Series expansions save time in tough 0/0 problems.']}];
CHAPS[0].f.push('Average velocity (constant a) = (u + v) / 2','Stopping distance s = u² / 2a','Projectile components: vₓ = u cosθ,  v_y = u sinθ − gt','Position at time t: x = u cosθ·t,  y = u sinθ·t − ½gt²','Time to reach max height = u sinθ / g','tanθ = 4H / R  (angle from height and range)','River: crossing time t = d / v(boat),  drift = v(river)·t','Shortest path: sinθ = v(river) / v(boat), heading upstream');
CHAPS[1].f.push('Hess’s law: ΔH = ΔH₁ + ΔH₂ + …','Kirchhoff: ΔH₂ − ΔH₁ = ΔCp (T₂ − T₁)','ΔU = nCvΔT,  ΔH = nCpΔT (ideal gas)','Monatomic gas: Cv = 3R/2,  Cp = 5R/2','Adiabatic: w = nCvΔT,  TVᵞ⁻¹ = constant','Heating: ΔS = nCp ln(T₂/T₁) at constant P','ΔS(universe) = ΔS(system) − ΔH(system) / T','Free expansion into vacuum: w = 0');
CHAPS[2].f.push('lim (1 + a/x)ˣ = eᵃ  (x → ∞)','lim (1 + ax)^(1/x) = eᵃ  (x → 0)','lim (aˣ − bˣ) / x = ln(a/b)','lim (tan x − x) / x³ = 1/3','lim (x − sin x) / x³ = 1/6','lim ln x / (x − 1) = 1  (x → 1)','lim xⁿ / eˣ = 0 and lim ln x / x = 0  (x → ∞)');
CHAPS.push({s:'physics',t:'Laws of Motion',n:['First law: a body stays at rest or in uniform motion unless a net external force acts on it (inertia).','Second law: F = dp/dt, which is F = ma for constant mass. Force and acceleration point in the same direction.','Third law: action and reaction are equal and opposite and act on different bodies, so they never cancel each other.','Static friction adjusts up to μₛN; kinetic friction is μₖN, with μₖ < μₛ. On an incline the angle of repose satisfies tanθ = μₛ.','Free-body diagram: show only forces on the chosen body, then resolve along and perpendicular to the motion.','In an accelerating frame add a pseudo force of −ma, opposite to the frame’s acceleration.','Circular motion needs a net inward force mv²/r. A frictionless banked road gives tanθ = v² / rg.','A massless string has the same tension throughout; an ideal pulley only changes its direction.'],f:['F = ma,  p = mv,  F = dp/dt','Impulse J = FΔt = Δp','Static friction f(max) = μₛN;  kinetic f = μₖN','Incline: a = g(sinθ − μ cosθ)','Atwood: a = (m₂ − m₁)g / (m₁ + m₂)','Atwood tension T = 2m₁m₂g / (m₁ + m₂)','Lift: N = m(g + a) going up, N = m(g − a) going down','Two blocks pushed by F: a = F / (m₁ + m₂)','Contact force on second block = m₂F / (m₁ + m₂)','Centripetal force F = mv² / r','Banking: tanθ = v² / rg','Banking with friction: v² / rg = (tanθ + μ) / (1 − μ tanθ)','Pseudo force = −ma','Momentum conservation: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂'],k:['Draw a free-body diagram first.','Normal force is not always mg.','Friction opposes relative motion or its tendency.']},
{s:'chemistry',t:'Atomic Structure',n:['The nucleus holds protons and neutrons. Atomic number Z = protons; mass number A = protons + neutrons. Isotopes share Z, isobars share A, isotones share neutron number.','Bohr model: electrons orbit with quantised angular momentum mvr = nh/2π and radiate only when jumping between orbits. It works only for one-electron species like H, He⁺ and Li²⁺.','Quantum numbers: n (shell, size and energy), l (subshell, 0 to n−1, shape), mₗ (−l to +l, orientation), mₛ (±½, spin).','A subshell has 2l + 1 orbitals and a shell holds at most 2n² electrons.','Aufbau: fill in increasing (n + l); if equal, lower n first. Pauli: no two electrons share all four quantum numbers. Hund: fill each orbital singly before pairing.','Exceptions: Cr is [Ar]3d⁵4s¹ and Cu is [Ar]3d¹⁰4s¹ because half-filled and full d subshells are extra stable.','Heisenberg: position and momentum cannot both be known exactly. de Broglie: every moving particle has a wavelength.','Radial nodes = n − l − 1, angular nodes = l, total nodes = n − 1.'],f:['E = hν = hc / λ','ν = c / λ,  wavenumber = 1 / λ','Bohr radius rₙ = 0.529 n² / Z  Å','Eₙ = −13.6 Z² / n²  eV','vₙ = 2.18 × 10⁶ × Z / n  m/s','1/λ = R Z² (1/n₁² − 1/n₂²),  R = 1.097 × 10⁷ m⁻¹','Spectral lines from level n to ground: n(n − 1) / 2','de Broglie: λ = h / mv = h / p','Uncertainty: Δx·Δp ≥ h / 4π','Photoelectric: hν = W₀ + KE(max)','Spin-only magnetic moment μ = √(n(n + 2)) BM','Orbital angular momentum = √(l(l + 1)) · h / 2π','Neutrons = A − Z','Nodes: radial = n − l − 1,  angular = l'],k:['Cations lose electrons from the highest n first (4s before 3d).','Use the (n + l) rule for filling order.','Bohr’s formulas apply only to one-electron species.']},
{s:'mathematics',t:'Quadratic Equations',n:['Standard form ax² + bx + c = 0 with a ≠ 0. Roots are x = (−b ± √D) / 2a where D = b² − 4ac.','D > 0 gives real distinct roots, D = 0 gives equal roots, and D < 0 gives complex conjugate roots (real coefficients).','Sum of roots = −b/a and product = c/a. A quadratic with roots α and β is x² − (α + β)x + αβ = 0.','If a > 0 and D < 0, then the expression is positive for every real x. The parabola opens upwards for a > 0 with its minimum at x = −b / 2a.','Special cases: roots are reciprocals if c = a; one root is zero if c = 0; roots are equal and opposite if b = 0.','Common root of two quadratics: (c₁a₂ − c₂a₁)² = (a₁b₂ − a₂b₁)(b₁c₂ − b₂c₁). Both roots are common if a₁/a₂ = b₁/b₂ = c₁/c₂.','To place a number k relative to the roots, check the sign of f(k) and the position of the vertex.'],f:['x = (−b ± √(b² − 4ac)) / 2a','D = b² − 4ac','α + β = −b/a,  αβ = c/a','|α − β| = √D / |a|','α² + β² = (α + β)² − 2αβ','α³ + β³ = (α + β)³ − 3αβ(α + β)','1/α + 1/β = (α + β) / αβ','Vertex = (−b / 2a,  −D / 4a)','Minimum (a > 0) or maximum (a < 0) value = −D / 4a','Equation from roots: x² − (α + β)x + αβ = 0','Cubic ax³ + bx² + cx + d: Σα = −b/a, Σαβ = c/a, αβγ = −d/a','Complex roots come in pairs: p + iq and p − iq'],k:['Always compute D first.','Do not forget the condition a ≠ 0.','For inequalities, use the sign of the parabola.']});
CHAPS.push({s:'physics',t:'Electric Charges & Fields',tb:1,n:['Charge is quantised (q = ne, e = 1.6 × 10⁻¹⁹ C), additive and conserved. Like charges repel; unlike charges attract.','Coulomb’s law holds for static point charges: F = kq₁q₂ / r² with k = 9 × 10⁹ N m²/C². In a medium of dielectric constant K the force becomes F / K.','Superposition: the net force on a charge is the vector sum of forces from every other charge; one charge’s force is not changed by the others.','Electric field E = F / q₀ (test charge → 0). For a point charge E = kQ / r², pointing away from +Q.','Null point of two like charges lies between them; for unlike charges it lies outside, nearer the smaller charge. For like charges, its distance from Q₁ is r√Q₁ / (√Q₁ + √Q₂).','Field lines start on + and end on −, never cross, never form closed loops, are denser where the field is stronger and meet a conductor at right angles.','Dipole: equal and opposite charges, p = q·2a pointing from − to +. In a uniform field it feels torque τ = pE sinθ but no net force; U = −pE cosθ.','Gauss’s law: flux through a closed surface = q(enclosed) / ε₀. Only enclosed charge counts in the flux, but E is due to all charges. Use it for spheres, cylinders and planes.','Charged spherical shell: E = kQ / r² outside and 0 inside. Solid insulating sphere: E = kQr / R³ inside and kQ / r² outside.'],f:['Charge quantisation | q = ne | C','Coulomb’s force | F = kq₁q₂ / r² | N','Force in a medium | F = kq₁q₂ / (K r²) | N','Electric field | E = F / q | N/C','Point charge field | E = kQ / r² | N/C','Linear charge density | λ = Q / L | C/m','Surface charge density | σ = Q / A | C/m²','Volume charge density | ρ = Q / V | C/m³','Electric flux | Φ = E A cosθ | N m²/C','Gauss’s law | Φ = q(enc) / ε₀ | N m²/C','Dipole moment | p = q·2a | C·m','Torque on a dipole | τ = pE sinθ | N·m','Dipole potential energy | U = −pE cosθ | J','Axial field of dipole | E = 2kp / r³ | N/C','Equatorial field of dipole | E = kp / r³ | N/C','Infinite line charge | E = λ / (2πε₀ r) | N/C','Infinite sheet | E = σ / 2ε₀ | N/C','Near a charged conductor | E = σ / ε₀ | N/C','Ring, on its axis | E = kQx / (R² + x²)^(3/2) | N/C','Inside solid sphere | E = kQr / R³ | N/C','Acceleration of a charge | a = qE / m | m/s²'],k:['Field lines never cross.','Use symmetry: Gauss’s law is best for sphere, cylinder and plane.','Dipole formulas at axial and equatorial points assume r ≫ a.']});
CHAPS.push({s:'chemistry',t:'Chemical Bonding',n:['Ionic bonds form by electron transfer between a metal and a non-metal; they are favoured by low ionisation energy, high electron affinity and high lattice energy.','Covalent bonds share electron pairs. Fajans’ rule: a small, highly charged cation and a large anion increase covalent character.','VSEPR: shape depends on bond pairs and lone pairs. Lone pairs repel more, so angles shrink: CH₄ 109.5°, NH₃ about 107°, H₂O about 104.5°.','Hybridisation from steric number: 2 is sp (linear), 3 is sp² (trigonal planar), 4 is sp³ (tetrahedral), 5 is sp³d (trigonal bipyramidal), 6 is sp³d² (octahedral).','Sigma bonds form by head-on overlap and pi bonds by sideways overlap. A double bond is 1σ + 1π and a triple bond is 1σ + 2π.','MO theory: bond order = (Nb − Na) / 2. O₂ is paramagnetic with two unpaired electrons; N₂ is diamagnetic with bond order 3.','Symmetric molecules (CO₂, BF₃, CH₄) are non-polar even when their bonds are polar, because the bond dipoles cancel.','Hydrogen bonding occurs with H bonded to F, O or N. It raises boiling points; intramolecular H-bonding (ortho-nitrophenol) makes a compound steam volatile.'],f:['Bond order = (Nb − Na) / 2','Steric number = bond pairs + lone pairs','Formal charge = V − N(nonbonding) − B/2','Hybrid orbitals = ½ [V + M − C + A]','Dipole moment μ = q × d  (1 D = 3.34 × 10⁻³⁰ C·m)','% ionic character = (observed μ / μ for 100% ionic) × 100','Magnetic moment μ = √(n(n + 2)) BM','Bond length ∝ 1 / bond order','Bond order: N₂ = 3,  O₂ = 2,  O₂⁺ = 2.5,  O₂⁻ = 1.5,  O₂²⁻ = 1','Lattice energy rises with higher ionic charge and smaller ionic radius','Single bond: 1σ.  Double: 1σ + 1π.  Triple: 1σ + 2π','Fajans: covalent character ∝ cation polarising power (charge / size)'],k:['Count lone pairs on the central atom first.','Symmetry cancels bond dipoles.','Paramagnetic means unpaired electrons.']},
{s:'mathematics',t:'Complex Numbers',n:['z = x + iy with i² = −1. Re(z) = x and Im(z) = y. The conjugate is z̄ = x − iy, and z·z̄ = |z|².','Powers of i repeat in a cycle of 4: i, −1, −i, 1.','Modulus |z| = √(x² + y²). The argument θ = tan⁻¹(y/x) must be adjusted for the quadrant; the principal argument lies in (−π, π].','Polar form: z = r(cosθ + i sinθ) = re^(iθ). Multiplying multiplies moduli and adds arguments; dividing divides moduli and subtracts arguments.','De Moivre: (cosθ + i sinθ)ⁿ = cos nθ + i sin nθ. The nth roots of unity are e^(2πik/n) for k = 0 to n − 1, and they sum to zero.','Cube roots of unity: 1, ω, ω² with ω = (−1 + i√3) / 2, ω³ = 1 and 1 + ω + ω² = 0.','Geometry: |z₁ − z₂| is the distance between two points, |z − z₀| = r is a circle, and arg(z − z₀) = α is a ray.','Triangle inequality: |z₁ + z₂| ≤ |z₁| + |z₂|.'],f:['i² = −1,  i³ = −i,  i⁴ = 1','z·z̄ = |z|²','|z| = √(x² + y²)','z⁻¹ = z̄ / |z|²','|z₁z₂| = |z₁||z₂|,  |z₁ / z₂| = |z₁| / |z₂|','arg(z₁z₂) = arg z₁ + arg z₂','Polar: z = r(cosθ + i sinθ) = re^(iθ)','Euler: e^(iθ) = cosθ + i sinθ','De Moivre: (cosθ + i sinθ)ⁿ = cos nθ + i sin nθ','nth roots of unity: e^(2πik / n)','ω = (−1 + i√3) / 2,  1 + ω + ω² = 0,  ω³ = 1','Distance: |z₁ − z₂|;  circle: |z − z₀| = r','Triangle inequality: |z₁ + z₂| ≤ |z₁| + |z₂|'],k:['Check the quadrant before writing the argument.','Use ω’s properties to simplify sums quickly.','Draw the Argand diagram for geometry problems.']});
CHAPS.push({s:'physics',t:'Current Electricity',tb:1,n:['Current I = dq/dt, taken in the direction of positive charge flow. Drift velocity v = I / (neA) is tiny, yet the signal travels almost instantly.','Ohm’s law V = IR holds for conductors at constant temperature. R = ρL/A: resistivity depends on the material and temperature, not on size. For metals R rises with temperature.','Series: same current and resistances add. Parallel: same voltage and 1/R adds.','Cell: terminal voltage V = E − Ir while discharging and E + Ir while charging. Maximum power reaches the load when R = r.','Kirchhoff’s junction rule ΣI = 0 (charge conservation) and loop rule ΣV = 0 (energy conservation).','Power P = VI = I²R = V²/R. In parallel the higher-wattage bulb glows brighter; in series the lower-wattage bulb (higher R) does.','Wheatstone bridge is balanced when P/Q = R/S and no current flows through the galvanometer. A potentiometer measures emf without drawing current.','n identical cells in series: emf nE and resistance nr. In parallel: emf E and resistance r/n.'],f:['Current | I = Δq / Δt | A','Drift velocity | v = I / (neA) | m/s','Ohm’s law | V = IR | V','Resistance | R = ρL / A | Ω','Resistivity and temperature | ρ = ρ₀[1 + α(T − T₀)] | Ω·m','Series resistance | R = R₁ + R₂ + … | Ω','Parallel resistance | 1/R = 1/R₁ + 1/R₂ + … | Ω','Cell current | I = E / (R + r) | A','Terminal voltage (discharging) | V = E − Ir | V','Power | P = VI = I²R = V²/R | W','Heat produced | H = I²Rt | J','Electrical energy | W = VIt | J','Maximum power transfer | R = r,  P(max) = E² / 4r | W','Wheatstone balance | P / Q = R / S | no unit','Cells in series | E(net) = nE,  r(net) = nr | V, Ω','Cells in parallel | E(net) = E,  r(net) = r / n | V, Ω','Current density | J = I / A = σE | A/m²','Conductivity | σ = 1 / ρ | S/m'],k:['Draw the circuit and mark current directions before applying Kirchhoff’s laws.','Stretching a wire at constant volume: R ∝ L².','Power in a bulb at a different voltage: P ∝ V².']},
{s:'chemistry',t:'Chemical Equilibrium',tb:1,n:['At equilibrium the forward and reverse rates are equal; concentrations stay constant but the reaction does not stop (it is dynamic).','Kc uses concentrations raised to the stoichiometric coefficients; pure solids and liquids are left out. Kp = Kc (RT)^Δn, with Δn = gas moles of products − reactants.','Compare Q with K: Q < K goes forward, Q > K goes backward, Q = K is at equilibrium. Reversing a reaction inverts K; multiplying it by n raises K to the nth power; adding reactions multiplies their K values.','Le Chatelier: adding reactant shifts forward; more pressure favours fewer gas moles; more heat favours the endothermic direction. Only temperature changes K. A catalyst does not change K.','pH = −log[H⁺] and pH + pOH = 14 at 25 °C. Strong acids dissociate fully; for a weak acid, α = √(Ka / C).','Buffer = weak acid plus its conjugate base. Henderson: pH = pKa + log([salt] / [acid]).','Precipitation occurs when the ionic product exceeds Ksp.','Salt hydrolysis: strong acid + strong base is neutral, strong acid + weak base is acidic, weak acid + strong base is basic.'],f:['Equilibrium constant | Kc = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ | varies','Kp and Kc | Kp = Kc (RT)^Δn | varies','Reversed reaction | K′ = 1 / K | varies','Reaction multiplied by n | K′ = Kⁿ | varies','ΔG° and K | ΔG° = −RT ln K | J/mol','Van’t Hoff | ln(K₂/K₁) = (ΔH/R)(1/T₁ − 1/T₂) | no unit','Water’s ionic product | Kw = [H⁺][OH⁻] = 10⁻¹⁴ | mol²/L²','pH | pH = −log[H⁺] | no unit','pH and pOH | pH + pOH = 14 at 25 °C | no unit','Conjugate pair | Ka × Kb = Kw | mol²/L²','Weak acid | [H⁺] = √(Ka C) | mol/L','Acidic buffer | pH = pKa + log([salt] / [acid]) | no unit','Basic buffer | pOH = pKb + log([salt] / [base]) | no unit','Ksp of AB | Ksp = s² | mol²/L²','Ksp of AB₂ | Ksp = 4s³ | mol³/L³','Ksp of A₂B₃ | Ksp = 108 s⁵ | mol⁵/L⁵'],k:['Leave out solids and liquids from K.','Catalysts speed up equilibrium but never change K.','Check Δn before converting between Kp and Kc.']},
{s:'mathematics',t:'Matrices & Determinants',n:['An m × n matrix has m rows and n columns. Special types: square, diagonal, scalar, identity, symmetric (Aᵀ = A) and skew-symmetric (Aᵀ = −A, with zero diagonal).','AB exists only if columns of A equal rows of B. In general AB ≠ BA, and (AB)ᵀ = BᵀAᵀ.','Determinant of a 2 × 2 matrix is ad − bc. Swapping two rows flips the sign; two equal rows give 0; adding a multiple of one row to another changes nothing.','|AB| = |A||B|, |Aᵀ| = |A| and |kA| = kⁿ|A| for an n × n matrix.','Inverse A⁻¹ = adj(A) / |A| exists only when |A| ≠ 0. (AB)⁻¹ = B⁻¹A⁻¹.','A·adj(A) = |A| I and |adj A| = |A|^(n−1).','For AX = B: if |A| ≠ 0 there is a unique solution (Cramer’s rule). If |A| = 0 the system has no solution or infinitely many.','Cayley–Hamilton: every square matrix satisfies its own characteristic equation.'],f:['|A| = ad − bc  for [[a, b], [c, d]]','A⁻¹ = adj(A) / |A|','2 × 2 inverse: (1 / (ad − bc)) · [[d, −b], [−c, a]]','(AB)ᵀ = BᵀAᵀ,  (AB)⁻¹ = B⁻¹A⁻¹','|AB| = |A||B|,  |Aᵀ| = |A|','|kA| = kⁿ|A|  (order n)','|adj A| = |A|^(n−1)','|A⁻¹| = 1 / |A|','A · adj(A) = |A| I','Cramer’s rule: x = Dₓ / D,  y = D_y / D','Trace(A) = sum of the diagonal entries','Area of triangle = ½ |det [[x₁, y₁, 1], [x₂, y₂, 1], [x₃, y₃, 1]]|'],k:['Check |A| ≠ 0 before looking for an inverse.','Order matters: AB is not BA.','Use row operations to simplify a determinant first.']});
CHAPS.push({s:'physics',t:'Work, Energy & Power',tb:1,n:['Work W = F s cosθ = ∫F·ds. It is zero when the force is perpendicular to the displacement (for example a centripetal force). The area under an F–x graph is the work.','Work–energy theorem: net work equals the change in kinetic energy. KE = ½mv² = p² / 2m.','Conservative forces (gravity, spring, electrostatic) do path-independent work, so mechanical energy is conserved and F = −dU/dx.','Potential energy: mgh near the Earth’s surface and ½kx² for a spring.','Power P = dW/dt = F·v. 1 horsepower ≈ 746 W. Efficiency = output / input.','Momentum is conserved in every collision. In elastic collisions KE is also conserved; in a perfectly inelastic collision the bodies stick together and the maximum KE is lost.','Elastic head-on collision: relative speed of approach equals relative speed of separation, and equal masses exchange velocities.','Vertical circle with a string: minimum speed at the top is √(gr), so at the bottom it must be at least √(5gr).'],f:['Work | W = F s cosθ | J','Variable force | W = ∫F dx | J','Kinetic energy | KE = ½mv² = p² / 2m | J','Work–energy theorem | W(net) = ΔKE | J','Gravitational PE | U = mgh | J','Spring PE | U = ½kx² | J','Force from PE | F = −dU / dx | N','Power | P = W / t = F·v | W','Efficiency | η = (output / input) × 100 | %','Momentum | p = mv | kg·m/s','Elastic 1D collision | v₁ = [(m₁ − m₂)u₁ + 2m₂u₂] / (m₁ + m₂) | m/s','Perfectly inelastic | v = (m₁u₁ + m₂u₂) / (m₁ + m₂) | m/s','Restitution | e = (v₂ − v₁) / (u₁ − u₂) | no unit','Vertical circle, bottom | v ≥ √(5gr) | m/s','Vertical circle, top | v ≥ √(gr) | m/s'],k:['Use energy methods when forces vary or the path is complicated.','Friction is non-conservative: mechanical energy is not conserved.','Check which quantity is conserved before solving a collision.']},
{s:'chemistry',t:'General Organic Chemistry',n:['IUPAC naming: choose the longest chain containing the principal functional group and number it to give that group the lowest locant. Priority: acid > ester > amide > aldehyde > ketone > alcohol > amine.','Carbon hybridisation: sp³ (109.5°, alkanes), sp² (120°, alkenes), sp (180°, alkynes). More s-character means higher electronegativity.','Inductive effect works through sigma bonds and fades quickly with distance. −I groups: NO₂, CN, halogens. +I groups: alkyl groups.','Resonance (mesomeric) effect: +M groups (–OH, –NH₂, –OR) donate electrons; −M groups (–NO₂, –CHO, –CN, –COOH) withdraw them. Hyperconjugation: more α-hydrogens give more stability.','Stability: carbocations 3° > 2° > 1° > methyl; carbanions methyl > 1° > 2° > 3°; free radicals 3° > 2° > 1°.','Acid strength depends on the stability of the conjugate base: carboxylic acids > phenol > alcohols. −I groups strengthen an acid and +I groups weaken it.','Isomerism: structural (chain, position, functional, metamerism, tautomerism) and stereo (geometrical and optical).','A carbon with four different groups is chiral. Enantiomers rotate plane-polarised light equally in opposite directions; a racemic mixture is optically inactive.'],f:['Degree of unsaturation = (2C + 2 + N − H − X) / 2','Stereoisomers with n different chiral centres = 2ⁿ','s-character: sp³ = 25%,  sp² = 33%,  sp = 50%','Bond angles: sp³ 109.5°,  sp² 120°,  sp 180°','Specific rotation [α] = observed rotation / (l × c)','Enantiomeric excess = |R − S| / (R + S) × 100%','Aromatic: planar, cyclic, fully conjugated, (4n + 2) π electrons','Structural isomers: C₄H₁₀ = 2,  C₅H₁₂ = 3,  C₆H₁₄ = 5','Hyperconjugation structures = number of α-hydrogens','Single bond = 1σ;  each extra bond adds one π'],k:['Compare stability of the intermediate to predict the major product.','Check for resonance before using the inductive effect.','Count chiral centres before counting stereoisomers.']},
{s:'mathematics',t:'Sequences & Series',n:['AP: constant difference d and aₙ = a + (n − 1)d. Three numbers in AP can be written a − d, a, a + d, which have sum 3a.','GP: constant ratio r and aₙ = a rⁿ⁻¹. The sum to infinity exists only when |r| < 1.','HP: the reciprocals of the terms form an AP.','For positive numbers AM ≥ GM ≥ HM, with equality only when all numbers are equal. For two numbers, GM² = AM × HM.','Standard sums: Σn = n(n + 1)/2, Σn² = n(n + 1)(2n + 1)/6, Σn³ = [n(n + 1)/2]².','Arithmetico-geometric series: multiply by r and subtract to reduce it to a GP.','Method of differences: if tₙ = f(n) − f(n − 1), the terms telescope.','To insert n AMs between a and b, use d = (b − a) / (n + 1).'],f:['AP: aₙ = a + (n − 1)d','AP sum: Sₙ = n/2 [2a + (n − 1)d] = n/2 (a + l)','AM = (a + b) / 2,  GM = √(ab),  HM = 2ab / (a + b)','GM² = AM × HM  (two numbers)','GP: aₙ = a rⁿ⁻¹','GP sum: Sₙ = a(rⁿ − 1) / (r − 1),  r ≠ 1','Infinite GP: S∞ = a / (1 − r),  |r| < 1','Σn = n(n + 1) / 2','Σn² = n(n + 1)(2n + 1) / 6','Σn³ = [n(n + 1) / 2]²','AGP to infinity: a/(1 − r) + dr/(1 − r)²','n AMs between a and b: d = (b − a) / (n + 1)'],k:['Write terms as a − d, a, a + d for symmetric AP problems.','Check |r| < 1 before using S∞.','Use telescoping when tₙ looks like a difference.']});
CHAPS.push({s:'physics',t:'Rotational Motion',tb:1,n:['Angular displacement θ, angular velocity ω = dθ/dt and angular acceleration α = dω/dt link to linear motion by v = ωr, tangential acceleration αr and centripetal acceleration ω²r.','With constant α the equations mirror the linear ones: ω = ω₀ + αt, θ = ω₀t + ½αt², ω² = ω₀² + 2αθ.','Moment of inertia I = Σmr² depends on the axis and on how mass is distributed. Parallel-axis: I = I(cm) + Md². Perpendicular-axis (flat bodies): I(z) = I(x) + I(y).','Torque τ = r × F = Iα. Angular momentum L = Iω; with no external torque L is conserved (a skater pulling in her arms spins faster).','Rotational KE = ½Iω². Rolling without slipping means v = ωR, with total KE = ½mv²(1 + k²/R²).','Equilibrium needs ΣF = 0 and Στ = 0.','Rolling down an incline without slipping: a = g sinθ / (1 + I/MR²). The body with the smaller I/MR² (solid sphere) reaches the bottom first.'],f:['Angular velocity | ω = dθ / dt | rad/s','Angular acceleration | α = dω / dt | rad/s²','Link to linear motion | v = ωr,  a(t) = αr | m/s, m/s²','Rotational kinematics | ω = ω₀ + αt,  θ = ω₀t + ½αt² | rad/s, rad','Moment of inertia | I = Σmr² | kg·m²','Parallel axis | I = I(cm) + Md² | kg·m²','Perpendicular axis | I(z) = I(x) + I(y) | kg·m²','Torque | τ = Iα = rF sinθ | N·m','Angular momentum | L = Iω | kg·m²/s','Rotational KE | ½Iω² | J','Ring (axis through centre) | I = MR² | kg·m²','Disc | I = ½MR² | kg·m²','Solid sphere | I = (2/5)MR² | kg·m²','Rod about centre | I = ML² / 12 | kg·m²','Rod about one end | I = ML² / 3 | kg·m²','Rolling on incline | a = g sinθ / (1 + I/MR²) | m/s²'],k:['Always state the axis when quoting a moment of inertia.','Conserve angular momentum when no external torque acts.','Rolling uses both translational and rotational energy.']},
{s:'chemistry',t:'Periodic Table & Periodicity',n:['Modern periodic law: properties are periodic functions of atomic number. Blocks (s, p, d, f) follow the subshell being filled.','Atomic radius decreases across a period (rising effective nuclear charge) and increases down a group. Cations are smaller than their atoms and anions are larger. For isoelectronic species, radius falls as nuclear charge rises.','Ionisation energy generally rises across a period and falls down a group. Exceptions: Be > B, N > O, Mg > Al and P > S because of stable filled and half-filled subshells.','Chlorine has the most negative electron gain enthalpy (fluorine is less negative due to its small size). Noble gases have positive values.','Electronegativity rises across a period and falls down a group; fluorine is highest at 4.0 on the Pauling scale.','Metallic character falls across a period and rises down a group. Oxides change from basic to amphoteric to acidic across a period (Al₂O₃ is amphoteric).','Diagonal relationships: Li–Mg, Be–Al and B–Si.','The maximum oxidation state of a p-block element equals its group number minus 10; heavier elements often show a state two lower (inert-pair effect).'],f:['Effective nuclear charge Z(eff) = Z − σ','Isoelectronic species: radius ∝ 1 / Z','IE₁ < IE₂ < IE₃ for the same element','Period 2 IE order: Li < B < Be < C < O < N < F < Ne','Mulliken electronegativity = (IE + EA) / 2','Pauling: F 4.0,  O 3.5,  N 3.0,  Cl 3.0,  C 2.5,  H 2.1','Electron gain enthalpy (magnitude): Cl > F > Br > I','s-block valence electrons = group number','p-block valence electrons = group number − 10','Maximum p-block oxidation state = group number − 10'],k:['Compare nuclear charge and number of shells for any radius question.','Remember the exceptions in ionisation energy.','Isoelectronic: more protons means a smaller ion.']},
{s:'mathematics',t:'Differentiation & Integration',n:['The derivative is the slope of the tangent: f′(x) = lim (h→0) [f(x + h) − f(x)] / h. A differentiable function is continuous, but not the other way round (|x| at 0).','Rules: product (uv)′ = u′v + uv′, quotient (u/v)′ = (u′v − uv′) / v², and chain rule d/dx f(g(x)) = f′(g(x))·g′(x).','Maxima and minima: solve f′(x) = 0, then f″ > 0 gives a minimum and f″ < 0 a maximum.','Lagrange’s mean value theorem: if f is continuous on [a, b] and differentiable on (a, b), some c has f′(c) = (f(b) − f(a)) / (b − a).','Integration reverses differentiation: ∫f dx = F + C. A definite integral gives area. For an even function ∫ from −a to a is 2∫ from 0 to a; for an odd function it is 0.','Methods: substitution, integration by parts (choose u in LIATE order) and partial fractions.','Area between curves = ∫(upper curve − lower curve) dx.'],f:['d/dx xⁿ = nxⁿ⁻¹,  d/dx eˣ = eˣ,  d/dx ln x = 1/x','d/dx aˣ = aˣ ln a','d/dx sin x = cos x,  d/dx cos x = −sin x','d/dx tan x = sec²x','d/dx sin⁻¹x = 1/√(1 − x²),  d/dx tan⁻¹x = 1/(1 + x²)','Product: (uv)′ = u′v + uv′','Quotient: (u/v)′ = (u′v − uv′) / v²','∫xⁿ dx = xⁿ⁺¹ / (n + 1) + C  (n ≠ −1)','∫(1/x) dx = ln|x| + C,  ∫eˣ dx = eˣ + C','∫sin x dx = −cos x + C,  ∫cos x dx = sin x + C','∫sec²x dx = tan x + C','∫dx / (1 + x²) = tan⁻¹x + C,  ∫dx / √(1 − x²) = sin⁻¹x + C','Parts: ∫u dv = uv − ∫v du','∫₀ᵃ f(x)dx = ∫₀ᵃ f(a − x)dx','Even f: ∫₋ₐᵃ f = 2∫₀ᵃ f;  odd f: ∫₋ₐᵃ f = 0'],k:['Do not forget +C in indefinite integrals.','Check even or odd symmetry before integrating.','Use the chain rule whenever there is a function inside a function.']});
CHAPS.push({s:'physics',t:'Magnetic Effects of Current',tb:1,n:['Force on a moving charge: F = qvB sinθ. It is perpendicular to the velocity, so it does no work and the speed does not change. In a uniform field the path is a circle of radius r = mv / qB with period T = 2πm / qB, independent of speed.','Force on a current element: F = BIL sinθ. Parallel wires carrying current in the same direction attract; opposite directions repel.','Biot–Savart law gives the field of a current element. Long straight wire: B = μ₀I / 2πr. Centre of a circular loop: B = μ₀I / 2R. Inside a long solenoid: B = μ₀nI.','Ampère’s law: the line integral of B around a closed loop equals μ₀ times the enclosed current.','A current loop in a field feels torque τ = NIAB sinθ, with magnetic moment M = NIA.','A galvanometer becomes an ammeter with a small shunt in parallel and a voltmeter with a large resistance in series.','Materials: diamagnetic (weakly repelled), paramagnetic (weakly attracted), ferromagnetic (strongly attracted). Curie’s law: susceptibility ∝ 1/T.','Lorentz force F = q(E + v × B). A velocity selector passes particles with v = E / B.'],f:['Force on a moving charge | F = qvB sinθ | N','Radius of circular path | r = mv / qB | m','Time period | T = 2πm / qB | s','Cyclotron frequency | f = qB / 2πm | Hz','Force on a wire | F = BIL sinθ | N','Parallel wires | F/L = μ₀I₁I₂ / 2πd | N/m','Biot–Savart | dB = (μ₀/4π) I dl sinθ / r² | T','Long straight wire | B = μ₀I / 2πr | T','Centre of a circular loop | B = μ₀I / 2R | T','Solenoid | B = μ₀nI | T','Ampère’s law | ∮B·dl = μ₀I(enc) | T·m','Magnetic moment | M = NIA | A·m²','Torque on a loop | τ = NIAB sinθ | N·m','Lorentz force | F = q(E + v × B) | N','Velocity selector | v = E / B | m/s','Ammeter shunt | S = I(g)G / (I − I(g)) | Ω'],k:['μ₀ = 4π × 10⁻⁷ T·m/A.','Use the right-hand rule for direction.','A magnetic force never changes a particle’s speed.']},
{s:'chemistry',t:'Redox & Electrochemistry',n:['Oxidation is loss of electrons (oxidation number rises); reduction is gain. The oxidising agent is reduced and the reducing agent is oxidised. In disproportionation one species is both oxidised and reduced.','Balance redox reactions with the ion–electron method. The n-factor of KMnO₄ is 5 in acid, 3 in neutral and 1 in strongly basic medium.','A galvanic cell turns chemical energy into electrical energy. Oxidation happens at the anode (negative) and reduction at the cathode (positive); the salt bridge keeps solutions neutral.','E°(cell) = E°(cathode) − E°(anode). A higher reduction potential means a stronger oxidising agent.','Nernst equation at 25 °C: E = E° − (0.059 / n) log Q. At equilibrium E = 0.','ΔG° = −nFE°. Faraday’s law: mass deposited m = (M / nF) × I × t.','Conductivity κ = 1/ρ. Molar conductivity Λm = κ × 1000 / C. Kohlrausch’s law: Λ°m = λ°(cation) + λ°(anion).','In electrolysis of concentrated aqueous NaCl, hydrogen forms at the cathode and chlorine at the anode.'],f:['E°(cell) = E°(cathode) − E°(anode)','Nernst: E = E° − (0.059 / n) log Q  (25 °C)','E° = (0.059 / n) log K','ΔG° = −nFE°','F = 96500 C/mol','m = (M / nF) × I × t','Λm = κ × 1000 / C  (S cm² mol⁻¹)','Kohlrausch: Λ°m = λ°(cation) + λ°(anion)','Degree of dissociation α = Λm / Λ°m','n-factor of KMnO₄: 5 (acid), 3 (neutral), 1 (basic)','Sum of oxidation numbers in a neutral compound = 0','Cell notation: Anode | Anode ion || Cathode ion | Cathode'],k:['Always write the half-reactions before combining them.','Do not multiply E° by the number of electrons.','Anode is where oxidation happens.']},
{s:'mathematics',t:'Probability',n:['P(E) = favourable outcomes / total outcomes for equally likely outcomes. 0 ≤ P(E) ≤ 1 and P(E′) = 1 − P(E).','Addition rule: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). For mutually exclusive events P(A ∩ B) = 0.','Conditional probability P(A | B) = P(A ∩ B) / P(B). Independent events satisfy P(A ∩ B) = P(A)P(B).','Total probability and Bayes’ theorem: P(Eᵢ | A) = P(Eᵢ)P(A | Eᵢ) / Σ P(Eⱼ)P(A | Eⱼ).','Binomial distribution (n trials, success probability p): P(X = r) = ⁿCᵣ pʳ qⁿ⁻ʳ with mean np and variance npq.','Random variable: E(X) = ΣxP(x) and Var(X) = E(X²) − [E(X)]².','Draws with replacement are independent; draws without replacement are dependent.','Two dice have 36 outcomes; a sum of 7 is the most likely, with probability 1/6.'],f:['P(E) = favourable / total','P(E′) = 1 − P(E)','P(A ∪ B) = P(A) + P(B) − P(A ∩ B)','Independent: P(A ∩ B) = P(A)P(B)','P(A | B) = P(A ∩ B) / P(B)','Total probability: P(A) = Σ P(Eᵢ)P(A | Eᵢ)','Bayes: P(Eᵢ | A) = P(Eᵢ)P(A | Eᵢ) / Σ P(Eⱼ)P(A | Eⱼ)','Binomial: P(X = r) = ⁿCᵣ pʳ (1 − p)ⁿ⁻ʳ','Binomial mean = np,  variance = np(1 − p)','E(X) = ΣxP(x)','Var(X) = E(X²) − [E(X)]²','P(at least one) = 1 − P(none)'],k:['Use the complement for “at least one” problems.','Check whether events are independent before multiplying.','Draw a tree diagram for Bayes’ problems.']});
let SH=null,SHB=null;
function nl(k){return Object.keys(SN).map(s=>`<h2 style="color:${COL[s]}">${SN[s]}</h2>`+CHAPS.map((c,i)=>c.s==s&&(k=='f'?c.f.length:c.n.length)?`<button class="card" style="width:100%;text-align:left;color:var(--ink);cursor:pointer;border-left:5px solid ${COL[s]}" onclick="SH=[${i},'${k}'];r()"><div class="row sp"><b>${c.t}</b><span class="tag" style="background:${COL[s]}">A4</span></div><small>${k=='n'?'Short notes':(c.ttl?'Key reactions':'All formulas')} · 1 page</small></button>`:'').join('')).join('')+'<p class="mut" style="margin-top:14px">More chapters are being added.</p>'}
var sheet=function(c,k){const C=COL[c.s].replace('var(--phy)','#2f63c4').replace('var(--che)','#d4671f').replace('var(--mat)','#7a4cc2'),it=k=='n'?c.n.map(x=>`<div style="break-inside:avoid;margin-bottom:9px">• ${x}</div>`):c.f.map(x=>`<div style="break-inside:avoid;margin-bottom:7px;padding:6px 9px;border-left:4px solid ${C};background:#f4f1ea;border-radius:4px;font-weight:500">${x}</div>`);
return `<div id="sheet" style="width:794px;height:1123px;background:#fff;color:#222;padding:40px;overflow:hidden;font-family:'DM Sans',sans-serif;position:relative"><div style="border-bottom:5px solid ${C};padding-bottom:12px"><div style="color:${C};font-weight:700;font-size:13px;letter-spacing:1px">${SN[c.s].toUpperCase()} · JEE MAIN & ADVANCED</div><div style="font-size:30px;font-weight:700;margin-top:4px">${c.t} — ${k=='n'?'Short Notes':'Formula Sheet'}</div></div><div style="columns:2;column-gap:30px;margin-top:18px;font-size:${k=='n'?16:16.5}px;line-height:1.5">${it.join('')}</div><div style="position:absolute;left:40px;right:40px;bottom:36px;background:${C}1a;border-radius:8px;padding:12px 14px;font-size:13px"><b style="color:${C}">Remember</b><br>${c.k.map(x=>'• '+x).join('<br>')}</div><div style="position:absolute;right:40px;bottom:12px;font-size:10px;color:#999">Project Aster</div></div>`}
function shv(){const c=CHAPS[SH[0]];return `<div class="row sp"><button class="chip" onclick="SH=null;r()">${ic('x',14)}Close</button><div class="row"><button class="chip on" onclick="dl()">Download PDF</button><button class="chip" onclick="shr()">Share</button></div></div><p class="mut" id="st" style="margin:8px 0"></p><div id="sc" style="width:100%;overflow:hidden;border:1px solid var(--line);border-radius:8px"><div id="sw" style="width:794px;transform-origin:0 0">${sheet(c,SH[1])}</div></div>`}
function fit(){const sc=$('#sc');if(!sc)return;const s=sc.clientWidth/794;$('#sw').style.transform=`scale(${s})`;sc.style.height=1123*s+'px'}
const stt=m=>{const e=$('#st');if(e)e.textContent=m};
async function mk(){if(SHB)return SHB;stt('Preparing your page…');const cv=await html2canvas($('#sheet'),{scale:2,backgroundColor:'#ffffff',onclone:d=>{const w=d.getElementById('sw');w.style.transform='none'}});const p=new jspdf.jsPDF({unit:'mm',format:'a4'});p.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);return SHB=p.output('blob')}
const fn=()=>CHAPS[SH[0]].t.replace(/\W+/g,'-')+(SH[1]=='n'?'-notes':'-formulas')+'.pdf';
async function dl(){try{const b=await mk(),d=window.claude&&await claude.use('downloads');if(!d)return stt('Download is not available here. Try Share instead.');await d.save({filename:fn(),data:b});stt('Saved!')}catch(e){stt('Could not download: '+(e.message||e.code||'unknown error'))}}
async function shr(){try{const b=await mk(),f=new File([b],fn(),{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:fn()});else if(navigator.share)await navigator.share({title:CHAPS[SH[0]].t+' – Project Aster',url:location.href});else stt('Sharing is not supported on this device.');stt('')}catch(e){stt('Could not share: '+(e.message||'cancelled'))}}
var sheet0=sheet;const CC=s=>({physics:'#2f63c4',chemistry:'#d4671f',mathematics:'#7a4cc2'})[s];

function fitSheet(){const s=$('#sheet');if(!s)return;const t=s.querySelector('table'),c=t||s.querySelector('div[style*=columns]'),g=s.querySelector('div[style*=flex][style*=top]');if(!c)return;const sr=s.getBoundingClientRect(),k=sr.height/1123;if(!k)return;let fs=parseFloat(getComputedStyle(c).fontSize);const lim=g?(g.getBoundingClientRect().top-sr.top)/k-8:975;for(let i=0;i<16;i++){const bot=(c.getBoundingClientRect().bottom-sr.top)/k;if(bot<=lim||fs<9)break;fs-=.6;c.style.fontSize=fs+'px';if(t)t.querySelectorAll('td,th').forEach(x=>x.style.padding='3px 7px')}}
const NN={'Units & Measurement':['The seven SI base quantities are length (m), mass (kg), time (s), current (A), temperature (K), amount of substance (mol) and luminous intensity (cd). All other units are derived from these.','Principle of homogeneity: every term in a correct equation has the same dimensions. Dimensional analysis can check equations, convert units and derive relations, but it cannot give dimensionless constants.','Least count is the smallest reading an instrument can give: vernier = 1 MSD − 1 VSD; screw gauge = pitch / number of circular divisions.','Zero error: subtract a positive zero error from the reading and add a negative one.','Errors: absolute, relative and percentage. In sums and differences absolute errors add; in products and quotients relative errors add; for Aⁿ the relative error is multiplied by n.','Significant figures: all non-zero digits count, zeros between digits count, leading zeros do not. In sums and differences keep the fewest decimal places.','Systematic errors can be corrected; random errors shrink by repeating readings and taking the mean.'],
'Gravitation':['Newton’s law: two masses attract with force F = Gm₁m₂ / r² along the line joining them. G is a universal constant; g is not.','g at the surface is GM / R². It falls with height (g′ ≈ g(1 − 2h/R) for small h) and with depth (g′ = g(1 − d/R)), and is zero at the Earth’s centre.','Gravitational potential is negative and rises to zero at infinity: V = −GM / r and U = −GMm / r. The field is the negative slope of the potential.','Escape velocity is √(2GM/R) ≈ 11.2 km/s and orbital velocity near the surface is √(gR) ≈ 7.9 km/s, so escape = √2 × orbital.','Kepler’s laws: orbits are ellipses with the Sun at one focus; the line to the planet sweeps equal areas in equal times (angular momentum is conserved); T² ∝ a³.','For a satellite, KE = +GMm / 2r, PE = −GMm / r and total energy = −GMm / 2r. A lower orbit means higher speed and a shorter period.','A geostationary satellite has a 24 h period, orbits above the equator and sits about 36,000 km above the surface (r ≈ 6.6 R).','Weightlessness in orbit happens because satellite and astronaut fall freely together; gravity has not disappeared.'],
'Properties of Solids & Liquids':['Hooke’s law: stress is proportional to strain within the elastic limit. Young’s modulus Y = stress / strain; bulk modulus relates pressure change to volume strain; the rigidity modulus describes shear.','Stress–strain curve: proportional limit, elastic limit, yield point, ultimate strength, fracture. Ductile materials stretch a lot before breaking; brittle ones break soon after the elastic limit.','Pressure at depth h is P₀ + ρgh and acts equally in all directions. Pascal’s law: pressure on a confined fluid is transmitted equally everywhere (hydraulic lift).','Archimedes: upthrust equals the weight of fluid displaced. A body floats when its average density is less than the fluid’s.','Continuity: A₁v₁ = A₂v₂. Bernoulli: P + ½ρv² + ρgh is constant along a streamline (energy conservation for ideal flow).','Viscosity resists relative motion of layers. Stokes’ force is 6πηrv, and terminal velocity is reached when weight = buoyancy + viscous force. Viscosity falls with temperature for liquids and rises for gases.','Surface tension is force per unit length. Excess pressure is 2T/R in a drop and 4T/R in a soap bubble; capillary rise h = 2T cosθ / (ρgr).','Heat transfer: conduction needs a medium, convection needs fluid motion and radiation needs neither. Stefan’s law P = eσAT⁴; Newton’s law of cooling holds for small temperature differences.'],
'Thermodynamics':['Zeroth law: if two bodies are each in thermal equilibrium with a third, they are in equilibrium with each other. This is what defines temperature.','First law: ΔQ = ΔU + ΔW. Heat supplied goes into internal energy and work done by the gas. For an ideal gas U depends only on temperature.','Processes: isothermal (ΔU = 0), isobaric (W = PΔV), isochoric (W = 0) and adiabatic (Q = 0, PVᵞ constant).','Work done equals the area under the P–V curve; in a cycle it is the enclosed area, positive for a clockwise cycle.','Mayer’s relation Cp − Cv = R. γ = Cp / Cv = 1 + 2/f: 5/3 for monatomic and 7/5 for diatomic gases.','Second law: heat does not flow by itself from cold to hot, and no engine can turn all the heat it absorbs into work.','A Carnot engine working between T₁ and T₂ is reversible and has the maximum efficiency 1 − T₂/T₁. No real engine can do better.','Refrigerator: coefficient of performance = T₂ / (T₁ − T₂) = Q₂ / W.'],
'Kinetic Theory of Gases':['Assumptions: point-like molecules, random motion, elastic collisions, no intermolecular forces except during collisions, and negligible collision time.','Pressure P = ⅓ρv²(rms) comes from molecular impacts on the walls, and PV = nRT = NkT.','Average translational KE per molecule is (3/2)kT. It depends only on temperature, not on the type of gas.','Speeds: v(rms) = √(3RT/M), v(avg) = √(8RT/πM), v(mp) = √(2RT/M). The ratio v(mp) : v(avg) : v(rms) = 1 : 1.13 : 1.22.','Degrees of freedom f: 3 for monatomic, 5 for rigid diatomic and 6 for non-linear polyatomic gases. Equipartition: each contributes ½kT per molecule.','Cv = fR/2, Cp = (f/2 + 1)R and γ = 1 + 2/f.','Mean free path λ = kT / (√2 π d² P): longer at low pressure and high temperature.','Dalton’s law: total pressure is the sum of partial pressures. Graham’s law: rate of effusion ∝ 1/√M.'],
'Oscillations & Waves':['SHM: the restoring force is proportional to displacement, so a = −ω²x. The period T = 2π/ω does not depend on amplitude.','Spring: T = 2π√(m/k). Simple pendulum (small angles): T = 2π√(L/g). Springs in series: 1/k = Σ1/k; in parallel: k = Σk.','Energy in SHM: the total ½kA² is constant while KE and PE swap twice per cycle. Maximum speed Aω is at the mean position and maximum acceleration Aω² is at the extremes.','Waves: transverse (particles move perpendicular to travel) and longitudinal (parallel). v = fλ. Speed on a string √(T/μ); speed of sound in a gas √(γP/ρ).','Interference: constructive for path difference nλ and destructive for (n + ½)λ.','Standing waves: a string fixed at both ends has f = nv/2L. An open pipe has all harmonics f = nv/2L; a closed pipe has only odd harmonics f = (2n − 1)v/4L.','Beats: two close frequencies give a beat frequency |f₁ − f₂|.','Doppler effect: f′ = f(v ± v₀)/(v ∓ vₛ). Motion of source and observer towards each other raises the frequency.'],
'Electric Potential & Capacitance':['Potential V = kQ/r is a scalar, so potentials from many charges add algebraically. The potential energy of two charges is kq₁q₂/r.','The field points towards falling potential: E = −dV/dr. Equipotential surfaces are perpendicular to field lines and no work is done moving along them.','Inside a conductor E = 0 and the potential is constant; the charge sits on the surface.','Capacitance C = Q/V depends only on geometry. Parallel plate: C = ε₀A/d, and a dielectric of constant K multiplies it by K.','Series capacitors share the same charge and 1/C adds. Parallel capacitors share the same voltage and C adds.','Stored energy U = ½CV² = Q²/2C, with energy density ½ε₀E² in the field.','A connected battery keeps V constant; a disconnected charged capacitor keeps Q constant. Inserting a dielectric changes the energy differently in each case.','When capacitors share charge, charge is conserved and some energy is lost as heat: ΔU = C₁C₂(V₁ − V₂)² / 2(C₁ + C₂).'],
'EMI & Alternating Current':['Magnetic flux Φ = BA cosθ. Faraday: induced emf = −dΦ/dt. Lenz’s law (the minus sign): the induced current opposes the change that produces it.','Motional emf for a rod of length ℓ moving at speed v is Bℓv. For a rod rotating about one end, ε = ½Bωℓ².','Self-inductance: ε = −L dI/dt, and the energy stored is ½LI². Mutual inductance links two coils.','AC voltage V = V₀ sinωt has rms value V₀/√2, about 0.707 V₀.','Reactances: X(L) = ωL and X(C) = 1/ωC. Current lags voltage by 90° in a pure inductor, leads by 90° in a pure capacitor and is in phase in a resistor.','Series LCR: Z = √(R² + (X(L) − X(C))²). At resonance ω₀ = 1/√(LC), Z = R and the current is maximum.','Average power P = V(rms)I(rms)cosφ with power factor cosφ = R/Z. A pure inductor or capacitor uses no average power (wattless current).','Transformer: V(s)/V(p) = N(s)/N(p). A step-up transformer has more secondary turns. Laminated cores reduce eddy-current losses.'],
'Electromagnetic Waves':['Maxwell added the displacement current ε₀ dΦ(E)/dt, which makes Ampère’s law consistent and predicts electromagnetic waves.','EM waves are transverse: E, B and the direction of travel are mutually perpendicular, with E₀/B₀ = c = 1/√(μ₀ε₀) ≈ 3 × 10⁸ m/s in vacuum.','They need no medium, carry energy and momentum, and are not deflected by electric or magnetic fields.','Spectrum from longest to shortest wavelength: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma ray.','Uses: radio waves (communication), microwaves (radar and ovens), infrared (heating, remotes), UV (sterilising), X-rays (imaging), gamma rays (cancer treatment).','Energy is shared equally between the electric and magnetic fields. Intensity I = ½ε₀cE₀².','In a medium the speed v = 1/√(με) is less than c; the frequency stays the same and the wavelength changes.','Radiation pressure is I/c on a perfect absorber and 2I/c on a perfect reflector.'],
'Optics':['Reflection: the angle of incidence equals the angle of reflection. Mirror formula 1/v + 1/u = 1/f with f = R/2 (distances measured against the incident light are negative).','Refraction: Snell’s law n₁ sinθ₁ = n₂ sinθ₂. Total internal reflection needs light going into a rarer medium beyond the critical angle, sinC = 1/n.','Thin lens: 1/v − 1/u = 1/f, with lens maker’s formula 1/f = (n − 1)(1/R₁ − 1/R₂). Power P = 1/f in dioptres; powers of lenses in contact add.','Prism: δ = i + e − A. At minimum deviation n = sin((A + δ(m))/2) / sin(A/2); for a thin prism δ = (n − 1)A.','Microscope: M ≈ (v/u)(1 + D/f(e)). Astronomical telescope in normal adjustment: M = f(o)/f(e).','Young’s double slit: fringe width β = λD/d; bright fringes for path difference nλ and dark for (n + ½)λ. The sources must be coherent.','Single-slit diffraction: minima at a sinθ = nλ; the central maximum is the widest and brightest.','Polarisation shows light is transverse. Malus’ law I = I₀cos²θ; Brewster’s law tanθ(B) = n.'],
'Dual Nature of Radiation & Matter':['Photoelectric effect: electrons are emitted only if the frequency exceeds the threshold ν₀, however intense the light, and emission is instantaneous.','Einstein’s equation hν = φ + KE(max), where φ = hν₀ is the work function. KE(max) rises linearly with frequency and does not depend on intensity.','Stopping potential V₀ satisfies eV₀ = KE(max). The saturation current is proportional to intensity (the number of photons).','Photon energy E = hν = hc/λ ≈ 12400 eV·Å / λ, and photon momentum p = h/λ.','de Broglie: every moving particle has wavelength λ = h/p = h/√(2mK). For an electron accelerated through V volts, λ ≈ 12.27/√V Å.','The Davisson–Germer experiment showed electron diffraction and confirmed the wave nature of matter.','Wave theory could not explain the threshold frequency, the instant emission or the independence of KE from intensity.','A V₀ vs ν graph is a straight line of slope h/e, and its intercept on the frequency axis is ν₀.'],
'Atoms & Nuclei':['Rutherford’s alpha scattering showed a small, dense, positive nucleus; most alpha particles go straight through. His model could not explain atomic stability or line spectra.','Bohr’s postulates: stationary orbits with L = nh/2π, and radiation only in jumps, hν = E₂ − E₁. rₙ = 0.529 n²/Z Å and Eₙ = −13.6 Z²/n² eV.','Hydrogen series: Lyman (to n = 1, ultraviolet), Balmer (n = 2, visible) and Paschen (n = 3, infrared), with 1/λ = RZ²(1/n₁² − 1/n₂²).','Nuclear radius R = R₀A^(1/3) with R₀ ≈ 1.2 fm, so nuclear density is about the same for every nucleus (around 10¹⁷ kg/m³).','Mass defect Δm = Zm(p) + (A − Z)m(n) − M and binding energy = Δm × 931.5 MeV. Binding energy per nucleon peaks near iron at about 8.8 MeV.','Radioactive decay: N = N₀e^(−λt), T½ = 0.693/λ and mean life 1/λ. Alpha decay lowers A by 4 and Z by 2; beta decay changes Z by 1.','Fission splits heavy nuclei and fusion joins light ones; both release energy because the products have higher binding energy per nucleon.','Activity A = λN is measured in becquerel (decays per second).'],
'Electronic Devices':['Semiconductors (Si, Ge) conduct less than metals and more than insulators, and their conductivity rises with temperature. Doping gives n-type (pentavalent donors) or p-type (trivalent acceptors).','A p–n junction forms a depletion region with a built-in barrier of about 0.7 V for Si and 0.3 V for Ge.','Forward bias lowers the barrier and the diode conducts above the knee voltage; reverse bias widens it and only a tiny leakage current flows until breakdown.','Rectifiers: a half-wave rectifier uses one diode; a full-wave rectifier uses two or four diodes and doubles the ripple frequency. A capacitor filter smooths the output.','A Zener diode works in reverse breakdown and holds a steady voltage across a load, so it is used as a voltage regulator.','Special diodes: an LED emits light in forward bias, a photodiode works in reverse bias with current depending on light, and a solar cell generates voltage with no bias.','Logic gates: AND, OR, NOT, and the universal gates NAND and NOR, since any circuit can be built from either one alone.','AND outputs 1 only if all inputs are 1; OR outputs 0 only if all inputs are 0; NAND = NOT(AND) and NOR = NOT(OR).']};

const NC={'Some Basic Concepts':['Matter is pure (elements, compounds) or a mixture (homogeneous or heterogeneous). Laws: conservation of mass, definite proportions, multiple proportions, Gay-Lussac’s law of gaseous volumes and Avogadro’s law.','One atomic mass unit is 1/12 the mass of a carbon-12 atom (1.66 × 10⁻²⁷ kg). Molar mass in g/mol equals the molecular mass in u.','A mole contains 6.022 × 10²³ entities. One mole of a gas occupies 22.4 L at 0 °C and 1 atm (22.7 L at 1 bar).','Empirical formula: divide each percentage by its atomic mass, then by the smallest result. Molecular formula = n × empirical formula, where n = molar mass / empirical formula mass.','Concentration terms: molarity (mol/L, changes with temperature), molality (mol/kg, does not), mole fraction, mass percent and ppm.','Stoichiometry: balance the equation, convert to moles and use the mole ratio. The limiting reagent decides the amount of product; percentage yield = actual / theoretical × 100.','Equivalent concept: equivalents = moles × n-factor, and equivalents of reactants are equal in a complete reaction (N₁V₁ = N₂V₂).','Report answers with the right number of significant figures.'],
'Solutions':['Raoult’s law: the partial vapour pressure of a component equals its mole fraction times the vapour pressure of the pure component. Ideal solutions obey it at all compositions, with ΔH(mix) = 0 and ΔV(mix) = 0.','Positive deviation (weaker A–B attraction, such as ethanol and water): higher vapour pressure, ΔH(mix) > 0, minimum-boiling azeotropes. Negative deviation (stronger A–B attraction, such as chloroform and acetone): ΔH(mix) < 0, maximum-boiling azeotropes.','Colligative properties depend on the number of solute particles: relative lowering of vapour pressure, boiling point elevation ΔT(b) = K(b) m, freezing point depression ΔT(f) = K(f) m and osmotic pressure π = CRT.','The van’t Hoff factor i corrects for dissociation (i > 1) and association (i < 1). Use ΔT = iKm and π = iCRT for electrolytes.','Henry’s law: solubility of a gas rises with its partial pressure (p = K(H) x) and falls as temperature rises.','Isotonic solutions have the same osmotic pressure. Reverse osmosis applies a pressure greater than π to push solvent out of the solution, as in desalination.','Molality does not change with temperature, so it is preferred for temperature-dependent work.','Molar mass from colligative data: M = 1000 K w / (ΔT W), with w grams of solute in W grams of solvent.'],
'Chemical Kinetics':['The rate is the change in concentration of a reactant or product per unit time. The rate law r = k[A]ᵐ[B]ⁿ is found by experiment; order = m + n. Molecularity is the number of molecules in an elementary step and is never zero or fractional.','Integrated laws: zero order [A] = [A]₀ − kt; first order ln[A] = ln[A]₀ − kt, so k = (2.303 / t) log([A]₀ / [A]); second order 1/[A] = 1/[A]₀ + kt.','Half-lives: zero order [A]₀ / 2k; first order 0.693 / k (independent of concentration); second order 1 / (k[A]₀).','Units of k are (mol/L)^(1 − n) s⁻¹: s⁻¹ for first order and L mol⁻¹ s⁻¹ for second order.','Arrhenius: k = A e^(−Eₐ/RT). A plot of ln k against 1/T is a straight line with slope −Eₐ/R. The rate roughly doubles for a 10 °C rise.','A catalyst lowers the activation energy by giving a new path. It does not change ΔH, K or the equilibrium position.','Collision theory: only collisions with energy of at least Eₐ and the correct orientation lead to reaction.','Pseudo-first-order reactions have one reactant in large excess, so its concentration is effectively constant (for example ester or sucrose hydrolysis in water).'],
'Coordination Compounds':['Werner’s theory: the metal has a primary valence (oxidation state, ionisable) and a secondary valence (coordination number, non-ionisable and directed in space).','Ligands donate electron pairs: monodentate (NH₃, Cl⁻), bidentate (en, oxalate) and polydentate (EDTA). Chelates are especially stable. Ambidentate ligands (NO₂⁻, SCN⁻) can bind through two different atoms.','Naming: ligands in alphabetical order, then the metal with its oxidation state in Roman numerals; anionic complexes end in “-ate”. Example: [Cu(NH₃)₄]SO₄ is tetraamminecopper(II) sulphate.','Isomerism: structural (ionisation, linkage, coordination, hydrate) and stereo (geometrical and optical). Square planar MA₂B₂ and octahedral MA₄B₂ show cis–trans isomerism.','Valence bond theory: octahedral complexes use d²sp³ (inner orbital, low spin) or sp³d² (outer orbital, high spin); tetrahedral use sp³; square planar use dsp².','Crystal field theory: octahedral splitting gives lower t₂g and higher e(g) levels separated by Δ₀. Strong-field ligands (CN⁻, CO) give low spin if Δ₀ > P; weak-field ligands (I⁻, Br⁻, Cl⁻, F⁻) give high spin. Δt ≈ (4/9)Δ₀, so tetrahedral complexes are nearly always high spin.','Colour comes from d–d transitions; d⁰ and d¹⁰ ions are usually colourless. Magnetic moment μ = √(n(n + 2)) BM.','Uses: EDTA in hardness titrations, cisplatin in cancer therapy, the cyanide process for gold and silver, and biological systems such as haemoglobin and chlorophyll.'],
'Titration & Practical Chemistry':['Titration finds an unknown concentration by reacting it with a standard solution until the end point, which an indicator shows. N₁V₁ = N₂V₂.','Indicators: phenolphthalein (pH 8.2 to 10) suits titrations ending on the basic side; methyl orange (pH 3.1 to 4.4) suits those ending on the acidic side.','KMnO₄ is its own indicator (colourless to a lasting pink) and is used in acidic medium with dilute H₂SO₄; never use HCl, which it would oxidise.','Stoichiometry: 2 KMnO₄ react with 5 H₂C₂O₄ (oxalic acid, warm to about 60–70 °C) and 1 KMnO₄ with 5 Fe²⁺ (Mohr’s salt).','Technique: read the burette at eye level, rinse the burette and pipette with the solution they will hold, and do not blow out the last drop of a pipette.','Preparations to know: Mohr’s salt, potash alum, acetanilide, p-nitroacetanilide, aniline yellow and iodoform, with their reagents and recrystallisation.','Salt analysis: test anions with dilute and concentrated H₂SO₄, then use group reagents for cations (Group I HCl: Pb²⁺; Group II H₂S in acid: Cu²⁺; Group III NH₄OH: Al³⁺, Fe³⁺; Group IV H₂S in base: Zn²⁺, Ni²⁺; Group V (NH₄)₂CO₃: Ca²⁺, Ba²⁺; then Mg²⁺; ammonium by warming with NaOH).','Thermochemistry practicals use q = mcΔT. Neutralisation of a strong acid by a strong base gives about −57 kJ/mol.']};
