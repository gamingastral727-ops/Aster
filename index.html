nn('p-Block Elements',['Group 13: boron is a non-metal that forms electron-deficient covalent compounds (BF₃ is a Lewis acid; diborane B₂H₆ has banana bonds). Aluminium is amphoteric. Boric acid is a weak Lewis acid, and borax gives a glassy bead on heating.','Group 14: carbon shows catenation and has allotropes (diamond sp³, graphite sp², fullerenes). Silicon forms silicates, silica and silicones. The inert-pair effect makes Pb(II) more stable than Pb(IV).','Group 15: N₂ is inert because of its triple bond; NH₃ is a weak base; HNO₃ is made by the Ostwald process; nitrogen oxides run from N₂O to N₂O₅. Phosphorus forms PCl₃, PCl₅ and PH₃, and white phosphorus is very reactive.','Group 16: O₃ is a strong oxidising agent; SO₂ is a reducing and bleaching agent; H₂SO₄ is made by the contact process and acts as a dehydrating agent.','Group 17: oxidising power falls from F₂ to I₂. HF is a weak acid with strong hydrogen bonding. Interhalogen compounds (ClF₃, IF₇) are more reactive than the halogens.','Group 18: noble gases are inert, but xenon forms XeF₂ (linear), XeF₄ (square planar), XeF₆ (distorted octahedral) and XeO₃ (pyramidal).','The first member of each group differs from the rest because of small size, high electronegativity and no d-orbitals. Heavier members often show an oxidation state two lower (inert-pair effect).','The acid strength of oxoacids rises with the oxidation state of the central atom: HClO < HClO₂ < HClO₃ < HClO₄.'],['Learn shapes with VSEPR (XeF₄ square planar, XeF₂ linear).','The first element of each group is the odd one out.','Link acidity and oxidising power to oxidation state.']);
nn('d- & f-Block Elements',['Transition elements have partly filled d subshells. Exceptions: Cr is 3d⁵4s¹ and Cu is 3d¹⁰4s¹. Zn, Cd and Hg (d¹⁰) are not true transition elements.','Properties: variable oxidation states (3d and 4s energies are close), coloured ions (d–d transitions), paramagnetism with μ = √(n(n + 2)) BM, catalytic activity, complex and interstitial compound formation, and high melting points.','Atomic radii fall only slowly across a series because d electrons shield poorly. The 4d and 5d elements of a group are therefore nearly equal in size (lanthanoid contraction).','Mn²⁺/Mn and Zn²⁺/Zn have more negative potentials than the trend suggests, because of stable d⁵ and d¹⁰ configurations. Cu has a positive E° and does not liberate H₂ from acids.','K₂Cr₂O₇ is orange; in base it turns yellow as chromate: Cr₂O₇²⁻ + 2OH⁻ ⇌ 2CrO₄²⁻ + H₂O. In acid it is a strong oxidising agent (Cr₂O₇²⁻ to Cr³⁺, 6 electrons).','KMnO₄ is deep purple. It is reduced to Mn²⁺ in acid (5 electrons), to MnO₂ in neutral or weakly basic medium (3 electrons) and to MnO₄²⁻ in strongly basic medium (1 electron).','Lanthanoids (4f) mainly show +3 and undergo lanthanoid contraction; actinoids (5f) show a wider range of oxidation states and are radioactive.','Lanthanoid contraction makes Zr and Hf (and Nb and Ta) almost identical in size and chemistry, so they are hard to separate.'],['Link colour and magnetism to unpaired d electrons.','Remember the n-factor of KMnO₄ in each medium.','Cr and Cu are the exceptions in configuration.']);
nn('Hydrocarbons',['Alkanes undergo free-radical substitution in light (initiation, propagation, termination); H reactivity is 3° > 2° > 1°. Ethane conformations: staggered (more stable) and eclipsed.','Alkenes undergo electrophilic addition. Markovnikov’s rule: the negative part goes to the carbon with fewer hydrogens, via the more stable carbocation. With HBr and peroxides the addition is anti-Markovnikov.','Other alkene reactions: hydrogenation, bromine addition (bromine water test), ozonolysis, polymerisation, and hydroboration–oxidation (anti-Markovnikov alcohol).','Terminal alkynes are acidic: they react with sodium and with ammoniacal AgNO₃ or Cu₂Cl₂ to give metal acetylides. Hydration with HgSO₄ / H₂SO₄ gives a carbonyl compound.','Alkyne reduction: Lindlar’s catalyst gives the cis-alkene; sodium in liquid ammonia gives the trans-alkene.','Benzene is aromatic (planar, cyclic, 6 π electrons, Hückel 4n + 2) and prefers substitution to addition: halogenation, nitration (NO₂⁺ from HNO₃ / H₂SO₄), sulphonation and Friedel–Crafts alkylation and acylation with AlCl₃.','Directing effects: –OH, –NH₂, –R and halogens direct ortho/para (halogens also deactivate); –NO₂, –CN, –CHO and –COOH are deactivating and meta directing.','Geometrical isomerism (cis–trans or E/Z) occurs in alkenes. Branching lowers the boiling point of alkane isomers.'],['Decide the carbocation stability before choosing the product.','Peroxide effect works only for HBr.','Learn the directing groups as two lists.']);
nn('Compounds Containing Oxygen',['Alcohols: the Lucas test separates 1°, 2° and 3° alcohols (turbidity appears fastest for 3°). Dehydration with concentrated H₂SO₄ gives alkenes (Saytzeff product) through a carbocation.','Phenols are more acidic than alcohols because the phenoxide ion is resonance stabilised; –NO₂ groups raise the acidity further. Phenol undergoes ring substitution (bromine water gives 2,4,6-tribromophenol) and the Kolbe and Reimer–Tiemann reactions.','Ethers: the Williamson synthesis (alkoxide + primary alkyl halide, SN2) makes them; HI cleaves them.','Aldehydes and ketones undergo nucleophilic addition at the carbonyl carbon; aldehydes are more reactive. Tollens’ and Fehling’s tests detect aldehydes; the iodoform test detects CH₃CO– and CH₃CH(OH)– groups.','Aldol condensation needs an α-hydrogen. The Cannizzaro reaction (disproportionation in strong base) is given by aldehydes with no α-hydrogen, such as HCHO. Wolff–Kishner and Clemmensen reductions turn C=O into CH₂.','LiAlH₄ and NaBH₄ reduce carbonyls to alcohols. Oxidation of a 1° alcohol gives an aldehyde (with PCC) or an acid; a 2° alcohol gives a ketone.','Carboxylic acids: –I groups near –COOH increase acidity, formic acid is stronger than acetic acid, and carboxylic acids are more acidic than phenols and alcohols. The Hell–Volhard–Zelinsky reaction gives α-halo acids.','Esterification (acid + alcohol with H⁺) is reversible. Reactivity of acid derivatives: acid chloride > anhydride > ester > amide.'],['Name the reaction first, then the mechanism.','Check for α-hydrogens before aldol or Cannizzaro.','Acidity follows the stability of the conjugate base.']);
const NM={"Trigonometry": ["Identities: sin²θ + cos²θ = 1, 1 + tan²θ = sec²θ and 1 + cot²θ = cosec²θ. Signs follow ASTC: All, Sine, Tan, Cos are positive in quadrants I to IV.", "Compound angles: sin(A ± B) = sinA cosB ± cosA sinB and cos(A ± B) = cosA cosB ∓ sinA sinB. Double angle: sin2A = 2 sinA cosA and cos2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A.", "The maximum and minimum of a sinx + b cosx are +√(a² + b²) and −√(a² + b²). Use this to find ranges quickly.", "Sum to product: sinC + sinD = 2 sin((C + D)/2) cos((C − D)/2). Product to sum: 2 sinA cosB = sin(A + B) + sin(A − B).", "General solutions: sinx = sinα gives x = nπ + (−1)ⁿα; cosx = cosα gives x = 2nπ ± α; tanx = tanα gives x = nπ + α.", "Principal value ranges: sin⁻¹ is in [−π/2, π/2], cos⁻¹ is in [0, π], tan⁻¹ is in (−π/2, π/2). Also sin⁻¹x + cos⁻¹x = π/2 and tan⁻¹x + cot⁻¹x = π/2.", "tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy)) when xy < 1. If xy > 1 and x, y > 0, add π to the result.", "Triangle ABC (also JEE Advanced): sine rule a/sinA = b/sinB = c/sinC = 2R, and cosine rule a² = b² + c² − 2bc cosA."], "Coordinate Geometry": ["Distance between two points is √((x₂ − x₁)² + (y₂ − y₁)²). The internal section formula for the ratio m : n is ((mx₂ + nx₁)/(m + n), (my₂ + ny₁)/(m + n)).", "Slope m = tanθ = (y₂ − y₁)/(x₂ − x₁). Parallel lines have equal slopes and perpendicular lines have m₁m₂ = −1.", "Line forms: y = mx + c, y − y₁ = m(x − x₁) and x/a + y/b = 1. The angle between two lines is given by tanθ = |(m₁ − m₂)/(1 + m₁m₂)|.", "Distance of (x₁, y₁) from ax + by + c = 0 is |ax₁ + by₁ + c| / √(a² + b²). Distance between parallel lines is |c₁ − c₂| / √(a² + b²).", "Circle: (x − h)² + (y − k)² = r². The general form x² + y² + 2gx + 2fy + c = 0 has centre (−g, −f) and radius √(g² + f² − c).", "Length of the tangent from an outside point is √S₁. The line y = mx + c touches x² + y² = r² when c² = r²(1 + m²).", "Parabola y² = 4ax has focus (a, 0), directrix x = −a and e = 1. Ellipse x²/a² + y²/b² = 1 (a > b) has e = √(1 − b²/a²). Hyperbola x²/a² − y²/b² = 1 has e = √(1 + b²/a²).", "Tangent conditions for y = mx + c: parabola y² = 4ax needs c = a/m; ellipse needs c² = a²m² + b²; hyperbola needs c² = a²m² − b²."], "Vectors & 3D Geometry": ["The position vector of (x, y, z) is xi + yj + zk. Its magnitude is |a| = √(x² + y² + z²) and the unit vector is â = a / |a|.", "Dot product a·b = |a||b|cosθ = a₁b₁ + a₂b₂ + a₃b₃. It is zero for perpendicular vectors. The projection of a on b is (a·b) / |b|.", "Cross product has magnitude |a||b|sinθ, with direction by the right-hand rule. a × b = 0 when the vectors are parallel. Area of a parallelogram = |a × b| and of a triangle = ½|a × b|.", "Scalar triple product [a b c] = a·(b × c) is the volume of the parallelepiped. Three vectors are coplanar when [a b c] = 0.", "Direction cosines l, m, n satisfy l² + m² + n² = 1. Direction ratios are any numbers proportional to l, m, n.", "Line through the point a with direction b: r = a + λb. Cartesian form: (x − x₁)/a = (y − y₁)/b = (z − z₁)/c.", "Plane: ax + by + cz + d = 0 has normal vector (a, b, c). The distance of (x₁, y₁, z₁) from it is |ax₁ + by₁ + cz₁ + d| / √(a² + b² + c²).", "Angle between two lines uses the dot product of their directions, and between two planes uses their normals. Shortest distance between skew lines is |(a₂ − a₁)·(b₁ × b₂)| / |b₁ × b₂|."], "Permutations, Combinations & Binomial": ["Fundamental principle: if a job splits into stages done one after another, multiply the number of ways (and). If the jobs are alternatives, add them (or).", "ⁿPᵣ = n! / (n − r)! counts arrangements and ⁿCᵣ = n! / (r!(n − r)!) counts selections. Also ⁿPᵣ = r! × ⁿCᵣ.", "Arrangements of n objects with repeats: n! / (p! q! r!). Circular arrangements of n distinct objects: (n − 1)!.", "ⁿCᵣ = ⁿCₙ₋ᵣ and ⁿCᵣ + ⁿCᵣ₋₁ = ⁿ⁺¹Cᵣ. When dividing into equal groups, divide by the factorial of the number of groups.", "Binomial theorem: (x + y)ⁿ = Σ ⁿCᵣ xⁿ⁻ʳ yʳ. The general term is Tᵣ₊₁ = ⁿCᵣ xⁿ⁻ʳ yʳ and there are n + 1 terms.", "Middle term: if n is even it is T₍ₙ/₂₎₊₁. If n is odd there are two middle terms, T₍ₙ₊₁₎/₂ and T₍ₙ₊₃₎/₂.", "Put x = 1 to get the sum of coefficients. ⁿC₀ + ⁿC₁ + … + ⁿCₙ = 2ⁿ, and the even-place and odd-place coefficient sums are each 2ⁿ⁻¹.", "The greatest binomial coefficient is ⁿCₙ/₂ when n is even. Powers like 9ⁿ or 7ⁿ − 1 can be handled by binomial expansion to find remainders and divisibility."], "Sets, Relations & Functions": ["For finite sets, n(A ∪ B) = n(A) + n(B) − n(A ∩ B). For three sets, add n(A ∩ B ∩ C) at the end of the three-set formula. A set with n elements has 2ⁿ subsets.", "De Morgan's laws: (A ∪ B)′ = A′ ∩ B′ and (A ∩ B)′ = A′ ∪ B′.", "A relation R on A is reflexive if (a, a) ∈ R for all a, symmetric if (a, b) ∈ R gives (b, a) ∈ R, and transitive if (a, b) and (b, c) in R give (a, c) ∈ R.", "An equivalence relation is reflexive, symmetric and transitive. It splits the set into disjoint equivalence classes.", "If n(A) = m and n(B) = n, the number of relations from A to B is 2^(mn) and the number of functions is nᵐ.", "A function f: A → B is one-one if f(x₁) = f(x₂) implies x₁ = x₂. It is onto if every element of B has a pre-image, that is, range = codomain.", "For finite sets, one-one functions number ⁿPₘ (n ≥ m). A bijection needs m = n and there are n! of them.", "Composition (f∘g)(x) = f(g(x)) is generally not commutative. An inverse exists only if f is one-one and onto, and then f(f⁻¹(x)) = x."], "Differential Equations": ["Order is the highest derivative present. Degree is the power of that highest derivative once the equation is a polynomial in its derivatives.", "A general solution has as many arbitrary constants as the order. A particular solution has those constants fixed using initial conditions.", "Variable separable: dy/dx = f(x)g(y) becomes ∫ dy/g(y) = ∫ f(x) dx + C.", "Homogeneous: dy/dx = f(y/x). Put y = vx so that dy/dx = v + x dv/dx, then separate the variables.", "Linear first order: dy/dx + Py = Q. The integrating factor is IF = e^(∫P dx) and the solution is y·IF = ∫ Q·IF dx + C.", "If the equation is linear in x, dx/dy + Px = Q, use IF = e^(∫P dy).", "To form a differential equation from a family of curves with n arbitrary constants, differentiate n times and eliminate the constants.", "Check your answer by differentiating it and substituting back into the original equation."], "Statistics": ["Mean x̄ = Σxᵢ / n. For a frequency table, x̄ = Σfᵢxᵢ / Σfᵢ. The median is the middle value of ordered data and the mode is the most frequent value.", "Mean deviation about a point a is Σ|xᵢ − a| / n. It is smallest when a is the median.", "Variance σ² = Σ(xᵢ − x̄)² / n = Σxᵢ²/n − (x̄)². Standard deviation σ = √variance.", "If every observation is multiplied by k and shifted by c, the mean becomes k·x̄ + c, the variance becomes k²σ² and the standard deviation becomes |k|σ.", "For grouped data, use class marks as xᵢ and replace sums by sums weighted with the frequencies fᵢ.", "Coefficient of variation = (σ / x̄) × 100. A smaller value means the data is more consistent.", "For the first n natural numbers, the mean is (n + 1)/2 and the variance is (n² − 1)/12.", "Combined mean of two groups = (n₁x̄₁ + n₂x̄₂) / (n₁ + n₂). Combined variance = [n₁(σ₁² + d₁²) + n₂(σ₂² + d₂²)] / (n₁ + n₂), where d is each group mean minus the combined mean."]};
CHAPS.forEach(c=>{if(NM[c.t]&&!c.n.length)c.n=NM[c.t]});
nn("Compounds Containing Halogens",["Haloalkanes have the halogen on an sp³ carbon and haloarenes on an sp² carbon. The C–X bond is polar. Bond strength falls in the order C–F > C–Cl > C–Br > C–I, so reactivity in substitution rises from F to I.", "SN2 is a one-step reaction with rate = k[RX][Nu]. The nucleophile attacks from the back, giving inversion of configuration (Walden inversion). Reactivity: methyl > 1° > 2°, and 3° halides do not react by SN2.", "SN1 is a two-step reaction through a carbocation, with rate = k[RX], and it gives racemisation. Reactivity: 3° > 2° > 1°. Polar protic solvents favour SN1 and polar aprotic solvents favour SN2.", "Elimination (E1 or E2) competes with substitution. Strong, bulky bases and heat favour elimination, and the more substituted alkene is the major product (Saytzeff rule).", "Haloarenes are less reactive towards nucleophilic substitution because the C–X bond has partial double-bond character through resonance. Electron-withdrawing groups at the ortho or para positions make substitution easier.", "In electrophilic substitution, a halogen on the ring is deactivating but directs the incoming group to the ortho and para positions.", "Preparation: R–OH + SOCl₂ gives R–Cl cleanly and is the best method. Finkelstein reaction: R–Cl + NaI in dry acetone gives R–I. Swarts reaction: R–Cl + AgF gives R–F.", "Chloroform slowly oxidises in air and light to poisonous phosgene, so it is stored in full dark bottles. Iodoform is an antiseptic, freons deplete the ozone layer and DDT is non-biodegradable."],["SN1 gives racemisation and SN2 gives inversion of configuration.", "Carbocation stability decides SN1; steric hindrance decides SN2.", "Chloroform is stored in dark, filled bottles to prevent phosgene formation."]);
nn("Compounds Containing Nitrogen",["Amines are 1° (RNH₂), 2° (R₂NH) or 3° (R₃N). Nitrogen is sp³ hybridised with a lone pair, so amines are pyramidal and act as bases and nucleophiles.", "Preparation: reduction of nitro compounds (Sn/HCl or H₂/Pd), reduction of nitriles (LiAlH₄), ammonolysis of alkyl halides (a mixture of amines) and Hofmann bromamide degradation (RCONH₂ + Br₂ + 4NaOH gives RNH₂, with one carbon less).", "Gabriel phthalimide synthesis gives pure primary aliphatic amines only. It does not work for aromatic amines.", "Basicity of ethyl amines in water: (C₂H₅)₂NH > (C₂H₅)₃N > C₂H₅NH₂ > NH₃, because of inductive effect and solvation. Aniline is a weaker base than ammonia as its lone pair is delocalised into the ring.", "Hinsberg's test uses benzenesulphonyl chloride: 1° amines give a product soluble in alkali, 2° amines give an insoluble product and 3° amines do not react. The carbylamine test (CHCl₃ + KOH, foul smell) is given only by primary amines.", "Nitrous acid converts aliphatic 1° amines into alcohols with N₂ gas, but aromatic 1° amines form diazonium salts at 0–5 °C.", "Aniline brominates easily (white precipitate of 2,4,6-tribromoaniline with bromine water). Protect the –NH₂ by acetylation to control the reaction. Direct nitration also gives some meta product because the anilinium ion forms in acid.", "Benzenediazonium chloride: Sandmeyer reaction (CuCl, CuBr, CuCN) replaces N₂⁺ by Cl, Br or CN. Coupling with phenol or aniline gives coloured azo dyes at the para position."],["Only primary amines give the carbylamine test.", "Hofmann bromamide degradation loses one carbon atom.", "Diazotisation must be done at 0–5 °C."]);
nn("Biomolecules",["Carbohydrates are polyhydroxy aldehydes or ketones. Glucose is an aldohexose (C₆H₁₂O₆) and fructose is a ketohexose. Glucose is dextrorotatory and mainly exists in a cyclic (pyranose) hemiacetal form.", "α and β anomers differ only at carbon 1 (the anomeric carbon). α-D-glucose has [α] = +111°, β-D-glucose has +19.2° and the equilibrium mixture has +52.5° (mutarotation).", "Sucrose (glucose + fructose, linked through both anomeric carbons) is a non-reducing sugar. Maltose (glucose + glucose) and lactose (glucose + galactose) are reducing sugars. Hydrolysis of sucrose gives invert sugar.", "Starch has amylose (linear, α-1,4 links) and amylopectin (branched, α-1,4 and α-1,6 links). Cellulose is a β-1,4 polymer of glucose. Glycogen is the branched storage form in animals.", "Amino acids exist as zwitterions. At the isoelectric point the net charge is zero and solubility is lowest. Proteins are made from 20 standard α-amino acids, and essential ones must come from the diet.", "A peptide bond (–CO–NH–) joins the –COOH of one amino acid to the –NH₂ of the next. Protein structure: primary is the sequence, secondary is the α-helix or β-sheet held by hydrogen bonds, tertiary is the folding and quaternary is the arrangement of subunits.", "Denaturation destroys the secondary and tertiary structure (for example boiling an egg) but the primary structure stays intact. Vitamins A, D, E and K are fat soluble; B-complex and C are water soluble.", "DNA has deoxyribose and the bases A, T, G, C in a double helix (A–T with two hydrogen bonds, G–C with three). RNA has ribose and uracil in place of thymine, and is usually single stranded."],["Sucrose is non-reducing because both anomeric carbons are used in the glycosidic bond.", "DNA contains thymine; RNA contains uracil.", "Denaturation changes the shape but does not break peptide bonds."]);
const KR={"p-Block Elements": ["Borax bead test | Na₂B₄O₇ → 2NaBO₂ + B₂O₃ | Glassy bead gives coloured beads with metal salts", "Boric acid in water | B(OH)₃ + H₂O → [B(OH)₄]⁻ + H⁺ | Lewis acid, weak monobasic acid", "Diborane preparation | 4BF₃ + 3LiAlH₄ → 2B₂H₆ + 3LiF + 3AlF₃ | In dry ether", "Water gas | C + H₂O → CO + H₂ | Steam passed over red-hot coke", "Silicones | 2CH₃Cl + Si → (CH₃)₂SiCl₂ | Cu catalyst, about 570 K; hydrolysis then gives silicones", "Haber process | N₂ + 3H₂ ⇌ 2NH₃ | About 200 atm, 700 K, Fe catalyst with Mo promoter", "Ostwald process (step 1) | 4NH₃ + 5O₂ → 4NO + 6H₂O | Pt–Rh gauze, 500 K, 9 bar", "Ostwald process (step 2) | 3NO₂ + H₂O → 2HNO₃ + NO | NO is recycled", "Hydrolysis of PCl₃ | PCl₃ + 3H₂O → H₃PO₃ + 3HCl | Gives phosphorous acid", "Heating PCl₅ | PCl₅ ⇌ PCl₃ + Cl₂ | Dissociates on heating", "Contact process | 2SO₂ + O₂ ⇌ 2SO₃ | V₂O₅ catalyst, 2 bar, 720 K; SO₃ is absorbed in H₂SO₄ to give oleum", "Deacon process | 4HCl + O₂ → 2Cl₂ + 2H₂O | CuCl₂ catalyst, about 720 K", "Cl₂ with cold NaOH | Cl₂ + 2NaOH → NaCl + NaOCl + H₂O | Cold, dilute NaOH", "Cl₂ with hot NaOH | 3Cl₂ + 6NaOH → 5NaCl + NaClO₃ + 3H₂O | Hot, concentrated NaOH", "Xenon tetrafluoride | Xe + 2F₂ → XeF₄ | 873 K, 7 bar; square planar product", "Hydrolysis of XeF₆ | XeF₆ + 3H₂O → XeO₃ + 6HF | XeO₃ is explosive"], "d- & f-Block Elements": ["K₂Cr₂O₇ step 1 | 4FeCr₂O₄ + 8Na₂CO₃ + 7O₂ → 8Na₂CrO₄ + 2Fe₂O₃ + 8CO₂ | Chromite ore fused with Na₂CO₃ in air", "K₂Cr₂O₇ step 2 | 2Na₂CrO₄ + 2H⁺ → Na₂Cr₂O₇ + 2Na⁺ + H₂O | Acidify with H₂SO₄", "K₂Cr₂O₇ step 3 | Na₂Cr₂O₇ + 2KCl → K₂Cr₂O₇ + 2NaCl | Less soluble K₂Cr₂O₇ crystallises out", "Chromate and dichromate | 2CrO₄²⁻ + 2H⁺ ⇌ Cr₂O₇²⁻ + H₂O | Yellow in base, orange in acid", "Dichromate as oxidant | Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O | Orange turns green", "Dichromate with Fe²⁺ | Cr₂O₇²⁻ + 6Fe²⁺ + 14H⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O | Used in titrations", "K₂MnO₄ preparation | 2MnO₂ + 4KOH + O₂ → 2K₂MnO₄ + 2H₂O | Fuse pyrolusite with KOH in air", "Manganate to permanganate | 3MnO₄²⁻ + 4H⁺ → 2MnO₄⁻ + MnO₂ + 2H₂O | Disproportionation in acid", "KMnO₄ in acid | MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O | Purple turns colourless", "KMnO₄ with Fe²⁺ | MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O | Self-indicator in titration", "KMnO₄ with oxalate | 2MnO₄⁻ + 5C₂O₄²⁻ + 16H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O | Warm to about 330 K", "KMnO₄ in neutral medium | MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻ | Brown precipitate of MnO₂", "KMnO₄ in strong alkali | MnO₄⁻ + e⁻ → MnO₄²⁻ | Green manganate ion", "Lanthanoid contraction | Ionic radius falls from La³⁺ to Lu³⁺ | Poor shielding by 4f electrons", "Lanthanoid oxidation states | Common Ln³⁺; also Ce⁴⁺ and Eu²⁺ | Ce⁴⁺ is a strong oxidant"], "Hydrocarbons": ["Wurtz reaction | 2CH₃Br + 2Na → CH₃CH₃ + 2NaBr | Dry ether; doubles the carbon chain", "Kolbe electrolysis | 2CH₃COONa + 2H₂O → C₂H₆ + 2CO₂ + H₂ + 2NaOH | Electrolysis of the sodium salt", "Decarboxylation | CH₃COONa + NaOH → CH₄ + Na₂CO₃ | Soda lime, heat; one carbon less", "Dehydration of ethanol | C₂H₅OH → CH₂=CH₂ + H₂O | Conc. H₂SO₄ at 443 K", "Dehydrohalogenation | CH₃CH₂Br + KOH → CH₂=CH₂ + KBr + H₂O | Alcoholic KOH, heat", "Markovnikov addition | CH₃CH=CH₂ + HBr → CH₃CHBrCH₃ | Br goes to the more substituted carbon", "Anti-Markovnikov addition | CH₃CH=CH₂ + HBr → CH₃CH₂CH₂Br | Peroxide effect, HBr only", "Ozonolysis | RCH=CHR + O₃ → 2RCHO | Then Zn and water", "Baeyer’s test | 3CH₂=CH₂ + 2KMnO₄ + 4H₂O → 3HOCH₂CH₂OH + 2MnO₂ + 2KOH | Pink colour fades; tests unsaturation", "Acetylene from carbide | CaC₂ + 2H₂O → C₂H₂ + Ca(OH)₂ | Laboratory preparation", "Hydration of ethyne | C₂H₂ + H₂O → CH₃CHO | HgSO₄ and dilute H₂SO₄ at 333 K", "Acidic hydrogen of ethyne | HC≡CH + NaNH₂ → HC≡CNa + NH₃ | Terminal alkynes also form silver and copper acetylides", "Partial hydrogenation | RC≡CR + H₂ → cis-alkene | Lindlar’s catalyst; Na in liquid NH₃ gives trans", "Trimerisation of ethyne | 3C₂H₂ → C₆H₆ | Red-hot iron tube, 873 K", "Nitration of benzene | C₆H₆ + HNO₃ → C₆H₅NO₂ + H₂O | Conc. H₂SO₄, below 333 K", "Friedel–Crafts alkylation | C₆H₆ + CH₃Cl → C₆H₅CH₃ + HCl | Anhydrous AlCl₃"], "Compounds Containing Oxygen": ["Lucas test | ROH + HCl → RCl + H₂O | ZnCl₂; 3° turbid at once, 2° in about 5 min, 1° only on heating", "Oxidation of 1° alcohol | RCH₂OH → RCHO → RCOOH | PCC stops at the aldehyde; KMnO₄ goes to the acid", "Reimer–Tiemann reaction | C₆H₅OH + CHCl₃ + NaOH → salicylaldehyde | Adds –CHO at the ortho position", "Kolbe’s reaction | C₆H₅ONa + CO₂ → salicylic acid | 400 K, 4 to 7 atm, then H⁺", "Williamson synthesis | RONa + R′X → ROR′ + NaX | Use a primary alkyl halide", "Ether from alcohol | 2C₂H₅OH → C₂H₅OC₂H₅ + H₂O | Conc. H₂SO₄, 413 K, excess alcohol", "Rosenmund reduction | RCOCl + H₂ → RCHO + HCl | Pd on BaSO₄", "Stephen reaction | RCN + SnCl₂ + HCl → RCH=NH → RCHO | Then H₃O⁺", "Etard reaction | C₆H₅CH₃ + CrO₂Cl₂ → C₆H₅CHO | Then H₃O⁺", "Cannizzaro reaction | 2HCHO + NaOH → CH₃OH + HCOONa | Aldehyde with no α-hydrogen", "Aldol condensation | 2CH₃CHO → CH₃CH(OH)CH₂CHO | Dilute NaOH; heating gives but-2-enal", "Haloform reaction | CH₃COR + 3I₂ + 4NaOH → CHI₃ + RCOONa + 3NaI + 3H₂O | Yellow precipitate of iodoform", "Clemmensen reduction | R₂C=O → R₂CH₂ | Zn–Hg and conc. HCl", "Wolff–Kishner reduction | R₂C=O → R₂CH₂ | NH₂NH₂, then KOH in ethylene glycol", "Hell–Volhard–Zelinsky | RCH₂COOH + X₂ → RCHXCOOH | Red phosphorus; α-halogenation", "Esterification | RCOOH + R′OH ⇌ RCOOR′ + H₂O | Conc. H₂SO₄ catalyst"], "Compounds Containing Halogens": ["Alcohol with SOCl₂ | ROH + SOCl₂ → RCl + SO₂ + HCl | Gaseous by-products, cleanest method", "Free radical halogenation | CH₄ + Cl₂ → CH₃Cl + HCl | UV light; mixture of products", "Addition of HX | CH₂=CH₂ + HBr → CH₃CH₂Br | Markovnikov for unsymmetrical alkenes", "Finkelstein reaction | RCl + NaI → RI + NaCl | Dry acetone", "Swarts reaction | RCl + AgF → RF + AgCl | Hg₂F₂ or SbF₃ also work", "Sandmeyer reaction | ArN₂⁺Cl⁻ + CuCl → ArCl + N₂ | CuBr gives ArBr", " ₆H₅N₂⁺Cl⁻ + H₃PO₂ + H₂O → C₆H₆ + N₂ + H₃PO₃ + HCl | Hypophosphorous acid", "Coupling with phenol | C₆H₅N₂⁺Cl⁻ + C₆H₅OH → p-HOC₆H₄N=NC₆H₅ | Azo dye; mildly alkaline medium", "Coupling with aniline | C₆H₅N₂⁺Cl⁻ + C₆H₅NH₂ → p-H₂NC₆H₄N=NC₆H₅ | Slightly acidic medium", "Bromination of aniline | C₆H₅NH₂ + 3Br₂ → 2,4,6-Br₃C₆H₂NH₂ + 3HBr | White precipitate with bromine water"], "Biomolecules": ["Glucose with HI | C₆H₁₂O₆ + HI (excess, heat) → n-hexane | Shows an unbranched six-carbon chain", "Glucose with HCN | Glucose + HCN → cyanohydrin | Shows a carbonyl group", "Glucose with NH₂OH | Glucose + NH₂OH → oxime | Confirms the carbonyl group", "Glucose with bromine water | Glucose + Br₂/H₂O → gluconic acid | Shows an aldehyde group", "Glucose with HNO₃ | Glucose + HNO₃ → saccharic acid | Both ends oxidised to –COOH", "Glucose with acetic anhydride | Glucose + (CH₃CO)₂O → penta-acetate | Shows five –OH groups", "Tollens’ test | Glucose + [Ag(NH₃)₂]⁺ → gluconic acid + Ag | Silver mirror; reducing sugar", "Fehling’s test | RCHO + 2Cu²⁺ + 5OH⁻ → RCOO⁻ + Cu₂O + 3H₂O | Red precipitate", "Hydrolysis of sucrose | C₁₂H₂₂O₁₁ + H₂O → glucose + fructose | Dilute acid; gives invert sugar", "Hydrolysis of maltose | Maltose + H₂O → 2 glucose | Enzyme maltase", "Hydrolysis of lactose | Lactose + H₂O → glucose + galactose | Enzyme lactase", "Hydrolysis of starch | (C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆ | Dilute acid or amylase", "Peptide bond formation | H₂N–CHR–COOH + H₂N–CHR′–COOH → dipeptide + H₂O | Forms the –CO–NH– link", "Zwitterion | H₃N⁺–CHR–COO⁻ | Dipolar ion of an amino acid", "Ninhydrin test | α-amino acid + ninhydrin → purple colour | Detects amino acids and proteins", "Biuret test | Protein + CuSO₄ + NaOH → violet colour | Detects peptide bonds"]};

const SYD={main:{physics:[['Units & Measurement','SI and fundamental/derived units, least count, significant figures, errors in measurement, dimensions of physical quantities, dimensional analysis and its applications.'],['Kinematics','Frame of reference; motion in a straight line (position–time and velocity–time graphs, uniformly accelerated motion); relative velocity; motion in a plane, projectile motion; uniform circular motion.'],['Laws of Motion','Inertia and Newton’s three laws; momentum and impulse; conservation of linear momentum; equilibrium of concurrent forces; static, kinetic and rolling friction; centripetal force (level and banked roads).'],['Work, Energy & Power','Work by constant and variable forces; kinetic and potential energy; work–energy theorem; power; spring energy; conservation of mechanical energy; conservative and non-conservative forces; vertical circular motion; elastic and inelastic collisions in 1D and 2D.'],['Rotational Motion','Centre of mass (two particles, rigid body); torque; angular momentum and its conservation; moment of inertia, radius of gyration, parallel and perpendicular axes; equilibrium of rigid bodies; equations of rotation compared with linear motion.'],['Gravitation','Universal law of gravitation; g and its variation with altitude and depth; Kepler’s laws; gravitational potential and potential energy; escape velocity; satellites (orbital velocity, period, energy).'],['Properties of Solids & Liquids','Elasticity (stress–strain, Hooke’s law, Young’s, bulk and rigidity moduli); fluid pressure, Pascal’s law; viscosity, Stokes’ law, terminal velocity; streamline and turbulent flow; Bernoulli’s principle; surface tension, angle of contact, capillary rise; heat, temperature, thermal expansion, specific heat, calorimetry, latent heat; conduction, convection, radiation.'],['Thermodynamics','Thermal equilibrium, zeroth law, temperature; heat, work and internal energy; first law; isothermal and adiabatic processes; second law; reversible and irreversible processes.'],['Kinetic Theory of Gases','Equation of state of a perfect gas; work done in compressing a gas; assumptions of kinetic theory, pressure; kinetic meaning of temperature, rms speed; degrees of freedom, equipartition of energy, specific heats of gases; mean free path; Avogadro’s number.'],['Oscillations & Waves','Periodic motion, period, frequency; SHM and its equation, phase; spring oscillations; energy in SHM; simple pendulum; wave motion (longitudinal, transverse, speed); progressive wave; superposition and reflection; standing waves in strings and organ pipes; beats.'],['Electrostatics','Conservation of charge; Coulomb’s law and superposition; electric field and field lines; dipole, its field and torque; flux and Gauss’s law (line, infinite sheet, thin spherical shell); potential, potential difference, equipotential surfaces; energy of charges and dipoles; conductors and insulators; dielectrics and polarisation; capacitors, series and parallel combinations, parallel-plate capacitor with and without dielectric, stored energy.'],['Current Electricity','Electric current, drift velocity, mobility; Ohm’s law, resistance, V–I characteristics (ohmic and non-ohmic); electrical energy and power; resistivity and conductivity; series and parallel resistors; temperature dependence of resistance; emf, internal resistance, cells in series and parallel; Kirchhoff’s laws; Wheatstone bridge, metre bridge.'],['Magnetic Effects of Current & Magnetism','Biot–Savart law (circular loop); Ampère’s law (straight wire, solenoid); force on a moving charge in magnetic and electric fields; force on a current-carrying conductor; force between parallel currents and the ampere; torque on a loop, moving-coil galvanometer, ammeter and voltmeter; current loop as a dipole; bar magnet as a solenoid, field on its axis and equator; torque on a magnetic dipole; para-, dia- and ferromagnetism, effect of temperature.'],['EMI & Alternating Current','Faraday’s law; induced emf and current, Lenz’s law, eddy currents; self and mutual inductance; alternating current, peak and rms values; reactance and impedance; LCR series circuit, resonance; power in AC circuits, wattless current; AC generator and transformer.'],['Electromagnetic Waves','Displacement current; characteristics and transverse nature of EM waves; electromagnetic spectrum (radio waves to gamma rays); applications.'],['Optics','Reflection, spherical mirrors, mirror formula; refraction at plane and spherical surfaces, thin lens and lens maker’s formulae; total internal reflection; magnification and power; lenses in contact; prism; microscope and telescope. Wave optics: Huygens’ principle, laws of reflection and refraction, interference and Young’s double slit, fringe width, coherent sources; single-slit diffraction, width of central maximum; polarisation, Brewster’s law, Polaroid.'],['Dual Nature of Matter & Radiation','Dual nature of radiation; photoelectric effect, Hertz and Lenard’s observations; Einstein’s photoelectric equation; matter waves, de Broglie relation.'],['Atoms & Nuclei','Alpha-particle scattering, Rutherford model; Bohr model, energy levels, hydrogen spectrum; composition and size of nucleus, atomic masses; mass–energy relation, mass defect; binding energy per nucleon and its variation; nuclear fission and fusion.'],['Electronic Devices','Semiconductors; diode I–V characteristics in forward and reverse bias; diode as a rectifier; LED, photodiode, solar cell and Zener diode (as voltage regulator); logic gates (OR, AND, NOT, NAND, NOR).'],['Experimental Skills','Vernier calipers; screw gauge; simple pendulum; metre scale (principle of moments); Young’s modulus of a wire; surface tension by capillary rise; viscosity by terminal velocity; speed of sound with a resonance tube; specific heat by mixtures; resistivity with a metre bridge; Ohm’s law; galvanometer resistance and figure of merit; focal lengths of mirrors and lens; prism deviation graph; refractive index of a glass slab; diode and Zener characteristics; identifying components.']],
chemistry:[['Some Basic Concepts in Chemistry','Matter and its nature; Dalton’s atomic theory; atom, molecule, element, compound; laws of chemical combination; atomic and molecular masses; mole concept, molar mass; percentage composition, empirical and molecular formulae; chemical equations and stoichiometry.'],['Atomic Structure','Electromagnetic radiation, photoelectric effect; hydrogen spectrum; Bohr model (postulates, energy and radii, limitations); dual nature of matter, de Broglie; Heisenberg uncertainty principle; quantum mechanical model; atomic orbitals, quantum numbers, shapes of s, p and d orbitals; electron spin; Aufbau, Pauli and Hund rules; electronic configurations and extra stability of half-filled and filled subshells.'],['Chemical Bonding & Molecular Structure','Kossel–Lewis approach; ionic bonding, lattice enthalpy; covalent bonding, electronegativity, Fajans’ rule, dipole moment; VSEPR and shapes; valence bond theory and hybridisation (s, p, d); resonance; molecular orbital theory (LCAO, bonding and antibonding, sigma and pi, homonuclear diatomics, bond order, length and energy); metallic bonding; hydrogen bonding.'],['Chemical Thermodynamics','System and surroundings, extensive and intensive properties, state functions, entropy; first law (work, heat, internal energy, enthalpy, heat capacities); Hess’s law; enthalpies of bond dissociation, combustion, formation, atomisation, sublimation, phase transition, hydration, ionisation and solution; second law, spontaneity, ΔS(universe) and ΔG(system); standard Gibbs energy change and equilibrium constant.'],['Redox Reactions & Electrochemistry','Oxidation and reduction, oxidation numbers and rules, balancing redox reactions; electrolytic and metallic conduction, conductance, molar conductivity and its variation, Kohlrausch’s law; electrolytic and galvanic cells, electrodes, standard electrode potential, half-cell and cell reactions, emf and its measurement; Nernst equation; cell potential and Gibbs energy; dry cell, lead accumulator, fuel cells.'],['Chemical Kinetics','Rate of reaction and factors affecting it (concentration, temperature, pressure, catalyst); elementary and complex reactions; order and molecularity; rate law and rate constant with units; integrated and differential forms for zero and first order, half-lives; effect of temperature, Arrhenius theory, activation energy; collision theory of bimolecular gaseous reactions (no derivation).'],['Solutions','Ways of expressing concentration (molality, molarity, mole fraction, percentage); vapour pressure and Raoult’s law, ideal and non-ideal solutions; colligative properties (relative lowering of vapour pressure, freezing point depression, boiling point elevation, osmotic pressure); molecular mass from colligative properties; abnormal molar mass and van’t Hoff factor.'],['Equilibrium','Physical equilibria (solid–liquid, liquid–gas, solid–gas), Henry’s law; chemical equilibrium, Kp and Kc, factors affecting equilibrium, catalyst; Le Chatelier’s principle. Ionic equilibrium: strong and weak electrolytes, acid–base concepts (Arrhenius, Brønsted–Lowry, Lewis), ionisation constants and multistage ionisation, ionisation of water, pH, common ion effect, salt hydrolysis, solubility product, buffer solutions.'],['Periodic Classification & Periodicity','Modern periodic law and the present periodic table; s, p, d and f blocks; trends in atomic and ionic radii, ionisation enthalpy, electron gain enthalpy, valence, oxidation states and chemical reactivity.'],['p-Block Elements','Groups 13 to 18: electronic configuration and general trends in physical and chemical properties across periods and down groups; unique behaviour of the first element of each group; important compounds and their properties and uses for each group.'],['d- and f-Block Elements','Transition elements: electronic configuration, general characteristics (variable oxidation states, colour, magnetic behaviour, catalytic activity, complex formation, interstitial compounds); preparation and properties of K₂Cr₂O₇ and KMnO₄; inner transition elements: lanthanoid contraction, oxidation states.'],['Coordination Compounds','Werner’s theory; ligands, coordination number, denticity, chelation; IUPAC nomenclature; isomerism (structural and stereo); bonding by valence bond theory and crystal field theory (octahedral and tetrahedral), colour and magnetic properties; importance in analysis, extraction of metals and biological systems.'],['Purification & Characterisation of Organic Compounds','Crystallisation, sublimation, distillation, differential extraction, chromatography; qualitative detection of N, S, P and halogens; quantitative estimation (principles) of C, H, N, halogens, S and P; empirical and molecular formula calculations.'],['Some Basic Principles of Organic Chemistry','Tetravalency of carbon; shapes of simple molecules and hybridisation; classification by functional groups; IUPAC nomenclature; isomerism (structural and stereo); inductive effect, resonance, hyperconjugation; electrophiles and nucleophiles; free radicals, carbocations and carbanions; homolytic and heterolytic fission; types of organic reactions.'],['Hydrocarbons','Classification, isomerism, nomenclature, preparation and reactions. Alkanes: conformations (Sawhorse and Newman, ethane), halogenation mechanism. Alkenes: geometrical isomerism, electrophilic addition, Markovnikov and peroxide effect, ozonolysis, polymerisation. Alkynes: acidic character, additions, polymerisation. Aromatic hydrocarbons: benzene structure and aromaticity, electrophilic substitution (halogenation, nitration, Friedel–Crafts), directive influence of substituents.'],['Compounds Containing Halogens','Haloalkanes and haloarenes: types, nature of the C–X bond; SN1 and SN2 mechanisms and stereochemistry; directive influence of halogens in electrophilic substitution; uses and environmental effects of chloroform, iodoform, freons and DDT.'],['Compounds Containing Oxygen','Alcohols, phenols and ethers: preparation, properties, identification of 1°, 2° and 3° alcohols, dehydration mechanism, acidity of phenols and their electrophilic substitution. Aldehydes and ketones: nature of the carbonyl group, nucleophilic addition, reactivity of α-hydrogen, oxidation, reduction, aldol, Cannizzaro and haloform reactions, tests. Carboxylic acids: acid strength and factors affecting it.'],['Compounds Containing Nitrogen','Amines: nomenclature, classification, structure, basic character, identification of primary, secondary and tertiary amines; diazonium salts and their importance in synthesis.'],['Biomolecules','Importance and classification; carbohydrates (monosaccharides, disaccharides, polysaccharides); amino acids, peptide bond, polypeptides and proteins (primary to quaternary structure, denaturation); vitamins; nucleic acids (DNA and RNA constitution and functions).'],['Principles of Practical Chemistry','Detection of N, S and halogens and of functional groups (hydroxyl, carbonyl, carboxyl, amino) in organic compounds; preparation of Mohr’s salt, potash alum, acetanilide, p-nitroacetanilide, aniline yellow and iodoform; titrations using indicators (oxalic acid with KMnO₄, Mohr’s salt with KMnO₄); qualitative salt analysis (common cations and anions); enthalpy of solution of CuSO₄ and of neutralisation; preparing lyophilic and lyophobic sols; kinetic study of iodide ion with H₂O₂.']],
mathematics:[['Sets, Relations & Functions','Sets and their representation; union, intersection, complement; Venn diagrams, De Morgan’s laws; Cartesian product; relations (reflexive, symmetric, transitive, equivalence); functions (one-one, onto, composite, inverse).'],['Complex Numbers & Quadratic Equations','Complex numbers, algebra, Argand plane, polar form, modulus and argument, triangle inequality; cube roots of unity; quadratic equations in real and complex numbers, relations between roots and coefficients, nature of roots, sign of a quadratic expression.'],['Matrices & Determinants','Types of matrices; matrix algebra, transpose; determinants and their properties; adjoint and inverse; solving systems of linear equations (Cramer’s rule, matrix method); area of a triangle using determinants.'],['Permutations & Combinations','Fundamental principle of counting; permutations and combinations and their applications.'],['Binomial Theorem','Binomial theorem for a positive integral index; general and middle terms; properties of binomial coefficients; simple applications.'],['Sequences & Series','Arithmetic, geometric and harmonic progressions; arithmetic, geometric and harmonic means; relation between AM, GM and HM; sums of special series; arithmetico-geometric series.'],['Limits, Continuity & Differentiability','Limits, continuity and differentiability of real functions; derivatives of algebraic, trigonometric, inverse trigonometric, exponential and logarithmic functions; chain rule, implicit, parametric and logarithmic differentiation; second-order derivatives; Rolle’s and Lagrange’s mean value theorems; tangents and normals; increasing and decreasing functions; maxima and minima.'],['Integral Calculus','Integral as anti-derivative; standard integrals; integration by substitution, parts and partial fractions; definite integrals and their properties; area under simple curves.'],['Differential Equations','Order and degree; formation of differential equations; solving first-order, first-degree equations (variable separable, homogeneous, linear).'],['Coordinate Geometry','Cartesian coordinates; straight lines (forms, distance, angle between lines); circles; conic sections: parabola, ellipse and hyperbola in standard forms, focus, directrix and eccentricity.'],['Three-Dimensional Geometry','Direction cosines and ratios; equations of a line and a plane in different forms; angle between lines and planes; distance of a point from a plane; shortest distance between lines.'],['Vector Algebra','Vectors and scalars; addition, components in 2D and 3D; scalar (dot) and vector (cross) products and their applications.'],['Statistics & Probability','Mean deviation, variance and standard deviation; random experiments, probability of events, conditional probability, multiplication theorem, total probability, Bayes’ theorem; random variables and distributions, mean and variance; binomial distribution and Bernoulli trials.'],['Trigonometry','Trigonometric functions, identities and equations; inverse trigonometric functions and their properties.']]},

function anIid(){try{let i=localStorage.getItem(ANI);if(!i||!/^[a-z0-9]{10,24}$/.test(i)){i=Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>(b%36).toString(36)).join('')+Date.now().toString(36).slice(-4);localStorage.setItem(ANI,i)}return i}catch(e){return ''}}
function anEv(ev){if(!anOn()||!CHAT_URL)return;const d=today();if(ANS.d!==d){ANS={d,e:{},dirty:0,s:0}}if(!/^[a-z_]{1,24}$/.test(ev))return;if(Object.keys(ANS.e).length>=24&&!(ev in ANS.e))return;ANS.e[ev]=(ANS.e[ev]||0)+1;ANS.dirty=1}
function anFlush(){if(!anOn()||!CHAT_URL||!ANS.dirty||!ANS.d)return;const id=anIid();if(!id)return;ANS.dirty=0;try{fetch(dbRoot()+'/analytics/d/'+ANS.d+'/'+id+'.json',{method:'PUT',keepalive:true,body:JSON.stringify({ts:Date.now(),e:ANS.e,si:ACC.u?1:0,v:APP_V})}).catch(()=>{})}catch(e){}}
setInterval(anFlush,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')anFlush()});
{const _g=go;go=function(t){_g(t);anEv('tab_'+t)}}
{const _p=pick;pick=function(k){_p(k);anEv('q_answered')}}
{const _m=mxFinish;mxFinish=function(a){const w=MX.on;_m(a);if(w)anEv('mock_done')}}
anEv('open');

addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFI=e;if(tab==='home')keep()});

if(DEFI)return `<div class="card"><div class="row sp"><b>Install Project Aster</b><button class="act" onclick="instNo()">Not now</button></div><p class="mut" style="margin:6px 0 12px;line-height:1.45">Add it to your home screen. It opens like an app and works offline.</p><button class="btn" onclick="instGo()">Install app</button></div>`;
if(isIOS())return `<div class="card"><div class="row sp"><b>Install Project Aster</b><button class="act" onclick="instNo()">Not now</button></div><p class="mut" style="margin:6px 0 0;line-height:1.45">In Safari tap the Share button, then “Add to Home Screen”.</p></div>`;return ''}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
// ---- welcome screen (first launch) ----
let OBS={i:0,exam:'main',date:'',hrs:4,goal:20,hard:[],name:''};
function obOpen(){OBS={i:0,exam:'main',date:'',hrs:4,goal:20,hard:[],name:S.name||''};obPaint()}
function obClose(){const o=document.getElementById('obm');if(o)o.remove();if(document.body.style)document.body.style.overflow=''}
function obSet(k,v){OBS[k]=v;obPaint()}
function obHard(s){OBS.hard=OBS.hard.includes(s)?OBS.hard.filter(x=>x!==s):OBS.hard.concat([s]);obPaint()}
function obNext(d){const e=document.getElementById('obd');if(e&&e.value)OBS.date=e.value;const n=document.getElementById('obn');if(n)OBS.name=n.value;OBS.i=Math.max(0,Math.min(4,OBS.i+d));obPaint()}
function obDone(skip){const P=plP();S.ob={done:1,exam:OBS.exam,date:skip?'':(dkOk(OBS.date)?OBS.date:''),hrs:OBS.hrs,hard:skip?[]:OBS.hard.slice(),ts:Date.now()};
if(!skip){P.hrs=OBS.hrs;P.hard=OBS.hard.slice();S.goal=OBS.goal;const nm=String(OBS.name||'').replace(/[^\w .-]/g,'').trim().slice(0,20);if(nm.length>=2&&!S.name)S.name=nm;P.on=true;P.rd=plRD();P.t0=today();planRoll(true)}
save();anEv(skip?'onboard_skip':'onboard_done');obClose();go('home')}
function obPaint(){let o=document.getElementById('obm');if(!o){o=document.createElement('div');o.id='obm';o.style.cssText='position:fixed;inset:0;z-index:130;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 30px)';document.body.appendChild(o);if(document.body.style)document.body.style.overflow='hidden'}
const i=OBS.i,chip=(k,v,l)=>`<span class="chip ${OBS[k]===v?'on':''}" style="font-size:16px;padding:12px 16px" onclick="obSet('${k}',${typeof v=='string'?`'${v}'`:v})">${l}</span>`;
const dots=`<div class="row" style="gap:6px;margin-bottom:22px">${[0,1,2,3,4].map(x=>`<span style="height:5px;flex:1;border-radius:3px;background:${x<=i?'var(--g)':'var(--line)'}"></span>`).join('')}</div>`;
const T=[
['Welcome to Project Aster','Your JEE study tracker. A few quick questions and we will build your daily plan.',`<small style="display:block;margin-bottom:10px">WHICH EXAM ARE YOU PREPARING FOR?</small><div class="row" style="flex-wrap:wrap;gap:10px">${chip('exam','main','JEE Main')}${chip('exam','adv','JEE Main + Advanced')}</div>`],
['When is your exam?','We count the days and fit your syllabus into them.',`<input id="obd" type="date" value="${OBS.date}" min="${today()}" style="font-size:18px"><small class="mut" style="display:block;margin:8px 0 14px;line-height:1.4">Not sure? Pick an estimate. You can change it any time. Official dates are on nta.ac.in.</small><div class="row" style="flex-wrap:wrap;gap:8px">${[[90,'3 months'],[180,'6 months'],[270,'9 months'],[365,'1 year']].map(x=>`<span class="chip ${OBS.date===dkAdd(today(),x[0])?'on':''}" style="font-size:15px;padding:10px 14px" onclick="OBS.date=dkAdd(today(),${x[0]});obPaint()">${x[1]}</span>`).join('')}</div>${dkOk(OBS.date)?`<p style="margin:14px 0 0;font-size:17px"><b>${Math.max(0,dkDiff(today(),OBS.date))} days</b> to go</p>`:''}`],
['How much can you study?','Be honest. A plan you can follow beats a perfect plan you skip.',`<small style="display:block;margin-bottom:10px">STUDY HOURS PER DAY</small><div class="row" style="flex-wrap:wrap;gap:10px;margin-bottom:20px">${[2,3,4,5,6,8].map(h=>chip('hrs',h,h+'h')).join('')}</div><small style="display:block;margin-bottom:10px">QUESTIONS PER DAY GOAL</small><div class="row" style="flex-wrap:wrap;gap:10px">${[10,20,30,50].map(n=>chip('goal',n,String(n))).join('')}</div>`],
['Which subjects feel hardest?','Pick any. They get extra time in your plan.',`<div class="row" style="flex-wrap:wrap;gap:10px">${PLS.map(s=>`<span class="chip ${OBS.hard.includes(s)?'on':''}" style="font-size:16px;padding:12px 18px" onclick="obHard('${s}')">${SN[s]}</span>`).join('')}</div>`],
['What should we call you?','Optional. This also shows on your chat posts.',`<input id="obn" maxlength="20" placeholder="Your name" value="${escH(OBS.name)}" style="font-size:18px"><p class="mut" style="margin:14px 0 0;line-height:1.5">You can sign in with Google later from the profile icon to keep your progress on every device.</p>`]][i];
o.innerHTML=`<div style="max-width:440px;margin:0 auto">${dots}<h1 style="font-size:32px;line-height:1.15">${T[0]}</h1><p class="mut" style="font-size:17px;margin:10px 0 24px;line-height:1.5">${T[1]}</p>${T[2]}<div class="row" style="margin-top:28px;gap:10px">${i?`<button class="btn s" style="flex:1" onclick="obNext(-1)">Back</button>`:''}${i<4?`<button class="btn" style="flex:2" onclick="obNext(1)">Next</button>`:`<button class="btn" style="flex:2" onclick="obDone(0)">Build my plan</button>`}</div><button class="act" style="display:block;margin:16px auto 0;font-size:15px" onclick="obDone(1)">Skip for now</button></div>`}
// ---- help & settings ----
let HP={fk:'bug',msg:'',busy:0};
function hpOpen(){HP.msg='';hpPaint()}
function hpClose(){const o=document.getElementById('hpm');if(o)o.remove();if(document.body.style)document.body.style.overflow=''}
function hpMsg(t,c){HP.msg=t;const e=document.getElementById('hpmsg');if(e){e.textContent=t;e.style.color=c||'var(--mut)'}}
function hpWipe(){try{localStorage.clear()}catch(e){}}
async function hpSend(){const m=((document.getElementById('hpt')||{}).value||'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').trim().slice(0,1000),em=((document.getElementById('hpe')||{}).value||'').trim().slice(0,100);
if(m.length<5)return hpMsg('Please write a few words.','var(--bad)');if(!CHAT_URL)return hpMsg('Feedback is not connected yet.','var(--bad)');if(HP.busy)return;HP.busy=1;
const body={m,k:HP.fk,ts:Date.now(),v:APP_V};if(em)body.em=em;if(ACC.u&&ACC.u.uid)body.u=ACC.u.uid;
try{const res=await fetch(dbRoot()+'/feedback.json',{method:'POST',body:JSON.stringify(body)});if(!res.ok)throw 0;HP.busy=0;anEv('feedback');const t=document.getElementById('hpt');if(t)t.value='';hpMsg('Thank you! We read every message.','var(--ok)')}catch(e){HP.busy=0;hpMsg('Could not send. Check your internet and try again.','var(--bad)')}}
function hpTog(){try{localStorage.setItem('aster_noan',anOn()?'1':'0')}catch(e){}hpPaint()}
async function hpDelete(){if(!ACC.u){if(!confirm('Delete all Project Aster data on this device? This cannot be undone.'))return;hpWipe();location.reload();return}
if(!confirm('Delete your account and all your data? This cannot be undone.'))return;if(!confirm('Last check: your progress, plan, notes and chat posts will be permanently removed. Delete everything?'))return;
hpMsg('Deleting…');try{const tk=await tok(),uid=ACC.u.uid,q=encodeURIComponent(tk);
const pr=await fetch(dbRoot()+'/posts.json?orderBy='+encodeURIComponent('"uid"')+'&equalTo='+encodeURIComponent('"'+uid+'"')+'&auth='+q);if(pr.ok){const o=await pr.json()||{},u={};Object.keys(o).forEach(id=>{if(okId(id))u['posts/'+id]=null});if(Object.keys(u).length){const d=await fetch(dbRoot()+'/.json?auth='+q,{method:'PATCH',body:JSON.stringify(u)});if(!d.ok)throw new Error('Could not remove your chat posts.')}}
const ud=await fetch(dbRoot()+'/users/'+uid+'.json?auth='+q,{method:'DELETE'});if(!ud.ok)throw new Error('Could not remove your saved progress.');
const rs=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:delete?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:tk})});
if(!rs.ok){const e=await rs.json().catch(()=>({})),m=(e.error&&e.error.message)||'';throw new Error(/CREDENTIAL_TOO_OLD/.test(m)?'For your safety, sign out, sign in again, then delete straight away.':'Could not delete the sign-in account ('+m+').')}
hpWipe();location.reload()}catch(e){hpMsg(e.message||'Could not delete. Try again.','var(--bad)')}}
function hpPaint(){let o=document.getElementById('hpm');if(!o){o=document.createElement('div');o.id='hpm';o.style.cssText='position:fixed;inset:0;z-index:110;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 40px)';document.body.appendChild(o);if(document.body.style)document.body.style.overflow='hidden'}
const fk=(k,l)=>`<span class="chip ${HP.fk===k?'on':''}" onclick="HP.fk='${k}';hpPaint()">${l}</span>`;
const inst=isStandalone()?'':DEFI?`<div class="card"><b>Install the app</b><p class="mut" style="margin:6px 0 12px;line-height:1.45">Opens like an app and works offline.</p><button class="btn" onclick="instGo();hpClose()">Install</button></div>`:isIOS()?`<div class="card"><b>Install the app</b><p class="mut" style="margin:6px 0 0;line-height:1.45">In Safari tap Share, then “Add to Home Screen”.</p></div>`:'';
o.innerHTML=`<div style="max-width:440px;margin:0 auto"><button class="avb" style="margin-bottom:16px" onclick="hpClose()" aria-label="Close"><span style="background:none;font-size:26px">×</span></button><h1 style="font-size:30px">Help & settings</h1><p class="mut" style="margin:6px 0 16px">Project Aster ${APP_V}</p>${inst}
<div class="card"><b>Send feedback</b><p class="mut" style="margin:6px 0 10px;line-height:1.45">Found a bug or want a feature? Tell us. We are in beta and read everything.</p><div class="row" style="flex-wrap:wrap;margin-bottom:10px">${fk('bug','Bug')}${fk('idea','Idea')}${fk('other','Other')}</div><textarea id="hpt" rows="4" maxlength="1000" placeholder="What happened, or what would you like?"></textarea><input id="hpe" maxlength="100" placeholder="Email or Instagram (optional, if you want a reply)" style="margin-top:8px"><button class="btn" style="margin-top:10px" onclick="hpSend()">Send</button><p id="hpmsg" class="mut" style="margin:8px 0 0;min-height:18px">${escH(HP.msg)}</p></div>
<div class="card"><b>Your data</b><p class="mut" style="margin:6px 0 10px;line-height:1.45">Save a backup file of your progress, or restore one.</p><button class="btn s" onclick="hpClose();go('stat');setTimeout(()=>scrollTo(0,document.body.scrollHeight),150)">Open backup tools</button></div>
<div class="card"><b>Privacy</b><p class="mut" style="margin:6px 0 10px;line-height:1.45">Anonymous usage counts help us see which features people use. No name, email or account is attached.</p><div class="row sp"><span>Share anonymous usage counts</span><button class="chip ${anOn()?'on':''}" onclick="hpTog()">${anOn()?'On':'Off'}</button></div><div class="row" style="margin-top:12px;flex-wrap:wrap"><a class="chip" href="privacy.html" target="_blank" rel="noopener">Privacy policy</a><a class="chip" href="terms.html" target="_blank" rel="noopener">Terms of use</a></div></div>
<div class="card"><b>Delete ${ACC.u?'my account and data':'data on this device'}</b><p class="mut" style="margin:6px 0 10px;line-height:1.45">${ACC.u?'Removes your sign-in account, saved progress, plan and chat posts. This cannot be undone.':'Clears everything Project Aster saved on this device. This cannot be undone.'}</p><button class="btn s" style="color:var(--bad);border-color:var(--bad)" onclick="hpDelete()">Delete ${ACC.u?'my account':'my data'}</button></div>
<p class="mut" style="text-align:center;margin:18px 0 0;font-size:13px;line-height:1.5">Contact: ${escH(CONTACT)}</p></div>`}
function planFoot(){return `<p class="mut" style="text-align:center;margin:22px 0 6px;font-size:13px"><a href="privacy.html" target="_blank" rel="noopener" style="color:inherit">Privacy</a> · <a href="terms.html" target="_blank" rel="noopener" style="color:inherit">Terms</a> · <a href="#" onclick="hpOpen();return false" style="color:inherit">Help & feedback</a></p>`}
// ---- help button on the account page ----
{const _ab=acBody;acBody=function(){const b=_ab();if(ACC.mode==='admin')return b;return b+`<button class="bigbtn" style="margin-top:22px" onclick="acClose();hpOpen()">Help, feedback & settings</button>`}}
// ---- admin: usage + feedback tabs ----
async function adMore(){if(!isAdmin())return;AD.more=0;acPaint();try{const t=encodeURIComponent(await tok()),ob=encodeURIComponent('"$key"'),[a,f]=await Promise.all([fetch(dbRoot()+'/analytics/d.json?auth='+t+'&orderBy='+ob+'&limitToLast=14'),fetch(dbRoot()+'/feedback.json?auth='+t+'&orderBy='+ob+'&limitToLast=60')]);AD.an=a.ok?(await a.json()||{}):{};AD.fb=f.ok?(await f.json()||{}):{};AD.me=(!a.ok||!f.ok)?'Could not load everything. Check the database rules.':''}catch(e){AD.me='Could not load.'}AD.more=1;acPaint()}
function adChips(){const l=[['rep','Reported'],['all','All posts'],['use','Usage'],['fb','Feedback']];return l.map(x=>`<span class="chip ${AD.tab===x[0]?'on':''}" onclick="AD.tab='${x[0]}';${x[0]==='use'||x[0]==='fb'?'adMore()':'acPaint()'}">${x[1]}</span>`).join('')+`<span class="chip" onclick="adLoad()">Refresh</span>`}
function adMoreBody(){let h='';const an=AD.an||{},days=Object.keys(an).sort();
if(AD.tab==='use'){const rows=days.map(d=>{const v=an[d]||{},n=Object.keys(v).length;return{d,n,si:Object.values(v).filter(x=>x&&x.si).length}}),mx=Math.max(1,...rows.map(r=>r.n)),tot={};days.slice(-7).forEach(d=>Object.values(an[d]||{}).forEach(x=>{if(x&&x.e)Object.keys(x.e).forEach(k=>{tot[k]=(tot[k]||0)+(+x.e[k]||0)})}));
h+=`<div class="card" style="margin:0 0 10px"><b>Daily users (devices)</b>${rows.length?rows.map(r=>`<div class="row sp" style="margin-top:8px"><small style="width:62px">${dkLab(r.d,{day:'numeric',month:'short'})}</small><div style="flex:1;height:10px;border-radius:5px;background:var(--line)"><div style="width:${Math.round(r.n/mx*100)}%;height:100%;border-radius:5px;background:var(--g)"></div></div><b style="width:64px;text-align:right">${r.n}</b></div>`).join(''):'<p class="mut">No data yet.</p>'}<small class="mut" style="display:block;margin-top:8px">Each device counts once a day. ${rows.length?'Signed in today: '+rows[rows.length-1].si:''}</small></div>`;
const ev=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]).slice(0,14);h+=`<div class="card" style="margin:0 0 10px"><b>What people do (last 7 days)</b>${ev.map(k=>`<div class="row sp" style="margin-top:8px"><span>${escH(k.replace(/_/g,' '))}</span><b>${tot[k]}</b></div>`).join('')||'<p class="mut">No data yet.</p>'}</div>`}
else{const fb=AD.fb||{},ids=Object.keys(fb).sort().reverse();h+=ids.length?ids.map(id=>{const f=fb[id]||{};return `<div class="card" style="margin:0 0 10px"><div class="row sp"><b>${escH(String(f.k||'other'))}</b><small>${f.ts?ago(+f.ts):''} · v${escH(String(f.v||''))}</small></div><p style="margin:6px 0;overflow-wrap:anywhere;line-height:1.45">${escH(String(f.m||''))}</p>${f.em?`<small>Reply to: ${escH(String(f.em))}</small>`:''}</div>`}).join(''):'<p class="mut">No feedback yet.</p>'}
return h}
{const _ad=adminBody;adminBody=function(){if(AD.tab==='use'||AD.tab==='fb'){return `<h1 style="font-size:30px">Moderation</h1><div class="row" style="flex-wrap:wrap;margin:12px 0">${adChips()}</div>${AD.more?(AD.me?`<p style="color:var(--bad)">${escH(AD.me)}</p>`:'')+adMoreBody():'<p class="mut">Loading…</p>'}<button class="bigbtn" style="margin-top:14px" onclick="acMode('in')">← Back to account</button>`}
return _ad().replace(/<span class="chip" onclick="adLoad\(\)">Refresh<\/span>/,'<span class="chip" onclick="AD.tab=\'use\';adMore()">Usage</span><span class="chip" onclick="AD.tab=\'fb\';adMore()">Feedback</span><span class="chip" onclick="adLoad()">Refresh</span>')}}
// ---- home: plan card, beta tag, footer ----
{const _h=home;home=function(){return _h()+planFoot()}}
// ---- first launch ----
if(!S.ob&&!S.xp&&!Object.keys(S.hist||{}).length&&!Object.keys(S.trk||{}).length)setTimeout(obOpen,350);
planRoll();

r();
