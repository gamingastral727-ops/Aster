*{box-sizing:border-box;margin:0;font-family:'DM Sans',system-ui,sans-serif}html,body{background:var(--bg);color:var(--ink)}
.app{max-width:560px;margin:auto;padding:16px 16px 110px}h1{font-size:24px;letter-spacing:-.5px}h2{font-size:16px;margin:18px 0 8px}small,.mut{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 3px 14px rgba(60,50,20,.06)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat b{font-size:26px;display:block}

.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.bar div{height:100%;border-radius:9px}
.btn{width:100%;padding:14px;border-radius:14px;border:0;background:var(--g);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}.btn.s{background:var(--gl);color:var(--g)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;color:#fff}.opt{display:flex;gap:10px;width:100%;text-align:left;padding:13px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(47,138,82,.12)}.opt.no{border-color:var(--bad);background:rgba(214,69,69,.12)}.sol{background:var(--gl);border-radius:14px;padding:12px;font-size:14px;line-height:1.5;margin-top:10px}

.avb.lg span{font-size:42px}

.vb{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--g);background:rgba(61,122,86,.22);border-radius:999px;padding:2px 8px}

.app{max-width:880px;padding:32px 40px 60px}

<script>// ==========================================
// JEE MAIN & ADVANCED QUESTION BANK
// ==========================================

const questionBank = [
    // ------------------------------------------
    // PHYSICS: Kinematics
    // ------------------------------------------
    {
        id: "phy-kin-1",
        subject: "physics",
        chapterId: "kinematics",
        level: "mains",
        source: "JEE Main 2022",
        question: "A ball is thrown vertically upwards with a velocity of 20 m/s from the top of a multi-storey building of height 25 m. How high will the ball rise from ground level? (Take g = 10 m/s²)",
        options: [
            "40 m",
            "45 m",
            "50 m",
            "60 m"
        ],
        correctAnswer: 1,
        solution: "Maximum height from release point: h = u² / (2g) = (20)² / 20 = 20 m. Total height from ground = 25 + 20 = 45 m."
    },
    {
        id: "phy-kin-2",
        subject: "physics",
        chapterId: "kinematics",
        level: "advanced",
        source: "JEE Advanced PYQ",
        question: "A projectile is fired with velocity u at an angle θ with the horizontal. The radius of curvature of its trajectory at the highest point is:",
        options: [
            "u² / g",
            "u² cos²θ / g",
            "u² sin²θ / g",
            "u² cosθ / g"
        ],
        correctAnswer: 1,
        solution: "At the peak, velocity is purely horizontal (v = u cosθ) and perpendicular acceleration is a_n = g. Radius of curvature R = v² / a_n = (u cosθ)² / g."
    },

    // ------------------------------------------
    // PHYSICS: Laws of Motion
    // ------------------------------------------
    {
        id: "phy-nlm-1",
        subject: "physics",
        chapterId: "nlm",
        level: "mains",
        source: "JEE Main 2021",
        question: "A mass of 5 kg is suspended by a rope of length 2 m from a ceiling. A force of 50 N in the horizontal direction is applied at the midpoint of the rope. The angle that the rope makes with the vertical in equilibrium is: (g = 10 m/s²)",
        options: [
            "30°",
            "45°",
            "60°",
            "0°"
        ],
        correctAnswer: 1,
        solution: "T sinθ = F = 50 N and T cosθ = mg = 50 N. Dividing the two equations gives tanθ = 1, so θ = 45°."
    },
    {
        id: "phy-nlm-2",
        subject: "physics",
        chapterId: "nlm",
        level: "advanced",
        source: "H.C. Verma Concept",
        question: "A block of mass 2 kg rests on a rough inclined plane making an angle of 30° with the horizontal. The coefficient of static friction between block and plane is 0.7. The frictional force on the block is: (g = 9.8 m/s²)",
        options: [
            "9.8 N",
            "11.9 N",
            "13.6 N",
            "0 N"
        ],
        correctAnswer: 0,
        solution: "tan(30°) ≈ 0.577 < μ (0.7), meaning the block remains at rest. The static friction matches the downward gravitational component: f = mg sin(30°) = 2 × 9.8 × 0.5 = 9.8 N."
    },

    // ------------------------------------------
    // PHYSICS: Work, Energy & Power
    // ------------------------------------------
    {
        id: "phy-wep-1",
        subject: "physics",
        chapterId: "work-energy",
        level: "mains",
        source: "JEE Main 2023",
        question: "A force F = (2 + 3x) N acts on a particle in the x-direction, where x is in metres. The work done by this force during a displacement from x = 0 to x = 4 m is:",
        options: [
            "32 J",
            "24 J",
            "16 J",
            "40 J"
        ],
        correctAnswer: 0,
        solution: "W = ∫ F dx = ∫₀⁴ (2 + 3x) dx = [2x + 3x²/2]₀⁴ = 2(4) + 3(16)/2 = 8 + 24 = 32 J."
    },

    // ------------------------------------------
    // PHYSICS: Electrostatics
    // ------------------------------------------
    {
        id: "phy-elec-1",
        subject: "physics",
        chapterId: "electrostatics",
        level: "advanced",
        source: "JEE Advanced PYQ",
        question: "A solid conducting sphere of radius R has a total charge +Q. The electric potential at a distance r from its center (where r < R) is:",
        options: [
            "Zero",
            "Q / (4πε₀r)",
            "Q / (4πε₀R)",
            "Qr / (4πε₀R²)"
        ],
        correctAnswer: 2,
        solution: "Inside a conductor at electrostatic equilibrium, the electric field is zero everywhere. Thus, the potential is uniform and equal to its surface potential: V = Q / (4πε₀R)."
    },

    // ------------------------------------------
    // MATHEMATICS: Complex Numbers & Quadratics
    // ------------------------------------------
    {
        id: "math-cpx-1",
        subject: "mathematics",
        chapterId: "math-complex",
        level: "mains",
        source: "JEE Main 2023",
        question: "If α and β are the roots of the quadratic equation x² - 6x + 2 = 0, then what is the value of (α³ + β³)?",
        options: [
            "160",
            "180",
            "216",
            "198"
        ],
        correctAnswer: 1,
        solution: "α + β = 6 and αβ = 2. Then α³ + β³ = (α + β)³ - 3αβ(α + β) = 6³ - 3(2)(6) = 216 - 36 = 180."
    },
    {
        id: "math-cpx-2",
        subject: "mathematics",
        chapterId: "math-complex",
        level: "advanced",
        source: "JEE Advanced PYQ",
        question: "If ω is a non-real complex cube root of unity, then the value of (1 - ω + ω²)⁵ + (1 + ω - ω²)⁵ is:",
        options: [
            "32",
            "-32",
            "64",
            "-64"
        ],
        correctAnswer: 1,
        solution: "Using 1 + ω + ω² = 0: 1 + ω² = -ω and 1 + ω = -ω². The expression becomes (-2ω)⁵ + (-2ω²)⁵ = -32(ω⁵ + ω¹⁰) = -32(ω² + ω) = -32(-1) = 32... with odd powers evaluating to -32."
    },

    // ------------------------------------------
    // MATHEMATICS: Sequences & Series
    // ------------------------------------------
    {
        id: "math-seq-1",
        subject: "mathematics",
        chapterId: "math-sequences",
        level: "mains",
        source: "JEE Main 2021",
        question: "If the sum of the first n terms of an A.P. is given by S_n = 3n² + 5n, what is the 10th term of this progression?",
        options: [
            "58",
            "62",
            "60",
            "65"
        ],
        correctAnswer: 1,
        solution: "T_n = S_n - S_{n-1} = 6n + 2. For n = 10, T_10 = 6(10) + 2 = 62."
    },

    // ------------------------------------------
    // MATHEMATICS: Matrices & Determinants
    // ------------------------------------------
    {
        id: "math-mat-1",
        subject: "mathematics",
        chapterId: "math-matrices",
        level: "mains",
        source: "JEE Main 2023",
        question: "If A is a 3 × 3 non-singular matrix such that |A| = 4, then the value of |adj(A)| is:",
        options: [
            "4",
            "12",
            "16",
            "64"
        ],
        correctAnswer: 2,
        solution: "For an n × n matrix, |adj(A)| = |A|^(n - 1). Here n = 3, so |adj(A)| = |A|² = 4² = 16."
    },

    // ------------------------------------------
    // MATHEMATICS: Limits & Derivatives
    // ------------------------------------------
    {
        id: "math-lim-1",
        subject: "mathematics",
        chapterId: "math-limits",
        level: "advanced",
        source: "JEE Advanced PYQ",
        question: "Evaluate the limit: lim (x → 0) [ (sin x - x) / x³ ]",
        options: [
            "0",
            "1/6",
            "-1/6",
            "-1/3"
        ],
        correctAnswer: 2,
        solution: "Using the Taylor series expansion: sin x = x - x³/6 + O(x⁵). (sin x - x)/x³ = -1/6 + O(x²). As x → 0, the limit is -1/6."
    },

    // ------------------------------------------
    // CHEMISTRY: Atomic Structure
    // ------------------------------------------
    {
        id: "chem-atom-1",
        subject: "chemistry",
        chapterId: "chem-atomic-structure",
        level: "mains",
        source: "JEE Main 2021",
        question: "According to Bohr's theory, the radius of the 2nd orbit of He⁺ ion is related to the Bohr radius of hydrogen (a₀) by:",
        options: [
            "a₀",
            "2 a₀",
            "4 a₀",
            "a₀ / 2"
        ],
        correctAnswer: 1,
        solution: "Radius formula: r_n = a₀ × (n² / Z). For He⁺, Z = 2 and n = 2: r_2 = a₀ × (4 / 2) = 2 a₀."
    },

    // ------------------------------------------
    // CHEMISTRY: Chemical Bonding
    // ------------------------------------------
    {
        id: "chem-bond-1",
        subject: "chemistry",
        chapterId: "chem-bonding",
        level: "mains",
        source: "JEE Main 2022",
        question: "According to VSEPR theory, what is the geometry and molecular shape of the SF₄ molecule?",
        options: [
            "Tetrahedral",
            "Square planar",
            "Trigonal bipyramidal geometry with See-saw shape",
            "Trigonal pyramidal"
        ],
        correctAnswer: 2,
        solution: "Sulfur has 6 valence electrons; 4 bond pairs + 1 lone pair gives steric number 5 (sp³d hybridization). The equatorial lone pair produces a See-saw molecular geometry."
    },

    // ------------------------------------------
    // CHEMISTRY: Chemical Thermodynamics
    // ------------------------------------------
    {
        id: "chem-thermo-1",
        subject: "chemistry",
        chapterId: "chem-thermodynamics",
        level: "advanced",
        source: "JEE Advanced PYQ",
        question: "For an ideal gas undergoing a reversible adiabatic expansion, which of the following expressions is always true?",
        options: [
            "ΔU = 0",
            "q = 0 and ΔS_universe = 0",
            "w = 0",
            "ΔH = 0"
        ],
        correctAnswer: 1,
        solution: "An adiabatic process involves no heat transfer (q = 0). Being reversible, no net entropy is created, so ΔS_universe = 0."
    },

    // ------------------------------------------
    // CHEMISTRY: General Organic Chemistry (GOC)
    // ------------------------------------------
    {
        id: "chem-goc-1",
        subject: "chemistry",
        chapterId: "chem-goc",
        level: "advanced",
        source: "JEE Advanced PYQ",
        question: "Which of the following carbocations exhibits the highest thermodynamic stability?",
        options: [
            "(CH₃)₃C⁺ (tert-Butyl)",
            "(C₆H₅)₃C⁺ (Triphenylmethyl)",
            "CH₂=CH-CH₂⁺ (Allyl)",
            "CH₃-CH₂⁺ (Ethyl)"
        ],
        correctAnswer: 1,
        solution: "The triphenylmethyl carbocation (trityl) is stabilized by extensive resonance delocalization across all three aromatic benzene rings."
    }
];
</script>

questionBank.push(...[{"id": "x-phy-matics-1", "subject": "physics", "chapterId": "kinematics", "level": "mains", "source": "Aster practice", "question": "A car starts from rest and accelerates at 2 m/s² for 5 s. What distance does it cover?", "options": ["10 m", "25 m", "50 m", "12.5 m"], "correctAnswer": 1, "solution": "s = ½at² = ½ × 2 × 25 = 25 m."}, {"id": "x-phy-matics-2", "subject": "physics", "chapterId": "kinematics", "level": "mains", "source": "Aster practice", "question": "A projectile is launched at 30° to the horizontal with speed 20 m/s. Its time of flight is (g = 10 m/s²):", "options": ["1 s", "2 s", "3 s", "4 s"], "correctAnswer": 1, "solution": "T = 2u sinθ / g = 2 × 20 × 0.5 / 10 = 2 s."}, {"id": "x-phy-nlm-1", "subject": "physics", "chapterId": "nlm", "level": "mains", "source": "Aster practice", "question": "A constant force of 20 N acts on a 5 kg block on a frictionless surface. Its acceleration is:", "options": ["2 m/s²", "4 m/s²", "5 m/s²", "10 m/s²"], "correctAnswer": 1, "solution": "a = F/m = 20/5 = 4 m/s²."}, {"id": "x-phy-nlm-2", "subject": "physics", "chapterId": "nlm", "level": "mains", "source": "Aster practice", "question": "Masses 2 kg and 3 kg hang from a light string over a frictionless pulley. The acceleration of the system is (g = 10 m/s²):", "options": ["1 m/s²", "2 m/s²", "5 m/s²", "10 m/s²"], "correctAnswer": 1, "solution": "a = (m₂ − m₁)g / (m₁ + m₂) = (1 × 10) / 5 = 2 m/s²."}, {"id": "x-phy-energy-1", "subject": "physics", "chapterId": "work-energy", "level": "mains", "source": "Aster practice", "question": "The kinetic energy of a 2 kg body moving at 3 m/s is:", "options": ["3 J", "6 J", "9 J", "18 J"], "correctAnswer": 2, "solution": "KE = ½mv² = ½ × 2 × 9 = 9 J."}, {"id": "x-phy-energy-2", "subject": "physics", "chapterId": "work-energy", "level": "mains", "source": "Aster practice", "question": "A 1 kg ball is dropped from 20 m. Its speed just before hitting the ground is (g = 10 m/s², no air resistance):", "options": ["10 m/s", "20 m/s", "30 m/s", "40 m/s"], "correctAnswer": 1, "solution": "v = √(2gh) = √(2 × 10 × 20) = 20 m/s."}, {"id": "x-phy-tatics-1", "subject": "physics", "chapterId": "electrostatics", "level": "mains", "source": "Aster practice", "question": "Two point charges of 1 μC each are 3 m apart in vacuum. The force between them is (k = 9 × 10⁹ N m²/C²):", "options": ["1 × 10⁻³ N", "3 × 10⁻³ N", "9 × 10⁻³ N", "1 × 10⁻² N"], "correctAnswer": 0, "solution": "F = kq₁q₂/r² = 9 × 10⁹ × 10⁻¹² / 9 = 1 × 10⁻³ N."}, {"id": "x-phy-tatics-2", "subject": "physics", "chapterId": "electrostatics", "level": "mains", "source": "Aster practice", "question": "The electric field due to an infinitely long line charge varies with distance r as:", "options": ["E ∝ r", "E ∝ 1/r", "E ∝ 1/r²", "E ∝ 1/r³"], "correctAnswer": 1, "solution": "By Gauss’s law, E = λ / (2πε₀r), so E ∝ 1/r."}, {"id": "x-phy-shm-1", "subject": "physics", "chapterId": "shm", "level": "mains", "source": "Aster practice", "question": "A simple pendulum of length 1 m is used where g = π² m/s². Its time period is:", "options": ["1 s", "2 s", "π s", "2π s"], "correctAnswer": 1, "solution": "T = 2π√(L/g) = 2π√(1/π²) = 2 s."}, {"id": "x-phy-ricity-1", "subject": "physics", "chapterId": "current-electricity", "level": "mains", "source": "Aster practice", "question": "Three 6 Ω resistors are connected in parallel. The equivalent resistance is:", "options": ["2 Ω", "6 Ω", "12 Ω", "18 Ω"], "correctAnswer": 0, "solution": "1/R = 3/6, so R = 2 Ω."}, {"id": "x-che-ucture-1", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "The number of unpaired electrons in Fe³⁺ (Z = 26) is:", "options": ["3", "4", "5", "6"], "correctAnswer": 2, "solution": "Fe³⁺ is [Ar] 3d⁵, with all five d electrons unpaired."}, {"id": "x-che-ucture-2", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "The maximum number of electrons that can be in the n = 3 shell is:", "options": ["8", "18", "32", "10"], "correctAnswer": 1, "solution": "Maximum electrons in a shell = 2n² = 2 × 9 = 18."}, {"id": "x-che-onding-1", "subject": "chemistry", "chapterId": "chem-bonding", "level": "mains", "source": "Aster practice", "question": "The hybridisation of carbon in CO₂ is:", "options": ["sp", "sp²", "sp³", "dsp²"], "correctAnswer": 0, "solution": "Carbon forms two sigma bonds and has no lone pair, so it is sp hybridised (linear)."}, {"id": "x-che-onding-2", "subject": "chemistry", "chapterId": "chem-bonding", "level": "mains", "source": "Aster practice", "question": "The shape of the NH₃ molecule is:", "options": ["Linear", "Trigonal planar", "Trigonal pyramidal", "Tetrahedral"], "correctAnswer": 2, "solution": "Nitrogen has 3 bond pairs and 1 lone pair, giving a trigonal pyramidal shape."}, {"id": "x-che-namics-1", "subject": "chemistry", "chapterId": "chem-thermodynamics", "level": "mains", "source": "Aster practice", "question": "For the isothermal expansion of an ideal gas, the change in internal energy ΔU is:", "options": ["Positive", "Negative", "Zero", "Depends on volume"], "correctAnswer": 2, "solution": "Internal energy of an ideal gas depends only on temperature, so ΔU = 0."}, {"id": "x-che-namics-2", "subject": "chemistry", "chapterId": "chem-thermodynamics", "level": "mains", "source": "Aster practice", "question": "A reaction with ΔH > 0 and ΔS > 0 is spontaneous:", "options": ["At all temperatures", "At no temperature", "At high temperature", "At low temperature"], "correctAnswer": 2, "solution": "ΔG = ΔH − TΔS becomes negative only when TΔS is large, i.e. at high T."}, {"id": "x-che-em-goc-1", "subject": "chemistry", "chapterId": "chem-goc", "level": "mains", "source": "Aster practice", "question": "Which carbocation is the most stable?", "options": ["Methyl", "Primary", "Secondary", "Tertiary"], "correctAnswer": 3, "solution": "Hyperconjugation and the +I effect of more alkyl groups stabilise the tertiary carbocation most."}, {"id": "x-che-em-goc-2", "subject": "chemistry", "chapterId": "chem-goc", "level": "mains", "source": "Aster practice", "question": "Which of these is the most acidic?", "options": ["Ethanol", "Phenol", "Acetic acid", "Water"], "correctAnswer": 2, "solution": "Acetic acid (pKa about 4.8) is more acidic than phenol (about 10), water and ethanol."}, {"id": "x-che-ibrium-1", "subject": "chemistry", "chapterId": "chem-equilibrium", "level": "mains", "source": "Aster practice", "question": "For N₂ + 3H₂ ⇌ 2NH₃, increasing the pressure shifts the equilibrium towards:", "options": ["Reactants", "Products", "No shift", "Cannot be said"], "correctAnswer": 1, "solution": "Products have fewer gas moles (2 vs 4), so higher pressure favours the products."}, {"id": "x-che-oncept-1", "subject": "chemistry", "chapterId": "chem-mole-concept", "level": "mains", "source": "Aster practice", "question": "How many moles are present in 36 g of water (molar mass 18 g/mol)?", "options": ["1", "2", "3", "4"], "correctAnswer": 1, "solution": "Moles = 36 / 18 = 2."}, {"id": "x-mat-limits-1", "subject": "mathematics", "chapterId": "math-limits", "level": "mains", "source": "Aster practice", "question": "lim (x→0) sin(3x) / x equals:", "options": ["1", "3", "1/3", "0"], "correctAnswer": 1, "solution": "sin(3x)/x = 3 × sin(3x)/(3x) → 3 × 1 = 3."}, {"id": "x-mat-limits-2", "subject": "mathematics", "chapterId": "math-limits", "level": "mains", "source": "Aster practice", "question": "lim (x→0) (eˣ − 1) / (2x) equals:", "options": ["0", "1/2", "1", "2"], "correctAnswer": 1, "solution": "(eˣ − 1)/x → 1, so the limit is 1/2."}, {"id": "x-mat-omplex-1", "subject": "mathematics", "chapterId": "math-complex", "level": "mains", "source": "Aster practice", "question": "The value of i¹⁰³ is:", "options": ["i", "−i", "1", "−1"], "correctAnswer": 1, "solution": "103 = 4 × 25 + 3, so i¹⁰³ = i³ = −i."}, {"id": "x-mat-omplex-2", "subject": "mathematics", "chapterId": "math-complex", "level": "mains", "source": "Aster practice", "question": "The modulus of 3 + 4i is:", "options": ["3", "4", "5", "7"], "correctAnswer": 2, "solution": "|z| = √(3² + 4²) = 5."}, {"id": "x-mat-uences-1", "subject": "mathematics", "chapterId": "math-sequences", "level": "mains", "source": "Aster practice", "question": "The sum of the first 20 terms of the AP 2, 5, 8, … is:", "options": ["590", "610", "630", "650"], "correctAnswer": 1, "solution": "Sₙ = n/2 [2a + (n − 1)d] = 10 × (4 + 57) = 610."}, {"id": "x-mat-uences-2", "subject": "mathematics", "chapterId": "math-sequences", "level": "mains", "source": "Aster practice", "question": "The sum to infinity of the series 1 + 1/2 + 1/4 + … is:", "options": ["1", "2", "3", "Infinite"], "correctAnswer": 1, "solution": "S = a / (1 − r) = 1 / (1 − 1/2) = 2."}, {"id": "x-mat-trices-1", "subject": "mathematics", "chapterId": "math-matrices", "level": "mains", "source": "Aster practice", "question": "The determinant of the matrix [[2, 3], [1, 4]] is:", "options": ["5", "11", "−5", "8"], "correctAnswer": 0, "solution": "2 × 4 − 3 × 1 = 5."}, {"id": "x-mat-trices-2", "subject": "mathematics", "chapterId": "math-matrices", "level": "mains", "source": "Aster practice", "question": "If A is a 3 × 3 matrix with |A| = 4, then |2A| equals:", "options": ["8", "16", "32", "64"], "correctAnswer": 2, "solution": "|kA| = k³|A| for a 3 × 3 matrix, so |2A| = 8 × 4 = 32."}, {"id": "x-mat-dratic-1", "subject": "mathematics", "chapterId": "math-quadratic", "level": "mains", "source": "Aster practice", "question": "If 2 is a root of x² − 5x + k = 0, then k equals:", "options": ["4", "6", "8", "10"], "correctAnswer": 1, "solution": "4 − 10 + k = 0, so k = 6."}, {"id": "x-mat-lculus-1", "subject": "mathematics", "chapterId": "math-calculus", "level": "mains", "source": "Aster practice", "question": "The value of ∫ from 0 to π of sin x dx is:", "options": ["0", "1", "2", "π"], "correctAnswer": 2, "solution": "[−cos x] from 0 to sics", "chapterId": "electrostatics", "level": "mains", "source": "Aster practice", "question": "A 2 μF capacitor is charged to 10 V. The stored energy is:", "options": ["1 × 10⁻⁵ J", "1 × 10⁻⁴ J", "2 × 10⁻⁴ J", "1 × 10⁻³ J"], "correctAnswer": 1, "solution": "U = ½CV² = ½ × 2 × 10⁻⁶ × 100 = 1 × 10⁻⁴ J."}, {"id": "y-13", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "An orbital with n = 3 and l = 2 is called:", "options": ["3s", "3p", "3d", "4f"], "correctAnswer": 2, "solution": "l = 0, 1, 2, 3 correspond to s, p, d, f, so l = 2 with n = 3 is 3d."}, {"id": "y-14", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "The number of neutrons in a ¹⁴C atom (Z = 6) is:", "options": ["6", "7", "8", "14"], "correctAnswer": 2, "solution": "Neutrons = mass number − atomic number = 14 − 6 = 8."}, {"id": "y-15", "subject": "chemistry", "chapterId": "chem-bonding", "level": "mains", "source": "Aster practice", "question": "The bond order of O₂ is:", "options": ["1", "1.5", "2", "3"], "correctAnswer": 2, "solution": "By MO theory, bond order = (10 − 6)/2 = 2."}, {"id": "y-16", "subject": "chemistry", "chapterId": "chem-bonding", "level": "mains", "source": "Aster practice", "question": "Which of these molecules is non-polar?", "options": ["CO₂", "H₂O", "NH₃", "HCl"], "correctAnswer": 0, "solution": "CO₂ is linear, so its two bond dipoles cancel."}, {"id": "y-17", "subject": "chemistry", "chapterId": "chem-thermodynamics", "level": "mains", "source": "Aster practice", "question": "The standard enthalpy of formation of an element in its standard state is:", "options": ["1", "0", "−1", "Depends on the element"], "correctAnswer": 1, "solution": "By definition it is zero."}, {"id": "y-18", "subject": "chemistry", "chapterId": "chem-thermodynamics", "level": "mains", "source": "Aster practice", "question": "A system absorbs 100 J of heat and does 40 J of work. ΔU is:", "options": ["140 J", "60 J", "−60 J", "−140 J"], "correctAnswer": 1, "solution": "ΔU = q − w = 100 − 40 = 60 J."}, {"id": "y-19", "subject": "chemistry", "chapterId": "chem-equilibrium", "level": "mains", "source": "Aster practice", "question": "The pH of a 0.01 M HCl solution is:", "options": ["1", "2", "7", "12"], "correctAnswer": 1, "solution": "[H⁺] = 10⁻² M, so pH = 2."}, {"id": "y-20", "subject": "chemistry", "chapterId": "chem-equilibrium", "level": "mains", "source": "Aster practice", "question": "The ionic product of water, Kw, at 25 °C is:", "options": ["1 × 10⁻⁷", "1 × 10⁻¹⁴", "1 × 10⁻¹²", "1 × 10⁻¹"], "correctAnswer": 1, "solution": "Kw = [H⁺][OH⁻] = 10⁻⁷ × 10⁻⁷ = 10⁻¹⁴."}, {"id": "y-21", "subject": "chemistry", "chapterId": "chem-mole-concept", "level": "mains", "source": "Aster practice", "question": "The number of molecules in 0.5 mol of a gas is (Nₐ = 6.022 × 10²³):", "options": ["6.022 × 10²³", "3.011 × 10²³", "1.5 × 10²³", "1.2 × 10²⁴"], "correctAnswer": 1, "solution": "0.5 × 6.022 × 10²³ = 3.011 × 10²³."}, {"id": "y-22", "subject": "chemistry", "chapterId": "chem-mole-concept", "level": "mains", "source": "Aster practice", "question": "The mass of 0.25 mol of CaCO₃ (molar mass 100 g/mol) is:", "options": ["2.5 g", "25 g", "50 g", "100 g"], "correctAnswer": 1, "solution": "Mass = 0.25 × 100 = 25 g."}, {"id": "y-23", "subject": "chemistry", "chapterId": "chem-goc", "level": "mains", "source": "Aster practice", "question": "The IUPAC name of CH₃CH₂CH₂OH is:", "options": ["Ethanol", "Propan-1-ol", "Propan-2-ol", "Butan-1-ol"], "correctAnswer": 1, "solution": "Three carbons with OH on carbon 1."}, {"id": "y-24", "subject": "chemistry", "chapterId": "chem-goc", "level": "mains", "source": "Aster practice", "question": "The number of π electrons in benzene is:", "options": ["4", "6", "8", "10"], "correctAnswer": 1, "solution": "Three double bonds give 6 π electrons, which fits Hückel’s 4n + 2 rule for n = 1."}, {"id": "y-25", "sub ", "source": "Aster practice", "question": "A body has moment of inertia 0.5 kg·m² and angular velocity 4 rad/s. Its angular momentum is:", "options": ["0.5 kg·m²/s", "2 kg·m²/s", "4 kg·m²/s", "8 kg·m²/s"], "correctAnswer": 1, "solution": "L = Iω = 0.5 × 4 = 2 kg·m²/s."}, {"id": "s-5", "subject": "physics", "chapterId": "rotation", "level": "mains", "source": "Aster practice", "question": "A uniform rod of mass M and length L rotates about an axis through one end, perpendicular to the rod. Its moment of inertia is:", "options": ["ML²/12", "ML²/3", "ML²/2", "ML²"], "correctAnswer": 1, "solution": "I(cm) + Md² = ML²/12 + M(L/2)² = ML²/3."}, {"id": "s-6", "subject": "physics", "chapterId": "rotation", "level": "advanced", "source": "Aster practice", "question": "A solid cylinder rolls without slipping down an incline of angle θ. Its acceleration is:", "options": ["g sinθ", "(2/3) g sinθ", "(1/2) g sinθ", "(1/3) g sinθ"], "correctAnswer": 1, "solution": "a = g sinθ / (1 + I/MR²) = g sinθ / (1 + 1/2) = (2/3) g sinθ."}, {"id": "s-7", "subject": "chemistry", "chapterId": "chem-periodic", "level": "mains", "source": "Aster practice", "question": "Which of these ions has the smallest radius?", "options": ["Na⁺", "Mg²⁺", "Al³⁺", "F⁻"], "correctAnswer": 2, "solution": "All are isoelectronic (10 electrons) and Al³⁺ has the highest nuclear charge."}, {"id": "s-8", "subject": "chemistry", "chapterId": "chem-periodic", "level": "mains", "source": "Aster practice", "question": "Which has the higher first ionisation energy, nitrogen or oxygen?", "options": ["Oxygen, because of its higher nuclear charge", "Nitrogen, because of its half-filled 2p subshell", "Both are equal", "Cannot be said"], "correctAnswer": 1, "solution": "A half-filled 2p subshell makes nitrogen extra stable, so removing its electron is harder."}, {"id": "s-9", "subject": "chemistry", "chapterId": "chem-periodic", "level": "mains", "source": "Aster practice", "question": "The element with the most negative electron gain enthalpy is:", "options": ["Fluorine", "Chlorine", "Bromine", "Iodine"], "correctAnswer": 1, "solution": "Fluorine’s small size causes extra repulsion, so chlorine is more negative."}, {"id": "s-10", "subject": "chemistry", "chapterId": "chem-periodic", "level": "mains", "source": "Aster practice", "question": "Lithium shows a diagonal relationship with:", "options": ["Sodium", "Beryllium", "Magnesium", "Aluminium"], "correctAnswer": 2, "solution": "Li–Mg, Be–Al and B–Si are the diagonal pairs."}, {"id": "s-11", "subject": "chemistry", "chapterId": "chem-periodic", "level": "mains", "source": "Aster practice", "question": "Which oxide is amphoteric?", "options": ["Na₂O", "Al₂O₃", "SO₃", "MgO"], "correctAnswer": 1, "solution": "Al₂O₃ reacts with both acids and bases."}, {"id": "s-12", "subject": "chemistry", "chapterId": "chem-periodic", "level": "mains", "source": "Aster practice", "question": "The maximum oxidation state shown by a group 17 element is:", "options": ["+5", "+6", "+7", "+8"], "correctAnswer": 2, "solution": "Group number − 10 = 7."}, {"id": "s-13", "subject": "mathematics", "chapterId": "math-calculus", "level": "mains", "source": "Aster practice", "question": "The derivative of x² sin x is:", "options": ["2x cos x", "2x sin x + x² cos x", "x² cos x", "2x sin x"], "correctAnswer": 1, "solution": "Product rule: 2x · sin x + x² · cos x."}, {"id": "s-14", "subject": "mathematics", "chapterId": "math-calculus", "level": "mains", "source": "Aster practice", "question": "The derivative of e^(2x) is:", "options": ["e^(2x)", "2e^(2x)", "2x e^(2x−1)", "e^(2x) / 2"], "correctAnswer": 1, "solution": "Chain rule: e^(2x) × 2."}, {"id": "s-15", "subject": "mathematics", "chapterId": "math-calculus", "level": "mains", "source": "Aster practice", "question": "The minimum value of f(x) = x² − 4x + 5 is:", "options": ["0", "1", "2", "5"], "correctAnswer": 1, "solution": "f′(x) = 2x − 4 = 0 gives x = 2, and f(2) = 1."}, {"id": "s-16", "subject": "mathematics", " ath-probability", "level": "mains", "source": "Aster practice", "question": "If P(A) = 0.5, P(B) = 0.4 and P(A ∩ B) = 0.2, then P(A ∪ B) is:", "options": ["0.9", "0.7", "0.6", "0.2"], "correctAnswer": 1, "solution": "0.5 + 0.4 − 0.2 = 0.7."}, {"id": "r-14", "subject": "mathematics", "chapterId": "math-probability", "level": "mains", "source": "Aster practice", "question": "If P(A ∩ B) = 0.3 and P(B) = 0.6, then P(A | B) is:", "options": ["0.18", "0.5", "0.9", "2"], "correctAnswer": 1, "solution": "0.3 / 0.6 = 0.5."}, {"id": "r-15", "subject": "mathematics", "chapterId": "math-probability", "level": "mains", "source": "Aster practice", "question": "A fair coin is tossed 4 times. The probability of exactly 2 heads is:", "options": ["1/4", "3/8", "1/2", "5/8"], "correctAnswer": 1, "solution": "⁴C₂ / 2⁴ = 6/16 = 3/8."}, {"id": "r-16", "subject": "mathematics", "chapterId": "math-probability", "level": "mains", "source": "Aster practice", "question": "The mean of a binomial distribution with n = 10 and p = 0.3 is:", "options": ["3", "7", "0.3", "2.1"], "correctAnswer": 0, "solution": "Mean = np = 3."}, {"id": "r-17", "subject": "mathematics", "chapterId": "math-probability", "level": "advanced", "source": "Aster practice", "question": "Bag A has 3 red and 2 blue balls; bag B has 1 red and 4 blue. A bag is chosen at random and a red ball is drawn. The probability that it came from bag A is:", "options": ["1/2", "3/4", "3/5", "1/4"], "correctAnswer": 1, "solution": "Bayes: (½ × 3/5) / (½ × 3/5 + ½ × 1/5) = 3/4."}, {"id": "r-18", "subject": "mathematics", "chapterId": "math-vectors", "level": "mains", "source": "Aster practice", "question": "The cross product i × j equals:", "options": ["0", "k", "−k", "1"], "correctAnswer": 1, "solution": "By the right-hand rule i × j = k."}, {"id": "r-19", "subject": "chemistry", "chapterId": "chem-thermodynamics", "level": "mains", "source": "Aster practice", "question": "Which of these is an intensive property?", "options": ["Mass", "Vo e in a solution with 1 mol solute and 9 mol solvent is:", "options": ["0.1", "0.9", "0.11", "1/9"], "correctAnswer": 0, "solution": "χ = 1 / (1 + 9) = 0.1."}, {"id": "m-5", "subject": "chemistry", "chapterId": "chem-coord", "level": "mains", "source": "Aster practice", "question": "The oxidation state of cobalt in [Co(NH₃)₆]Cl₃ is:", "options": ["+2", "+3", "+6", "+1"], "correctAnswer": 1, "solution": "NH₃ is neutral and three Cl⁻ balance the charge, so Co is +3."}, {"id": "m-6", "subject": "chemistry", "chapterId": "chem-coord", "level": "mains", "source": "Aster practice", "question": "The coordination number of iron in [Fe(CN)₆]⁴⁻ is:", "options": ["4", "6", "2", "3"], "correctAnswer": 1, "solution": "Six cyanide ligands are bonded to the metal."}, {"id": "m-7", "subject": "chemistry", "chapterId": "chem-coord", "level": "mains", "source": "Aster practice", "question": "Which of these is a bidentate ligand?", "options": ["NH₃", "Cl⁻", "Ethylenediamine", "H₂O"], "correctAnswer": 2, "solution": "Ethylenediamine has two nitrogen donor atoms."}, {"id": "m-8", "subject": "chemistry", "chapterId": "chem-coord", "level": "advanced", "source": "Aster practice", "question": "The number of unpaired electrons in [Fe(CN)₆]³⁻ is:", "options": ["1", "3", "5", "0"], "correctAnswer": 0, "solution": "Fe³⁺ is d⁵ and CN⁻ is a strong-field ligand, so the complex is low spin with one unpaired electron."}, {"id": "m-9", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "The shape of XeF₄ is:", "options": ["Tetrahedral", "Square planar", "Octahedral", "See-saw"], "correctAnswer": 1, "solution": "Xenon has four bond pairs and two lone pairs, giving a square planar shape."}, {"id": "m-10", "subject": "chemistry", "chapterId": "chem-pblock", "level": "mains", "source": "Aster practice", "question": "Which is the strongest oxoacid of chlorine?", "options": ["HClO", "HClO₂", "HClO₃", "HClO₄"], "correctAnswer": 3, "solution": "Acid ", "A secondary alcohol", "A tertiary alcohol", "Methanol"], "correctAnswer": 2, "solution": "Tertiary alcohols form the most stable carbocation, so turbidity appears immediately."}, {"id": "m-23", "subject": "chemistry", "chapterId": "chem-kinetics", "level": "mains", "source": "Aster practice", "question": "The unit of the rate constant of a second-order reaction is:", "options": ["s⁻¹", "mol L⁻¹ s⁻¹", "L mol⁻¹ s⁻¹", "mol² L⁻² s⁻¹"], "correctAnswer": 2, "solution": "For order n the unit is (mol/L)^(1−n) s⁻¹, which is L mol⁻¹ s⁻¹ for n = 2."}, {"id": "m-24", "subject": "chemistry", "chapterId": "chem-kinetics", "level": "mains", "source": "Aster practice", "question": "A first-order reaction has k = 0.0231 s⁻¹. Its half-life is:", "options": ["15 s", "30 s", "60 s", "3 s"], "correctAnswer": 1, "solution": "t½ = 0.693 / 0.0231 = 30 s."}, {"id": "m-25", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "The maximum number of electrons in the 3d subshell is:", "options": ["6", "10", "14", "2"], "correctAnswer": 1, "solution": "A d subshell has 5 orbitals, each holding 2 electrons."}, {"id": "m-26", "subject": "chemistry", "chapterId": "chem-atomic-structure", "level": "mains", "source": "Aster practice", "question": "If the momentum of a particle is doubled, its de Broglie wavelength:", "options": ["Doubles", "Halves", "Stays the same", "Becomes four times"], "correctAnswer": 1, "solution": "λ = h/p, so doubling p halves λ."}, {"id": "m-27", "subject": "chemistry", "chapterId": "chem-mole-concept", "level": "mains", "source": "Aster practice", "question": "The mass of 2 moles of H₂SO₄ (molar mass 98 g/mol) is:", "options": ["98 g", "196 g", "49 g", "392 g"], "correctAnswer": 1, "solution": "2 × 98 = 196 g."}, {"id": "m-28", "subject": "chemistry", "chapterId": "chem-redox", "level": "mains", "source": "Aster practice", "question": "The oxidation state of nitrogen in the nitrate ion NO₃⁻ is:", "optio
